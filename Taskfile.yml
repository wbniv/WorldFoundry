      - bash wftools/wf_blender/build_level_binary.sh condo_639_640_touch

  tour-condo-639:
    desc: "Build the self-walking 639 tour: project room → open glass door → patio → guest bedroom → remaining blue rooms"
    deps: [tools-build, condo-textures]
    vars:
      CONDO_BLEND: '{{.CONDO_BLEND | default (printf "%s/docs/aircon/units-639-640.blend" (env "HOME"))}}'
    cmds:
