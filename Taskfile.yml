      - wftools/cdpack-rs/target/release/cdpack wfsource/source/game/shell-menu.fth --manifest wflevels/aquarium-menu.manifest -o wflevels/aquarium-menu-cd.iff

  build-cd-iff-condo:
    desc: "Assemble the condo-only cd.iff (shell.fth boots TOC level 0 = wflevels/condo_639_640-standalone.iff) via cdpack-rs → wflevels/condo-cd.iff, or CD_OUT=<path>. The Android condo app bundles it (docs/plans/2026-10-01-condo-chromecast.md)"
    vars:
      CD_OUT: '{{.CD_OUT | default "wflevels/condo-cd.iff"}}'
    cmds:
      - cargo build --release --manifest-path wftools/cdpack-rs/Cargo.toml
      # Same recipe as build-cd-iff-aquarium. The tracked wflevels/condo-cd.iff is checked against
      # wflevels/condo_639_640-standalone.iff by tests/test_condo_android.py: rebuild it whenever the level changes.
      - mkdir -p "$(dirname '{{.CD_OUT}}')"
      - wftools/cdpack-rs/target/release/cdpack wfsource/source/game/shell.fth wflevels/condo_639_640-standalone.iff -o '{{.CD_OUT}}'

  # One cd.iff per game for the Android apps (docs/plans/2026-10-01-split-cd-iff-one-app-per-game.md); the desktop's
  # multi-level build-cd-iff above is unchanged. Same recipe as build-cd-iff-condo. The tracked outputs are checked against
  # today's standalone levels by tests/test_game_apps_android.py: rebuild whenever one of the levels changes.
  build-cd-iff-smb:
    desc: "Assemble the SMB cd.iff (TOC 0..3 = W1-1..W1-4, the same indices as the desktop bundle, so the flag/axe LEVEL_TO_RUN chain 1, 2, 3, 0 is unchanged) via cdpack-rs → wflevels/smb-cd.iff, or CD_OUT=<path>. The Android smb app bundles it"
    vars:
      CD_OUT: '{{.CD_OUT | default "wflevels/smb-cd.iff"}}'
    cmds:
      - cargo build --release --manifest-path wftools/cdpack-rs/Cargo.toml
      - mkdir -p "$(dirname '{{.CD_OUT}}')"
      - wftools/cdpack-rs/target/release/cdpack wfsource/source/game/shell.fth wflevels/smb_w1_1-standalone.iff wflevels/smb_w1_2-standalone.iff wflevels/smb_w1_3-standalone.iff wflevels/smb_w1_4-standalone.iff -o '{{.CD_OUT}}'

  build-cd-iff-snowgoons:
    desc: "Assemble the snowgoons-only cd.iff (TOC 0 = wflevels/snowgoons-standalone.iff, which writes no LEVEL_TO_RUN) via cdpack-rs → wflevels/snowgoons-cd.iff, or CD_OUT=<path>. The Android snowgoons app (org.worldfoundry.wf_game) bundles it"
    vars:
      CD_OUT: '{{.CD_OUT | default "wflevels/snowgoons-cd.iff"}}'
    cmds:
      - cargo build --release --manifest-path wftools/cdpack-rs/Cargo.toml
      - mkdir -p "$(dirname '{{.CD_OUT}}')"
      - wftools/cdpack-rs/target/release/cdpack wfsource/source/game/shell.fth wflevels/snowgoons-standalone.iff -o '{{.CD_OUT}}'

  build-cd-iff-qbert:
    desc: "Assemble the Q*bert-only cd.iff (TOC 0 = wflevels/qbert_practice-standalone.iff, which writes no LEVEL_TO_RUN) via cdpack-rs → wflevels/qbert-cd.iff, or CD_OUT=<path>. The Android qbert app bundles it"
    vars:
      CD_OUT: '{{.CD_OUT | default "wflevels/qbert-cd.iff"}}'
    cmds:
      - cargo build --release --manifest-path wftools/cdpack-rs/Cargo.toml
      - mkdir -p "$(dirname '{{.CD_OUT}}')"
      - wftools/cdpack-rs/target/release/cdpack wfsource/source/game/shell.fth wflevels/qbert_practice-standalone.iff -o '{{.CD_OUT}}'

  run-marble-3d-astra:
    desc: "Run Astra Marble Madness from cd.iff (level 6; arrows roll, Space restarts)"
    deps: [ensure-build]
    dir: wfsource/source/game
    cmds:
      - LD_LIBRARY_PATH=../../../engine/libs DISPLAY=${DISPLAY:-:0} ../../../engine/wf_game {{.CLI_ARGS}} 6

  run-qbert:
    desc: "Run wf_game on wflevels/qbert_practice-standalone.iff directly (bypass cd.iff). WF_RECORD=1 records video. WF_FULLSCREEN=1 for fullscreen."
    deps: [ensure-build]
    cmds:
      - |
        LOG=/tmp/wfgame_qbert.log
        echo "Logging to $LOG"
        RECFLAG=""; RECOUT=""; FSFLAG=""
        if [ -n "${WF_RECORD:-}" ]; then
          RECOUT="${WF_RECORD}"; [ "$RECOUT" = "1" ] && RECOUT="$(date +%Y%m%d_%H%M%S)_qbert.mp4"
          RECFLAG="-record_video"; echo "Recording → $RECOUT"
        fi
        [ "${WF_FULLSCREEN:-}" = "1" ] && FSFLAG="-fullscreen"
        LD_LIBRARY_PATH=engine/libs DISPLAY=:0 engine/wf_game -Lwflevels/qbert_practice-standalone.iff $FSFLAG $RECFLAG 2>&1 | tee "$LOG"
        [ -n "$RECOUT" ] && [ -f output.mp4 ] && mv output.mp4 "$RECOUT" && echo "Saved → $RECOUT"

  run-smb:
    desc: "Run wf_game on wflevels/smb_w1_1-standalone.iff directly (bypass cd.iff). WF_RECORD=1 records video. WF_FULLSCREEN=1 for fullscreen."
    deps: [ensure-build]
    cmds:
      - |
        LOG=/tmp/wfgame_smb.log
        echo "Logging to $LOG"
        RECFLAG=""; RECOUT=""; FSFLAG=""
        if [ -n "${WF_RECORD:-}" ]; then
          RECOUT="${WF_RECORD}"; [ "$RECOUT" = "1" ] && RECOUT="$(date +%Y%m%d_%H%M%S)_smb.mp4"
          RECFLAG="-record_video"; echo "Recording → $RECOUT"
        fi
        [ "${WF_FULLSCREEN:-}" = "1" ] && FSFLAG="-fullscreen"
        LD_LIBRARY_PATH=engine/libs DISPLAY=:0 engine/wf_game -Lwflevels/smb_w1_1-standalone.iff $FSFLAG $RECFLAG 2>&1 | tee "$LOG"
        [ -n "$RECOUT" ] && [ -f output.mp4 ] && mv output.mp4 "$RECOUT" && echo "Saved → $RECOUT"

  condo-osm-fetch:
    desc: "Refresh wflevels/condo_639_640/site-osm.json from Overpass (network; the committed copy makes builds offline + byte-stable)"
    cmds:
      - python3 wflevels/condo_639_640/make_site_textures.py fetch

  condo-textures:
    desc: "Render the condo site skybox textures (condo_sky.tga, condo_ground.tga) from site-osm.json — offline, byte-stable"
    cmds:
      - python3 wflevels/condo_639_640/make_site_textures.py render
    sources:
      - wflevels/condo_639_640/make_site_textures.py
      - wflevels/condo_639_640/site_constants.py
      - wflevels/condo_639_640/site-osm.json
    generates:
      - wflevels/condo_639_640/condo_sky.tga
      - wflevels/condo_639_640/condo_ground.tga

  condo-level:
    desc: "Condo 205/639+640 walkthrough: convert ~/docs/aircon/units-639-640.blend (CONDO_BLEND= to override) → wflevels/condo_639_640 → standalone .iff. Needs the wf_blender add-on installed."
    deps: [tools-build, condo-textures]
    vars:
      # Task does not expand $HOME inside `sources:` globs — use the template env lookup.
      CONDO_BLEND: '{{.CONDO_BLEND | default (printf "%s/docs/aircon/units-639-640.blend" (env "HOME"))}}'
    cmds:
      - |
        set -euo pipefail
        blender --background --python-expr "import addon_utils; raise SystemExit(0 if addon_utils.enable('wf_blender', default_set=False, persistent=False) else 1)" >/dev/null 2>&1 \
          || { echo "wf_blender add-on not installed — 'sudo apt install worldfoundry-blender-editor-exporter' (apt.worldfoundry.org) or 'task blender-install'" >&2; exit 1; }
        blender --background --python-exit-code 1 \
          --python wflevels/condo_639_640/blender_create_condo.py -- "{{.CONDO_BLEND}}" \
          2>&1 | { grep -E '^\[condo\]|^Info: Exported|Error|Traceback|Assert' || true; }
        # pipefail above: a failing Blender step fails the task (a bare `|| true` used to mask it
        # and let the previous .lev through to build-level).
        test -s wflevels/condo_639_640/condo_639_640.lev
      - bash wftools/wf_blender/build_level_binary.sh condo_639_640
    sources:
      - wflevels/condo_639_640/blender_create_condo.py
      - wflevels/condo_639_640/camera_controls.fth
      - wflevels/condo_639_640/site_constants.py
      - wflevels/condo_639_640/condo_sky.tga
      - wflevels/condo_639_640/condo_ground.tga
      - wflevels/condo_639_640/textile.flags
      - wflevels/condo_639_640/condo_639_640-standalone.iff.txt
      - '{{.CONDO_BLEND}}'
    generates:
      - wflevels/condo_639_640-standalone.iff

  aquarium-level:
    desc: "Aquarium (55 gal acrylic tank, sand, rock, anemone, the canonical clownfish, camshots A + B; docs/plans/2026-09-30-aquarium-level.md): Blender build → wflevels/aquarium → standalone .iff, keyboard/gamepad profile. Needs the wf_blender add-on installed."
    deps: [tools-build]
    cmds:
      - |
        set -euo pipefail
        blender --background --python-expr "import addon_utils; raise SystemExit(0 if addon_utils.enable('wf_blender', default_set=False, persistent=False) else 1)" >/dev/null 2>&1 \
          || { echo "wf_blender add-on not installed — 'sudo apt install worldfoundry-blender-editor-exporter' (apt.worldfoundry.org) or 'task blender-install'" >&2; exit 1; }
        AQUARIUM_PROFILE=keyboard blender --background --python-exit-code 1 \
          --python wflevels/aquarium/blender_create_aquarium.py \
          2>&1 | { grep -E '^\[aquarium\]|^Info: Exported|Error|Traceback|Assert' || true; }
        test -s wflevels/aquarium/aquarium.lev
      - bash wftools/wf_blender/build_level_binary.sh aquarium
      # Keep the aquarium-only cd.iff (the Android/macOS/iOS aquarium apps' bundle) in step with the level.
      - task: build-cd-iff-aquarium
    sources:
      - wflevels/aquarium/blender_create_aquarium.py
      - wflevels/aquarium/aquarium_constants.py
      - wflevels/aquarium/aquarium_swim.fth
      - wflevels/aquarium/clownfish.py
      - wflevels/aquarium/clownfish_idle.fth
      - wflevels/aquarium/school.fth
      - wflevels/aquarium/school_rig.fth
      - wflevels/aquarium/barb_school_rig.fth
      - wflevels/aquarium/tiger_barb.py
      - wflevels/aquarium/art/tiger-barb-source.png
      - wflevels/aquarium/aquarium-standalone.iff.txt
      - wflevels/snowgoons-blender/snowgoons-blender.lev
    generates:
      - wflevels/aquarium/aquarium.lev
      - wflevels/aquarium.iff
      - wflevels/aquarium-standalone.iff
      - wflevels/aquarium-cd.iff

