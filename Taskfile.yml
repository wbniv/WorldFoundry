    desc: "Aquarium, touch profile (phone landscape: D-pad + A/B; A cycles Swim → Depth mode, B darts) → wflevels/aquarium_touch-standalone.iff (git-ignored, regenerable). Run: LD_LIBRARY_PATH=engine/libs engine/wf_game -Lwflevels/aquarium_touch-standalone.iff"
    deps: [tools-build]
