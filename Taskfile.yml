  aquarium-idle-probe-level:
    desc: "ROTATION_* write probe for the aquarium plan (visible Physics fish, Director-rotated statplat, self-rotating anchored platform) → wflevels/aquarium_idle_probe-standalone.iff"
    deps: [tools-build]
    cmds:
      - |
        set -euo pipefail
        IDLE_PROBE=1 blender --background --python-exit-code 1 \
          --python wflevels/aquarium_idle/blender_create_aquarium_idle.py \
          2>&1 | { grep -E '^\[aquarium_idle\]|^Info: Exported|Error|Traceback|Assert' || true; }
        test -s wflevels/aquarium_idle_probe/aquarium_idle_probe.lev
      - bash wftools/wf_blender/build_level_binary.sh aquarium_idle_probe
    sources:
      - wflevels/aquarium_idle/blender_create_aquarium_idle.py
      - wflevels/aquarium_idle/aquarium_idle-standalone.iff.txt
      - wflevels/aquarium/clownfish.py
    generates:
      - wflevels/aquarium_idle_probe-standalone.iff

  run-aquarium-idle:
    desc: "Run the clownfish idle spike: arrows swim, let go and it hovers. WF_RECORD=1 records video. WF_FULLSCREEN=1 for fullscreen."
    deps: [ensure-build, aquarium-idle-level]
    cmds:
      - |
        LOG=/tmp/wfgame_aquarium_idle.log
        echo "Logging to $LOG"
        RECFLAG=""; RECOUT=""; FSFLAG=""
        if [ -n "${WF_RECORD:-}" ]; then
          RECOUT="${WF_RECORD}"; [ "$RECOUT" = "1" ] && RECOUT="$(date +%Y%m%d_%H%M%S)_aquarium_idle.mp4"
          RECFLAG="-record_video"; echo "Recording → $RECOUT"
        fi
        [ "${WF_FULLSCREEN:-}" = "1" ] && FSFLAG="-fullscreen"
        LD_LIBRARY_PATH=engine/libs DISPLAY=${DISPLAY:-:0} engine/wf_game \
          -Lwflevels/aquarium_idle-standalone.iff $FSFLAG $RECFLAG 2>&1 | tee "$LOG"
        [ -n "$RECOUT" ] && [ -f output.mp4 ] && mv output.mp4 "$RECOUT" && echo "Saved → $RECOUT"

  test-aquarium-idle:
    desc: "Regression guard for the clownfish idle rig: static .lev checks, bridge trace, captures, ROTATION_* probe (needs a display)"
    deps: [ensure-build, aquarium-idle-level, aquarium-idle-probe-level]
    cmds:
      - python3 -m pytest tests/test_aquarium_idle.py -v

  poster-clownfish-biomechanics:
    desc: "Clownfish biomechanics poster, A3 (docs/plans/2026-09-30-clownfish-biomechanics-poster.md): data sheet + the aquarium constants → docs/reference/clownfish-biomechanics-poster/{data.json,poster.html,poster.pdf,poster.png}. A no-op when up to date. Needs google-chrome and pdftoppm."
    cmds:
      - python3 docs/reference/clownfish-biomechanics-poster/make_poster.py
    sources:
      - docs/reference/clownfish-biomechanics-poster/make_poster.py
      - docs/reference/clownfish-biomechanics-poster/data.py
      - wflevels/aquarium/aquarium_constants.py
      - wflevels/aquarium/clownfish.py
      - wflevels/aquarium/run_aquarium_checks.py
    generates:
      - docs/reference/clownfish-biomechanics-poster/data.json
      - docs/reference/clownfish-biomechanics-poster/poster.html
      - docs/reference/clownfish-biomechanics-poster/poster.pdf
      - docs/reference/clownfish-biomechanics-poster/poster.png
    status:
      # the checksum on `sources` decides staleness; this only catches a deleted or empty output
      - test -s docs/reference/clownfish-biomechanics-poster/poster.html
      - test -s docs/reference/clownfish-biomechanics-poster/poster.pdf
      - test -s docs/reference/clownfish-biomechanics-poster/poster.png

  test-poster-clownfish-biomechanics:
    desc: "Regression guard for the clownfish poster: chips vs the code's labels, values vs the constants, what the diagrams draw, type size, contrast, PDF page/fonts/links"
    cmds:
      - python3 -m pytest tests/test_poster_clownfish_biomechanics.py -v

  poster-swarming:
    desc: "Swarming poster, A3 (docs/plans/2026-10-01-swarming-poster.md): sweep.json, tank.json, measured.json, school.fth and the Couzin snapshots → docs/reference/swarming-poster/{data.json,schooling-poster.html,schooling-poster.pdf,schooling-poster.png}. Recompute the inputs with `task swarming-measure`. Needs google-chrome and pdftoppm."
    cmds:
      - python3 docs/reference/swarming-poster/make_swarm_poster.py
    sources:
      - docs/reference/swarming-poster/make_swarm_poster.py
      - docs/reference/swarming-poster/swarm_data.py
      - docs/reference/swarming-poster/sweep.json
      - docs/reference/swarming-poster/tank.json
      - docs/reference/swarming-poster/measured.json
      - docs/reference/swarming-poster/snapshots.json
      - wflevels/aquarium/school.fth
    generates:
      - docs/reference/swarming-poster/schooling-poster.html
      - docs/reference/swarming-poster/schooling-poster.pdf
      - docs/reference/swarming-poster/schooling-poster.png
    status:
      - test -s docs/reference/swarming-poster/schooling-poster.html
      - test -s docs/reference/swarming-poster/schooling-poster.pdf
      - test -s docs/reference/swarming-poster/schooling-poster.png

  swarming-measure:
    desc: "Recompute the swarming poster's inputs: the zone-width sweep (about 6 min), the Forth tank runs (about 5 min) and the size/error/timing of school.fth (add the Chromecast figure with docs/reference/swarming-poster/device_bench.sh then `measure.py --device-ms ...`)"
    cmds:
      - python3 docs/reference/swarming-poster/sweep.py
      - python3 docs/reference/swarming-poster/tank_results.py
      - python3 docs/reference/swarming-poster/measure.py
      - python3 docs/reference/swarming-poster/make_swarm_poster.py --resim

  test-swarming:
    desc: "Regression guard for the swarming work: the Couzin reference model, school.fth against it in the engine's own zForth (one tick at a time), the startle, and the poster (type size, contrast, links, fit)"
    cmds:
      - python3 -m pytest tests/test_swarming.py -v

  run-moon:
    desc: "Run wf_game on wflevels/moon_site01-standalone.iff (PGDA Site 01 Connecting Ridge — LOLA terrain + NAC texture at 1024², lunar gravity). WF_RECORD=1 records video. WF_FULLSCREEN=1 for fullscreen."
    deps: [ensure-build]
    cmds:
      # 1024² NAC composite — needs the wider transient VRAM slot (Phase 1-3
      # of docs/plans/2026-05-30-runtime-vram-cli-overrides.md) AND the
      # int16 UV pipeline (docs/plans/2026-05-30-uv-int16-widening.md).
      # --vram-perm-width/height: PERM atlas includes starfield.tga (512×256)
      # + earth.tga (128×64), packing to ~640×256 by textile-rs — exceeds the
      # 256-pixel VRAMPermanentWidth default (see docs/plans/2026-06-01-...).
      - |
        LOG=/tmp/wfgame_moon.log
        echo "Logging to $LOG"
        RECFLAG=""; RECOUT=""; FSFLAG=""
        if [ -n "${WF_RECORD:-}" ]; then
          RECOUT="${WF_RECORD}"; [ "$RECOUT" = "1" ] && RECOUT="$(date +%Y%m%d_%H%M%S)_moon.mp4"
          RECFLAG="-record_video"; echo "Recording → $RECOUT"
        fi
        [ "${WF_FULLSCREEN:-}" = "1" ] && FSFLAG="-fullscreen"
        LD_LIBRARY_PATH=engine/libs DISPLAY=:0 engine/wf_game \
          --vram-width=4096 --vram-height=2048 \
          --vram-slot-width=1024 --vram-slot-height=1024 \
          --vram-perm-width=1024 --vram-perm-height=512 \
          -Lwflevels/moon_site01-standalone.iff \
          $FSFLAG $RECFLAG 2>&1 | tee "$LOG"
        [ -n "$RECOUT" ] && [ -f output.mp4 ] && mv output.mp4 "$RECOUT" && echo "Saved → $RECOUT"

  run-debug:
    desc: "Run wf_game with debug bridge on port 7777 (usage: task run-debug -- wflevels/snowgoons.iff)"
    deps: [ensure-build]
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        if [ -z "${1:-}" ]; then
          echo "Usage: task run-debug -- <path/to/level.iff>" >&2
          exit 1
        fi
        LEVEL="$1"; shift
        LOG=/tmp/wfgame_debug.log
        echo "Logging to $LOG"
        LD_LIBRARY_PATH=engine/libs DISPLAY=:0 \
          engine/wf_game "-L$LEVEL" "$@" --debug-port 7777 --debug-bind 127.0.0.1 --debug-print-actors \
          2>&1 | tee "$LOG"

  run-debug-remote:
    desc: "Run wf_game with debug bridge open on all interfaces (remote device / CI; usage: task run-debug-remote -- wflevels/snowgoons.iff)"
    deps: [ensure-build]
    cmds:
      - |
        ARGS="{{.CLI_ARGS}}"
        if [ -z "$ARGS" ]; then
          echo "Usage: task run-debug-remote -- <path/to/level.iff>" >&2
          exit 1
        fi
        LOG=/tmp/wfgame_debug_remote.log
        echo "Logging to $LOG"
        LD_LIBRARY_PATH=engine/libs DISPLAY=:0 \
          engine/wf_game "-L$ARGS" --debug-port 7777 --debug-bind 0.0.0.0 \
          2>&1 | tee "$LOG"

  dev-setup:
    desc: "Install runtime dev dependencies (Linux build + Android toolchain)"
    cmds:
      - |
        sudo apt-get install -y \
          build-essential \
          cmake \
          libx11-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          gdb \
          xxd \
          python3 \
          openjdk-17-jdk \
          adb \
          google-android-ndk-r26c-installer

  dev-setup-editor:
    desc: "Install editor-only dev dependencies (wf-edit: TLS for wss:// signaling, WebRTC VP8/VP9 video, quick-tunnel calling)"
    deps: [dev-setup, fetch-cloudflared]
    cmds:
      - sudo apt-get install -y libssl-dev libvpx-dev

  dev-setup-web-edit:
    desc: "One-time: provision the wasm Rust toolchain for the WASM editor (rustup 1.85.1 + wasm32-unknown-emscripten, isolated from your global rust) + emsdk + the yrs emscripten patch. See docs/plans/2026-06-12-wf-edit-in-the-browser.md Phase 0."
    deps: [setup-emsdk]
    silent: true
    status:
      # Skip when the wasm std AND the yrs patch are both already in place.
      - test -d "${RUSTUP_HOME:-$HOME/.rustup}/toolchains/1.85.1-x86_64-unknown-linux-gnu/lib/rustlib/wasm32-unknown-emscripten"
      - git -C wftools/y-crdt apply --reverse --check ../../docs/patches/yrs-0.26-undo-options-default-emscripten.patch
    cmds:
      - |
        set -euo pipefail
        # The y-crdt submodule must be present for the patch step.
        git submodule update --init wftools/y-crdt >/dev/null 2>&1 || true
        export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
        RUSTUP="$CARGO_HOME/bin/rustup"
        # Distro rust (/usr/bin/rustc) has no wasm std and isn't rustup-managed. Install rustup
        # ISOLATED (no PATH/profile change) so the global toolchain is untouched; the web build
        # selects this toolchain explicitly. Fully reversible via `rustup self uninstall`.
        if [ ! -x "$RUSTUP" ] && ! command -v rustup >/dev/null 2>&1; then
          echo "rustup not found — installing isolated (distro rust untouched)…"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain 1.85.1
        fi
        [ -x "$RUSTUP" ] || RUSTUP="$(command -v rustup)"
        # Pin 1.85.1 — matches the distro rustc the native editor builds with (known-good against
        # the vendored yrs 0.26). build-web-edit uses THIS toolchain, not the global default.
        "$RUSTUP" toolchain install 1.85.1 --profile minimal
        "$RUSTUP" target add --toolchain 1.85.1 wasm32-unknown-emscripten
        # Apply the yrs emscripten cfg patch to the submodule (idempotent). Upstream gates
        # Options::default() on `not(target_family="wasm")`, which over-broadly excludes
        # emscripten; the patch narrows it to match the SystemClock gate. Without it, yffi's
        # yundo_manager fails to cross-compile for wasm32-unknown-emscripten.
        P=../../docs/patches/yrs-0.26-undo-options-default-emscripten.patch
        if git -C wftools/y-crdt apply --reverse --check "$P" >/dev/null 2>&1; then
          echo "yrs emscripten patch already applied"
        elif git -C wftools/y-crdt apply --check "$P" >/dev/null 2>&1; then
          git -C wftools/y-crdt apply "$P"; echo "applied yrs emscripten patch"
        else
          echo "WARNING: yrs patch neither applies nor is applied — y-crdt submodule may have drifted from yrs 0.26" >&2
        fi
        echo "✓ web-edit toolchain ready (rustup 1.85.1 + wasm32-unknown-emscripten; yrs patched; emsdk via dep)"

  blender:
    desc: "Launch Blender, print logs to terminal and capture to /tmp/blender.log"
    cmds:
      - blender 2>&1 | tee /tmp/blender.log

  git:
    desc: "Browse git branches as a waypoint pipeline (curses TUI)"
    interactive: true
    cmds:
      - python3 scripts/git-branch-browser.py

  wf-asset:
    desc: "Run the wf-asset CLI (usage: task wf-asset -- search 'tree')"
    cmds:
      - python3 wftools/wf_asset.py {{.CLI_ARGS}}

  blender-build:
    desc: "Build wf_core Rust native lib for the Blender addon"
    sources:
      - wftools/wf_py/src/**/*.rs
      - wftools/wf_py/Cargo.toml
    generates:
      - wftools/wf_py/target/wheels/wf_core*.whl
    cmds:
      - cd wftools/wf_py && maturin build --release

  blender-install:
    desc: "Install World Foundry level editor addon (symlinks .py, copies wf_core.so; builds if needed)"
    deps: [blender-build]
    cmds:
      - bash wftools/wf_blender/install.sh

  blender-validate:
    desc: "Validate the Blender extension manifest (requires Blender 4.2+)"
    cmds:
      - blender --command extension validate wftools/wf_blender

  asset-browser-install:
    desc: "Install wf_asset_browser addon for development (symlinks, no build step)"
    cmds:
      - bash wftools/wf_asset_browser/install.sh

  asset-browser-install-zip:
    desc: "Install the built wf_asset_browser zip into Blender (REPO=user_default)"
    summary: |
      Installs the packaged zip into Blender's extension system and enables it.

      Usage:
        task asset-browser-install-zip                   # installs into user_default repo
        task asset-browser-install-zip REPO=blender_org  # install into a different repo

      To list available repos: blender --command extension repo-list
    vars:
      REPO: '{{default "user_default" .REPO}}'
      ZIP:
        sh: ls dist/wf_asset_browser-*.zip 2>/dev/null | sort -V | tail -1
    cmds:
      - blender --command extension install-file -r {{.REPO}} -e {{.ZIP}}

  asset-browser-validate:
    desc: "Validate wf_asset_browser extension manifest (requires Blender 4.2+)"
    cmds:
      - blender --command extension validate wftools/wf_asset_browser

  asset-browser-package:
    desc: "Build distributable wf_asset_browser zip; output in dist/"
    deps: [asset-browser-validate]
    cmds:
      - mkdir -p dist
      - blender --command extension build --source-dir wftools/wf_asset_browser --output-dir dist
      - echo "Package written to dist/"

  bump-asset-browser:
    desc: "Bump wf_asset_browser version (default: patch)"
    summary: |
      Increment the wf_asset_browser version in blender_manifest.toml.

      Usage:
        task bump-asset-browser              # patch:  0.2.0 → 0.2.1
        task bump-asset-browser BUMP=minor   # minor:  0.2.0 → 0.3.0  (resets patch)
        task bump-asset-browser BUMP=major   # major:  0.2.0 → 1.0.0  (resets minor + patch)
        task bump-asset-browser -- 1.5.0    # explicit version override
    vars:
      BUMP: '{{default "patch" .BUMP}}'
      NEW_VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            cur=$(grep '^version' wftools/wf_asset_browser/blender_manifest.toml | cut -d'"' -f2)
            major=$(echo "$cur" | cut -d. -f1)
            minor=$(echo "$cur" | cut -d. -f2)
            patch=$(echo "$cur" | cut -d. -f3)
            case "{{.BUMP}}" in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "$major.$((minor + 1)).0" ;;
              *)     echo "$major.$minor.$((patch + 1))" ;;
            esac
          fi
    cmds:
      - sed -i 's/^version = .*/version = "{{.NEW_VERSION}}"/' wftools/wf_asset_browser/blender_manifest.toml
      - grep '^version' wftools/wf_asset_browser/blender_manifest.toml

  publish-asset-browser:
    desc: "Create a GitHub release for wf_asset_browser and attach the zip"
    deps: [asset-browser-package]
    vars:
      VERSION:
        sh: grep '^version' wftools/wf_asset_browser/blender_manifest.toml | cut -d'"' -f2
    cmds:
      - gh release create "asset-browser-v{{.VERSION}}"
          --title "Asset Browser v{{.VERSION}}"
          --notes "Licence-aware asset browser — pure Python, no build step required."
          dist/wf_asset_browser-{{.VERSION}}.zip

  package-all:
    desc: "Package both Blender addons into dist/"
    deps: [asset-browser-package, blender-package]

  blender-package:
    desc: "Build distributable .zip (Blender extension format); output in dist/"
    deps: [blender-build, blender-validate]
    cmds:
      - mkdir -p dist
      - |
        set -euo pipefail
        WF_CORE_WHEEL=$(find wftools/wf_py/target/wheels -name "wf_core*.whl" | sort | tail -1)
        python3 -c "
        import zipfile, shutil, sys
        with zipfile.ZipFile('$WF_CORE_WHEEL') as z:
            sos = [n for n in z.namelist() if n.endswith('.so')]
            if not sos:
                print('No .so in wheel', file=sys.stderr); sys.exit(1)
            z.extract(sos[0], '/tmp/')
            shutil.copy('/tmp/' + sos[0], 'wftools/wf_blender/wf_core.so')
        "
      - blender --command extension build --source-dir wftools/wf_blender --output-dir dist
      - echo "Package written to dist/"

  test-cycle:
    desc: "Run Load/Unload cycle stability tests (CTest, includes host-GL e2e)"
    cmds:
      - cmake -S . -B cmake-build-linux
      - cmake --build cmake-build-linux -j --target wf_game wf_host_gl_e2e_test
      - cd cmake-build-linux && ctest --output-on-failure -R "cycle"

  test-cycle-headless:
    desc: "Cycle tests, skipping GL/X11 tests (CI-safe)"
    cmds:
      - cmake -S . -B cmake-build-linux
      - cmake --build cmake-build-linux -j --target wf_game
      - cd cmake-build-linux && ctest --output-on-failure -R "cycle" -LE gl

  test-wfmut:
    desc: "Run the wfmut:: mutation-API tests (smoke + live-bridge regression; needs DISPLAY)"
    cmds:
      - cmake -S . -B cmake-build-linux
      - cmake --build cmake-build-linux -j --target wf_game
      - cd cmake-build-linux && ctest --output-on-failure -R "wfmut"

  gen-oas-headers:
    desc: "Regenerate wfsource/source/oas/*.ht + objects.{c,e,h} from .oas sources (builds prep if absent)"
    cmds:
      - bash wfsource/source/oas/regen-headers.sh

  test-codegen:
    desc: "Oracle test: verify all .ht + objects.{c,e,h} reproduce byte-for-byte from sources (.oad + .ht pipelines)"
    cmds:
      - cargo test --manifest-path wftools/oas2oad-rs/Cargo.toml

  test-wfmut-asan:
    desc: "Build wfmut under ASan + UBSan and run the smoke (pre-merge leak/UB gate; needs DISPLAY)"
    cmds:
      # NB: the ASan build writes engine/wf_game in place (RUNTIME_OUTPUT_DIRECTORY),
      # overwriting the regular binary — rebuild with `task build` afterward.
      - cmake -S . -B cmake-build-asan -DCMAKE_BUILD_TYPE=Debug -DWF_ASAN=ON
      - cmake --build cmake-build-asan -j --target wf_game
      - cd wfsource/source/game && DISPLAY=:0 ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ../../../engine/wf_game -L../../../wflevels/smb_w1_1-standalone.iff --wfmut-smoke

  # ─── Level menu (docs/plans/2026-10-01-level-menu-selector.md) ──────────────
  build-cd-iff-smb-menu:
    desc: "Assemble the SMB world-select bundle: shell-menu.fth + the four SMB levels at smb-cd.iff's TOC indices + a MENU chunk (names from wflevels/smb-menu.manifest) via cdpack-rs → wflevels/smb-menu-cd.iff, or CD_OUT=<path>. Opt-in; build-cd-iff-smb is unchanged"
    vars:
      CD_OUT: '{{.CD_OUT | default "wflevels/smb-menu-cd.iff"}}'
    cmds:
      - cargo build --release --manifest-path wftools/cdpack-rs/Cargo.toml
      - mkdir -p "$(dirname '{{.CD_OUT}}')"
      # The manifest lists the levels (paths relative to it) and their menu names; shell-menu.fth
      # writes LEVEL_TO_RUN = -1 so the engine shows the menu (game/level_menu.cc).
      - wftools/cdpack-rs/target/release/cdpack wfsource/source/game/shell-menu.fth --manifest wflevels/smb-menu.manifest -o '{{.CD_OUT}}'

  run-smb-menu:
    desc: "Run wf_game on the SMB world-select bundle (from build-smb-menu/, gitignored): Up/Down choose, Space starts, Backspace in a level returns to the menu"
    deps: [ensure-build, build-cd-iff-smb-menu]
    cmds:
      - mkdir -p build-smb-menu
      - cp wflevels/smb-menu-cd.iff build-smb-menu/cd.iff
      - cd build-smb-menu && LD_LIBRARY_PATH=../engine/libs DISPLAY=${DISPLAY:-:0} ../engine/wf_game {{.CLI_ARGS}}

  test-level-menu:
    desc: "Level-menu tests: cdpack byte-identity and MENU chunk, the menu module under ASan/UBSan, scripted input, and the real engine on the desktop display (skipped without DISPLAY)"
    cmds:
      - python3 -m pytest tests/test_level_menu.py -v
