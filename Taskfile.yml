        fi
        [ "${WF_FULLSCREEN:-}" = "1" ] && FSFLAG="-fullscreen"
        LD_LIBRARY_PATH=engine/libs DISPLAY="${DISPLAY:-:0}" engine/wf_game \
          -Lwflevels/aquarium-standalone.iff $FSFLAG $RECFLAG 2>&1 | tee "$LOG"
        if [ -n "$RECOUT" ] && [ -f output.mp4 ]; then mv output.mp4 "$RECOUT" && echo "Saved → $RECOUT"; fi

  video-aquarium:
    desc: "Record the aquarium steer-and-swim demo in real time (640x480, injected input, CLEAN runs only) → ~/tmp/aquarium-phase4/motion-demo.mp4 + .srt + .txt segment list. AQUARIUM_VIDEO=path overrides."
    deps: [ensure-build, aquarium-level]
    cmds:
