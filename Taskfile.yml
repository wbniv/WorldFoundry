    desc: "Assemble the Android APKs, one per app flavor (snowgoons, aquarium, condo, smb, qbert) (release: -O3 + LTO + section GC; debug-keystore signed for sideload)"
    deps: [android-sdk-install, build-cd-iff-aquarium-menu]
    dir: android
