  video-condo-639:
    desc: "Record the 639 tour (including opening the project-room glass door, crossing to the patio, then entering the guest bedroom) → tour-639.mp4 + .srt. TOUR_SECONDS=N (default 40; 0 = real time); TOUR_SIZE=WxH (default 640x480)."
    deps: [ensure-build, tour-condo-639]
    cmds:
      - python3 tests/record_condo_639_tour.py --seconds "${TOUR_SECONDS:-40}" --size "${TOUR_SIZE:-640x480}" --timeout "${TOUR_TIMEOUT:-1800}"
    sources:
      - wflevels/condo_639_640_tour-standalone.iff
      - wflevels/condo_639_640/tour-639.path.json
      - tests/record_condo_639_tour.py
    generates:
      - wflevels/condo_639_640/tour-639.mp4
      - wflevels/condo_639_640/tour-639.srt
      - wflevels/condo_639_640/tour-639.srt

  run-condo:
    desc: "Run wf_game on wflevels/condo_639_640-standalone.iff (condo 205/639+640 doll-house walkthrough). WF_RECORD=1 records video. WF_FULLSCREEN=1 for fullscreen."
    deps: [ensure-build]
    cmds:
      - |
        LOG=/tmp/wfgame_condo.log
        echo "Logging to $LOG"
        RECFLAG=""; RECOUT=""; FSFLAG=""
        if [ -n "${WF_RECORD:-}" ]; then
          RECOUT="${WF_RECORD}"; [ "$RECOUT" = "1" ] && RECOUT="$(date +%Y%m%d_%H%M%S)_condo.mp4"
          RECFLAG="-record_video"; echo "Recording → $RECOUT"
        fi
        [ "${WF_FULLSCREEN:-}" = "1" ] && FSFLAG="-fullscreen"
        # Site sky/ground textures (wflevels/condo_639_640/textile.flags): a 1024² PERM atlas needs
        # the perm page, the total VRAM box, AND the transient slot widened — material.cc's
        # CalcVRAMuv bounds every texture's u by VRAMTransientWidth even for PERM textures.
        LD_LIBRARY_PATH=engine/libs DISPLAY=:0 engine/wf_game \
          --vram-width=4096 --vram-height=2048 \
          --vram-slot-width=1024 --vram-slot-height=1024 \
          --vram-perm-width=1024 --vram-perm-height=1024 \
          -Lwflevels/condo_639_640-standalone.iff $FSFLAG $RECFLAG 2>&1 | tee "$LOG"
        [ -n "$RECOUT" ] && [ -f output.mp4 ] && mv output.mp4 "$RECOUT" && echo "Saved → $RECOUT"

  run-aquarium:
    desc: "Run wf_game on wflevels/aquarium-standalone.iff (arrows swim, B/C in/out of the glass, A darts; the anemone close-up switches in by itself). WF_RECORD=1 records video. WF_FULLSCREEN=1 for fullscreen. Checks: python3 wflevels/aquarium/run_aquarium_checks.py"
    deps: [ensure-build, aquarium-level]
    cmds:
      - |
