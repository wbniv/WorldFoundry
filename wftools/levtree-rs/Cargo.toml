[package]
name = "levtree"
version = "0.1.0"
edition = "2021"
description = "World Foundry .lev <-> editable chunk tree (JSON) translator for the collaborative editor"

[lib]
name = "levtree"
path = "src/lib.rs"

[[bin]]
name = "levtree"
path = "src/main.rs"

[dependencies]
iffcomp = { path = "../iffcomp-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
