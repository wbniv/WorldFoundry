[package]
name = "wf-relay"
version = "0.1.0"
edition = "2021"
description = "wf-edit real-time co-editing relay server"

[[bin]]
name = "wf-relay"
path = "src/bin/relay.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
yrs = { path = "../y-crdt/yrs", version = "0.26.0" }
uuid = { version = "1", features = ["v4"] }
# parking_lot::Mutex does not poison: one panicking handler can no longer
# cascade-crash the whole relay (every other .lock().unwrap() would otherwise
# panic on the poisoned std::sync::Mutex). All lock sites are synchronous
# (never held across .await), so a sync mutex is correct.
parking_lot = "0.12"

[dev-dependencies]
yrs = { path = "../y-crdt/yrs", version = "0.26.0" }
