name: Level outputs fresh

# Rebuilds the eight Aquarium tanks and both aquarium bundles from the pushed commit
# and fails if any committed wflevels/ file differs: a stale output whose inputs
# changed without a rebuild. The fix is always `task aquarium-regenerate` + commit.
# The build is byte-reproducible (the same image gives the same bytes run to run).
# GitHub cannot reach the lab registry, so the image comes from
# docker/Dockerfile.blender.public (the same pinned packages as docker/Dockerfile.blender).
# See docs/level-building.md, "Committed Aquarium outputs stay fresh".

on:
  push:
    branches: ['**']
    paths:
      - 'wflevels/aquarium*/**'
      - 'wflevels/aquarium*.iff'
      - 'wflevels/aquarium-menu.manifest'
      - 'wflevels/snowgoons-blender/**'
      - 'wftools/**'
      - 'wfsource/source/oas/**'
      - 'wfsource/source/game/shell*.fth'
      - 'wfsource/source/game/ui-font.wfga'
      - 'scripts/**'
      - 'docker/Dockerfile.blender*'
      - '.github/workflows/level-outputs.yml'
  pull_request:
    paths:
      - 'wflevels/aquarium*/**'
      - 'wflevels/aquarium*.iff'
      - 'wflevels/aquarium-menu.manifest'
      - 'wflevels/snowgoons-blender/**'
      - 'wftools/**'
      - 'wfsource/source/oas/**'
      - 'wfsource/source/game/shell*.fth'
      - 'wfsource/source/game/ui-font.wfga'
      - 'scripts/**'
      - 'docker/Dockerfile.blender*'
      - '.github/workflows/level-outputs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: level-outputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aquarium:
    name: Aquarium outputs rebuild identically
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # Only the check's inputs (scripts/aquarium-levels.sh INPUTS), not the 24 GB tree.
          sparse-checkout: |
            /wftools/
            /wfsource/source/
            /scripts/
            /docker/
            /wflevels/snowgoons-blender/
            /wflevels/aquarium*
          sparse-checkout-cone-mode: false

      - uses: docker/setup-buildx-action@v4

      - name: Blender image (docker/Dockerfile.blender.public)
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile.blender.public
          tags: wf-blender:local
          load: true
          cache-from: type=gha,scope=wf-blender-public
          cache-to: type=gha,scope=wf-blender-public,mode=max

      - name: Rebuild and compare (task aquarium-check)
        run: bash scripts/aquarium-levels.sh check
