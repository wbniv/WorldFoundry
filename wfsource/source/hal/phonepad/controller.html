<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>World Foundry controller</title>
<!--
  The phone as a gamepad: served by the TV app (hal/phonepad/phonepad.cc) at /?k=<PIN>.
  Plan: docs/plans/2026-09-30-aquarium-chromecast.md, Phase E, mockups 2 and 4.
  One file, inline CSS and JS, no external references. The layout (which buttons, which
  EJ_BUTTONF_* bits) comes from /layout.json, one per app. Protocol: "b:<hex mask>" on every
  change and every KEEPALIVE_MS (50 ms) while connected, "t:<ms>" once a second (the TV echoes
  it: round-trip time). The steady 50 ms stream is not for safety (the TV releases after 1 s of
  silence either way) but for latency: the Chromecast's Wi-Fi dozes between packets, which gave a
  median round trip of 156 ms with 250 ms frames and 21 to 28 ms with 20 to 50 ms frames
  (docs/plans/2026-09-30-aquarium-chromecast.md, Phase E progress).
  Keep-awake: the plain http page has no Wake Lock (secure contexts only), so a silent looping
  video plays while connected; it was made with
    ffmpeg -f lavfi -i color=black:s=16x16:r=1 -t 2 -c:v libx264 -pix_fmt yuv420p
           -profile:v baseline -movflags +faststart -an blank.mp4
-->
<style>
:root{--bg:#0d1117;--panel:#111826;--line:#3a4a63;--fg:#e6edf3;--dim:#8b98a9;--ok:#56d364;--warn:#ffb454;--bad:#ff7b72;--btn:#1d2a3f;--knob:#2f6fb3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:15px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#bar{position:fixed;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:14px;
  padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));font-size:13px;color:var(--dim)}
#status{display:flex;align-items:center;gap:6px;color:var(--warn)}
#status .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
#status.ok{color:var(--ok)}#status.bad{color:var(--bad)}
#title{color:var(--fg);font-weight:600}
#spacer{flex:1}
#rtt{min-width:5em;text-align:right}
#buzz{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font:inherit}
#take{display:none;background:var(--ok);color:var(--bg);border:0;border-radius:6px;padding:4px 12px;font:inherit;font-weight:600}
#pad{position:fixed;inset:40px 0 26px 0}
.ctl{position:absolute;touch-action:none}
.stick .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line);background:#0d1320}
.stick .knob{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;
  background:var(--knob);box-shadow:0 0 0 2px #56a0e8 inset}
.btn{border-radius:50%;background:var(--btn);border:2px solid var(--line);display:flex;align-items:center;
  justify-content:center;text-align:center;color:#c9d4e3;font-size:13px;line-height:1.1;padding:4px}
.btn b{display:block;font-size:20px}
.btn.on{background:var(--ok);color:var(--bg);border-color:var(--ok)}
body.off .ctl{opacity:.35}
#foot{position:fixed;left:0;right:0;bottom:0;height:26px;display:flex;gap:16px;align-items:center;
  padding:0 16px;font-size:12px;color:var(--dim)}
#mask{font-family:ui-monospace,monospace;color:var(--ok)}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
  padding:24px;font-size:20px;background:var(--bg)}
#msg.show{display:flex}
#msg small{display:block;font-size:15px;color:var(--dim);margin-top:8px}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
  padding:24px;font-size:20px;background:var(--bg);z-index:5}
@media (orientation:portrait){#rotate{display:flex}}
#keepawake{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}

#plant-open{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
#plant-settings{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;touch-action:pan-y;padding:20px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));user-select:text}
#plant-settings[hidden]{display:none}body.plant-edit #rotate{display:none}body.plant-available #rotate{inset:40px 0 0}
@media(orientation:portrait){body.plant-available #title,body.plant-available #nobuzz,body.plant-available #rtt{display:none}}
#plant-settings .settings-inner{max-width:620px;margin:auto}
#plant-settings h1{position:sticky;top:0;z-index:21;background:var(--bg);margin:0 0 8px;font-size:24px}#plant-back{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:3px 12px;font-size:26px}
#plant-settings label{display:block;margin:16px 0 7px;font-weight:600}
#plant-settings input,#plant-settings select,#plant-settings button{font:inherit;touch-action:manipulation}
#plant-settings input[type=text],#plant-settings textarea,#plant-settings select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);user-select:text;touch-action:auto}
#plant-settings textarea{font:inherit;min-height:140px;resize:vertical}
#plant-settings{color-scheme:dark;color:var(--fg)}
#plant-settings input[type=text],#plant-settings textarea,#plant-settings select{color:#edf4f4;caret-color:#edf4f4;-webkit-text-fill-color:#edf4f4}
#plant-settings input::placeholder,#plant-settings textarea::placeholder{color:#b3c6cf;opacity:1}
#plant-settings input::selection,#plant-settings textarea::selection{background:#477b70;color:#fff}
#plant-settings input:disabled,#plant-settings textarea:disabled,#plant-settings select:disabled{color:#b3c6cf;-webkit-text-fill-color:#b3c6cf;opacity:1}
#plant-settings .property-colour{border:0;padding:0;margin:16px 0}
#plant-settings .property-colour legend{font-weight:600}
#plant-settings .colour-grid[hidden],#plant-settings .colour-recent[hidden]{display:none}
#plant-settings .colour-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
#plant-settings .colour-grid button,#plant-settings .colour-recent button{height:48px;border:2px solid transparent;border-radius:8px;color:white;text-shadow:0 1px 3px black;font-size:22px}
#plant-settings .colour-grid button[aria-pressed=true],#plant-settings .colour-recent button[aria-pressed=true]{border-color:white;box-shadow:0 0 0 2px #111 inset}
#plant-settings .property-colour button:focus-visible{outline:3px solid #f1cd79;outline-offset:3px}
#plant-settings .colour-recent{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
#plant-settings .colour-plane{position:relative;height:260px;max-width:420px;touch-action:none;margin:16px 0;background:linear-gradient(rgba(0,0,0,var(--darkness)),rgba(0,0,0,var(--darkness))),linear-gradient(to top,#fff,transparent),linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#plant-settings .colour-marker{position:absolute;width:14px;height:14px;border:2px solid white;border-radius:50%;box-shadow:0 0 0 2px black;transform:translate(-50%,-50%);pointer-events:none}
#plant-settings .colour-preview{display:flex;gap:12px;margin:12px 0}
#plant-settings .colour-preview span{flex:1;min-height:54px;padding:8px;border-radius:8px;text-shadow:0 1px 3px black;color:white}
#plant-settings .colour-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
#plant-settings .colour-actions button,#plant-settings .colour-open,#plant-settings .colour-back{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
#plant-settings .colour-details input{margin:6px 0}
#plant-settings input[data-value]{-webkit-appearance:none;appearance:none;background:transparent}
#plant-settings input[data-value]::-webkit-slider-runnable-track{height:18px;border-radius:6px;background:linear-gradient(to right,#000,var(--value-colour))}
#plant-settings input[data-value]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:26px;margin-top:-4px;border:2px solid #10222c;border-radius:5px;background:#fff}
#plant-settings input[data-value]::-moz-range-track{height:18px;border-radius:6px;background:linear-gradient(to right,#000,var(--value-colour))}
#plant-settings input[data-value]::-moz-range-thumb{width:14px;height:24px;border:2px solid #10222c;border-radius:5px;background:#fff}
#plant-settings .colour-picker-panel{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:20px max(20px,calc((100vw - 580px)/2));touch-action:pan-y}
#plant-settings .colour-picker-panel[hidden]{display:none}
#plant-settings input[type=range]{width:100%;height:44px;touch-action:auto}
#plant-settings .property-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border:0;margin:16px 0 7px;padding:0}
#plant-settings .property-choices legend{font-weight:600;margin-bottom:8px}
#plant-settings .property-choices button{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
#plant-settings .property-choices button[aria-pressed=true]{background:var(--ok);color:#09150d;border-color:var(--ok)}
#plant-settings .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
#plant-settings .actions button{padding:13px 8px;border:1px solid var(--line);border-radius:9px;background:var(--btn);color:var(--fg)}
#plant-settings .actions #plant-regen{background:#3b7250}
#plant-error{color:var(--bad);min-height:1.5em}#plant-detail{color:var(--dim)}
.water-toggle{display:flex;gap:8px}.water-toggle button{flex:1;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}.water-toggle button[aria-pressed=true]{background:var(--ok);color:#09150d}
</style>
</head>
<body class="off">

<script>
'use strict';
(function () {
  const $ = (id) => document.getElementById(id);
  const K = new URLSearchParams(location.search).get('k') || '';
  const KEEPALIVE_MS = 50, PING_MS = 1000, RETRY_MS = 1000, UNREACHABLE_MS = 5000;

  let layout = null, ws = null, state = 'connecting', mask = 0, sentMask = -1;
  let heartbeat = 0, pinger = 0, retryTimer = 0, lastOpen = Date.now(), wakeLock = null;
  const held = new Map();          // bit -> Set(pointerId) for buttons
  let stickBits = 0;
  let buzzOn = true;
  try { buzzOn = localStorage.getItem('wf-buzz') !== 'off'; } catch (e) { /* storage blocked */ }

  // ---- status line --------------------------------------------------------------------
  function setState(s, text, cls) {
    state = s;
    $('stext').textContent = text;
    $('status').className = cls || '';
    document.body.classList.toggle('off', s !== 'connected');
    $('take').style.display = s === 'replaced' ? 'inline-block' : 'none';
  }
  function fatal(text, sub) {
    $('msg').innerHTML = '';
    const d = document.createElement('div');
    d.textContent = text;
    if (sub) { const s = document.createElement('small'); s.textContent = sub; d.appendChild(s); }
    $('msg').appendChild(d);
    $('msg').classList.add('show');
  }

  // Retain legacy DOM IDs for installed controllers; all state is generic.
  let propertySession = -1, propertySync = false;
  function propertySend(verb,tail){
    if(!send('r:'+propertySession+':'+verb+(tail===undefined?'':':'+tail)))$('plant-error').textContent='Connection lost; continue on the TV';
  }
  function colourHex(value){return '#'+(Number(value)&0xffffff).toString(16).padStart(6,'0');}
  const colourPalette=[0xea6f69,0xe59b51,0xded16c,0x87b46c,0x58a78c,0x6eb6c6,0x658cd1,0x8c7dce,0xbe81b7,0xd4a6a1,0xdedad0,0x8f989c,0x9d6555,0x556d3b,0x466d72,0x2d414b];
  let recentColours=[],activeColour=null;
  function colourHSV(packed,previousHue){const r=((packed>>16)&255)/255,g=((packed>>8)&255)/255,b=(packed&255)/255,high=Math.max(r,g,b),low=Math.min(r,g,b),delta=high-low;let h=previousHue||0;
    if(delta)h=(((high===r?(g-b)/delta:high===g?(b-r)/delta+2:(r-g)/delta+4)*60)%360+360)%360;return [h,high?delta/high:0,high];}
  function colourRGB(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let channels=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];channels=channels.map(n=>Math.round((n+m)*255));return (channels[0]<<16)|(channels[1]<<8)|channels[2];}
  function colourSync(group,value){const ui=group.colourUI;if(ui&&activeColour!==ui){ui.saved=Number(value)&0xffffff;ui.open.textContent='Choose colour · '+colourHex(value).toUpperCase();ui.open.style.borderColor=colourHex(value);}}
  function colourControl(f){
    const group=document.createElement('fieldset');group.id='property-'+f.id;group.className='property-colour';const legend=document.createElement('legend');legend.textContent=f.label;group.appendChild(legend);
    const ui={saved:Number(f.value)&0xffffff,preview:0,hsv:[0,0,0]};group.colourUI=ui;
    function button(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.disabled=!!f.readonly;b.addEventListener('click',fn);parent.appendChild(b);return b;}
    ui.open=button(group,'',()=>{if(activeColour)activeColour.cancel();activeColour=ui;ui.preview=ui.saved;ui.original=ui.saved;ui.hsv=colourHSV(ui.preview,ui.hsv[0]);panel.hidden=false;panel.scrollTop=0;ui.open.hidden=true;custom.hidden=true;grid.hidden=false;customButton.textContent='Custom';refreshRecent();paint();});ui.open.className='colour-open';
    const panel=document.createElement('div');panel.className='colour-picker-panel';panel.hidden=true;group.appendChild(panel);const back=button(panel,'←',()=>ui.cancel());back.setAttribute('aria-label','Cancel colour');back.className='colour-back';const title=document.createElement('h2');title.textContent=f.label;panel.appendChild(title);
    const previews=document.createElement('div');previews.className='colour-preview';const old=document.createElement('span'),next=document.createElement('span');previews.append(old,next);panel.appendChild(previews);
    const readout=document.createElement('output');panel.appendChild(readout);
    const grid=document.createElement('div');grid.className='colour-grid';panel.appendChild(grid);const recent=document.createElement('div');recent.className='colour-recent';panel.appendChild(recent);
    const custom=document.createElement('div');custom.hidden=true;panel.appendChild(custom);
    const plane=document.createElement('div');plane.className='colour-plane';plane.setAttribute('aria-label','Colour spectrum; use the labelled sliders for keyboard input');const marker=document.createElement('span');marker.className='colour-marker';plane.appendChild(marker);custom.appendChild(plane);
    const sliders=[];['Hue','Saturation','Value'].forEach((name,i)=>{const label=document.createElement('label');label.textContent=name+' ';const out=document.createElement('output');label.appendChild(out);const input=document.createElement('input');input.type='range';input.min='0';input.max=i===0?'359':'100';input.step='1';input.setAttribute('aria-label',name);if(i===2)input.dataset.value='true';label.appendChild(input);custom.appendChild(label);sliders.push([input,out]);input.addEventListener('input',()=>{ui.hsv[i]=Number(input.value)/(i===0?1:100);ui.preview=colourRGB.apply(null,ui.hsv);paint();});});
    function point(e){const bounds=plane.getBoundingClientRect();ui.hsv[0]=Math.max(0,Math.min(359,(e.clientX-bounds.left)/bounds.width*360));ui.hsv[1]=Math.max(0,Math.min(1,1-(e.clientY-bounds.top)/bounds.height));ui.preview=colourRGB.apply(null,ui.hsv);paint();}
    plane.addEventListener('pointerdown',e=>{plane.setPointerCapture(e.pointerId);point(e);});plane.addEventListener('pointermove',e=>{if(plane.hasPointerCapture(e.pointerId))point(e);});
    const details=document.createElement('details');details.className='colour-details';const summary=document.createElement('summary');summary.textContent='RGB / Hex details';details.appendChild(summary);panel.appendChild(details);const exact=[];
    ['Red','Green','Blue','Hex'].forEach((name,i)=>{const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.type='text';input.inputMode=i===3?'text':'numeric';input.maxLength=i===3?7:3;input.autocomplete='off';input.setAttribute('aria-label',name);label.appendChild(input);details.appendChild(label);exact.push(input);
      input.addEventListener('input',()=>{const digits=input.value.replace(/^#/,'');const valid=i===3?/^[0-9a-fA-F]{6}$/.test(digits):/^\d{1,3}$/.test(digits)&&Number(digits)<=255;input.setCustomValidity(valid?'':i===3?'Enter six hexadecimal digits':'Enter a value from 0 to 255');if(!valid)return;
        ui.preview=i===3?parseInt(digits,16):(ui.preview&~(255<<((2-i)*8)))|(Number(digits)<<((2-i)*8));ui.hsv=colourHSV(ui.preview,ui.hsv[0]);paint();});});
    function swatch(parent,value){const b=button(parent,'',()=>{ui.preview=value;ui.hsv=colourHSV(value,ui.hsv[0]);paint();});b.style.background=colourHex(value);b.dataset.colour=String(value);b.setAttribute('aria-label',colourHex(value));}
    colourPalette.forEach(value=>swatch(grid,value));function refreshRecent(){recent.textContent='';recentColours.forEach(value=>swatch(recent,value));recent.hidden=!recentColours.length;recent.setAttribute('aria-label','Recent colours');}
    const actions=document.createElement('div');actions.className='colour-actions';panel.appendChild(actions);
    const customButton=button(actions,'Custom',()=>{custom.hidden=!custom.hidden;grid.hidden=!custom.hidden;recent.hidden=!custom.hidden||!recentColours.length;customButton.textContent=custom.hidden?'Custom':'Palette';panel.scrollTop=0;paint();});
    ui.cancel=()=>{panel.hidden=true;ui.open.hidden=false;if(activeColour===ui)activeColour=null;colourSync(group,ui.saved);};
    button(actions,'Use colour',()=>{if(exact.some(input=>!input.checkValidity())){exact.find(input=>!input.checkValidity()).reportValidity();return;}ui.saved=ui.preview;recentColours=[ui.saved].concat(recentColours.filter(value=>value!==ui.saved)).slice(0,6);propertySend('set',f.id+':'+String(ui.saved));ui.cancel();});button(actions,'Cancel',ui.cancel);
    function paint(){old.textContent='Original';next.textContent='Preview';old.style.background=colourHex(ui.original);next.style.background=colourHex(ui.preview);readout.textContent=colourHex(ui.preview).toUpperCase();plane.style.setProperty('--darkness',String(1-ui.hsv[2]));sliders[2][0].style.setProperty('--value-colour',colourHex(colourRGB(ui.hsv[0],ui.hsv[1],1)));marker.style.left=(ui.hsv[0]/360*100)+'%';marker.style.top=((1-ui.hsv[1])*100)+'%';
      sliders.forEach((pair,i)=>{pair[0].value=String(Math.round(ui.hsv[i]*(i===0?1:100)));pair[1].textContent=pair[0].value+(i===0?'°':'%');});exact.forEach((input,i)=>{if(input!==document.activeElement){input.value=i===3?colourHex(ui.preview).toUpperCase():String((ui.preview>>((2-i)*8))&255);input.setCustomValidity('');}});
      group.querySelectorAll('button[data-colour]').forEach(b=>{const selected=Number(b.dataset.colour)===ui.preview;b.setAttribute('aria-pressed',String(selected));b.textContent=selected?'✓':'';});}
    colourSync(group,f.value);return group;
  }
  function propertiesMessage(t){
    let model;try{model=JSON.parse(t.slice(2));}catch(e){return;}
    if(!model||!Array.isArray(model.fields))return;
    $('plant-open').hidden=!model.available;document.body.classList.toggle('plant-available',model.available);
    $('plant-settings').hidden=!model.open;document.body.classList.toggle('plant-edit',model.open);
    $('plant-error').textContent=model.error||'';
    if(!model.open){if(activeColour)activeColour.cancel();propertySync=false;return;}
    const fresh=!propertySync||propertySession!==model.session;propertySession=model.session;propertySync=true;
    if(fresh){if(activeColour)activeColour.cancel();releaseAll();$('property-title').textContent=model.title;const root=$('property-fields');root.textContent='';
      if(model.picker){(model.objects||[]).forEach(object=>{const button=document.createElement('button');button.type='button';button.textContent=object.title+' ['+object.actor+']';button.dataset.owner=String(object.actor);button.addEventListener('click',()=>propertySend('select',String(object.actor)));root.appendChild(button);});return;}
      model.fields.forEach(f=>{
        if(f.kind===7)return;
        if(f.kind===5||f.kind===6){const heading=document.createElement('h2');heading.textContent=f.label;root.appendChild(heading);return;}
        const wrap=document.createElement('div');root.appendChild(wrap);
        if(f.kind===10){wrap.style.height='48px';wrap.setAttribute('aria-hidden','true');return;}
        if(f.kind===9){const button=document.createElement('button');button.textContent=f.label;button.addEventListener('click',()=>propertySend('action',String(f.id)));wrap.appendChild(button);return;}
        const label=document.createElement('label');label.textContent=f.label;label.htmlFor='property-'+f.id;wrap.appendChild(label);
        let input,output=null;const choices=f.choices?f.choices.split('|'):[];
        if(f.kind===0&&f.show===7){label.remove();wrap.appendChild(colourControl(f));if(f.help){const help=document.createElement('small');help.textContent=f.help;wrap.appendChild(help);}return;}
        if(f.kind===2&&f.show===5){const group=document.createElement('fieldset');group.id='property-'+f.id;group.className='property-choices';const legend=document.createElement('legend');legend.textContent=f.label;group.appendChild(legend);label.remove();choices.forEach((v,i)=>{const button=document.createElement('button');button.type='button';button.value=String(f.min+i);button.textContent=v;button.disabled=!!f.readonly;button.setAttribute('aria-pressed',String(button.value===f.value));button.addEventListener('click',()=>{group.querySelectorAll('button').forEach(choice=>choice.setAttribute('aria-pressed',String(choice===button)));propertySend('set',f.id+':'+button.value);});group.appendChild(button);});wrap.appendChild(group);if(f.help){const help=document.createElement('small');help.textContent=f.help;wrap.appendChild(help);}return;}
        if(f.kind===2&&f.show!==2){input=document.createElement('select');choices.forEach((v,i)=>{const opt=document.createElement('option');opt.value=String(f.min+i);opt.textContent=v;input.appendChild(opt);});}
        else if(f.kind===3&&f.rule===2){input=document.createElement('textarea');input.maxLength=Math.min(65536,Math.max(1,f.maxLength));input.inputMode='text';input.rows=5;}
        else {input=document.createElement('input');input.type=f.kind===4?'checkbox':f.show===2?'range':'text';
          if(input.type==='range'){const scale=f.kind===1?(f.scale||1):1;input.min=String(f.min/scale);input.max=String(f.max/scale);input.step=String(1/scale);output=document.createElement('output');label.appendChild(output);}
          else if(input.type==='text'){input.maxLength=Math.min(65536,Math.max(1,f.maxLength));input.inputMode=f.kind===3?(f.rule===1?'numeric':'text'):'decimal';input.autocomplete='off';input.addEventListener('focus',()=>input.select());}}
        input.id='property-'+f.id;input.disabled=!!f.readonly;input.value=f.value;input.checked=f.value==='1';wrap.appendChild(input);
        const show=()=>{if(output)output.textContent=': '+(choices[Number(input.value)-f.min]||input.value);};show();
        input.addEventListener('input',()=>{show();propertySend('set',f.id+':'+encodeURIComponent(input.type==='checkbox'?(input.checked?'1':'0'):input.value));});
        if(f.help){const help=document.createElement('small');help.textContent=f.help;wrap.appendChild(help);}
      });
    }else model.fields.forEach(f=>{const input=$('property-'+f.id);if(input&&input.classList.contains('property-colour')){colourSync(input,f.value);}else if(input&&input.tagName==='FIELDSET'){input.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.value===f.value)));}else if(input&&input!==document.activeElement){input.value=f.value;input.checked=f.value==='1';}});
  }
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeColour){e.preventDefault();activeColour.cancel();}});
  $('plant-open').textContent='Properties';
  $('plant-open').addEventListener('click',()=>{releaseAll();send('r:open');});
  $('plant-back').addEventListener('click',()=>{if(activeColour)activeColour.cancel();else propertySend('apply');});
  $('plant-cancel').addEventListener('click',()=>{if(activeColour)activeColour.cancel();propertySend('cancel');});
  // ---- the mask -----------------------------------------------------------------------
  function computeMask() {
    if(document.body.classList.contains('plant-edit'))return 0;
    let m = stickBits;
    held.forEach((ids, bit) => { if (ids.size) m |= bit; });
    return m & 0xffff;
  }
  function names(m) {
    if (!layout) return '';
    const out = [];
    const s = layout.stick;
    if (m & s.up) out.push('UP'); if (m & s.down) out.push('DOWN');
    if (m & s.left) out.push('LEFT'); if (m & s.right) out.push('RIGHT');
    for (const b of layout.buttons) if (m & b.bit) out.push(b.id);
    return out.join(' + ');
  }
  function send(text) {
    if (ws && ws.readyState === 1) { try { ws.send(text); return true; } catch (e) { /* closing */ } }
    return false;
  }
  function update(force) {
    mask = computeMask();
    $('mask').textContent = '0x' + mask.toString(16).padStart(4, '0') + (mask ? '  ' + names(mask) : '');
    if (state === 'connected' && (force || mask !== sentMask)) {
      if (send('b:' + mask.toString(16))) sentMask = mask;
    }
  }
  function releaseAll() {
    held.forEach((ids) => ids.clear());
    document.querySelectorAll('.btn.on').forEach((el) => el.classList.remove('on'));
    stickBits = 0;
    const knob = document.querySelector('.knob');
    if (knob) knob.style.transform = '';
    update(true);
  }

  // ---- haptics (local tick; Android Chrome has navigator.vibrate, iPhone Safari does not) --
  const canBuzz = typeof navigator.vibrate === 'function';
  function tick() { if (canBuzz && buzzOn) { try { navigator.vibrate(15); } catch (e) { /* ignore */ } } }
  if (canBuzz) {
    $('buzz').hidden = false;
    $('buzz').textContent = 'Buzz: ' + (buzzOn ? 'on' : 'off');
    $('buzz').addEventListener('click', () => {
      buzzOn = !buzzOn;
      $('buzz').textContent = 'Buzz: ' + (buzzOn ? 'on' : 'off');
      try { localStorage.setItem('wf-buzz', buzzOn ? 'on' : 'off'); } catch (e) { /* storage blocked */ }
    });
  } else {
    $('nobuzz').hidden = false;
  }

  // ---- keep the screen awake while connected ------------------------------------------
  function keepAwake(on) {
    const v = $('keepawake');
    if (on) {
      if ('wakeLock' in navigator && !wakeLock) {           // secure pages only (the later https page)
        navigator.wakeLock.request('screen').then((l) => { wakeLock = l; }, () => {});
      }
      const p = v.play(); if (p && p.catch) p.catch(() => {});
    } else {
      v.pause();
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }
  }

  // ---- building the pad from the layout -----------------------------------------------
  // Capture keeps a finger that slides off its control owning it until it lifts.
  function capture(el, id) { try { el.setPointerCapture(id); } catch (e) { /* pointer already gone */ } }
  function build() {
    const pad = $('pad');
    pad.innerHTML = '';
    $('title').textContent = layout.title || '';
    $('hint').textContent = layout.hint || '';
    const W = pad.clientWidth, H = pad.clientHeight, unit = Math.min(W, H);

    const st = document.createElement('div');
    st.className = 'ctl stick';
    const R = Math.round(unit * 0.36);
    st.style.cssText = `width:${2 * R}px;height:${2 * R}px;left:${Math.round(W * 0.2 - R)}px;top:${Math.round(H * 0.58 - R)}px`;
    st.innerHTML = '<div class="ring"></div><div class="knob"></div>';
    pad.appendChild(st);
    const knob = st.querySelector('.knob');
    let stickId = null;
    const thr = layout.threshold || 0.5, s = layout.stick;
    function stickAt(e) {
      const b = st.getBoundingClientRect();
      let dx = (e.clientX - (b.left + b.width / 2)) / R, dy = (e.clientY - (b.top + b.height / 2)) / R;
      const d = Math.hypot(dx, dy);
      if (d > 1) { dx /= d; dy /= d; }
      knob.style.transform = `translate(${dx * R * 0.6}px,${dy * R * 0.6}px)`;
      // Per axis, the same rule as the engine's analog stick (native_app_entry.cc, kJoystickThreshold).
      stickBits = (dx < -thr ? s.left : 0) | (dx > thr ? s.right : 0) | (dy < -thr ? s.up : 0) | (dy > thr ? s.down : 0);
      update(false);
    }
    st.addEventListener('pointerdown', (e) => {
      e.preventDefault(); keepAwake(state === 'connected');
      stickId = e.pointerId; capture(st, e.pointerId); stickAt(e);
    });
    st.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) stickAt(e); });
    const stickEnd = (e) => {
      if (e.pointerId !== stickId) return;
      stickId = null; stickBits = 0; knob.style.transform = ''; update(false);
    };
    st.addEventListener('pointerup', stickEnd);
    st.addEventListener('pointercancel', stickEnd);
    st.addEventListener('lostpointercapture', stickEnd);

    held.clear();
    for (const b of layout.buttons) {
      const el = document.createElement('div');
      el.className = 'ctl btn';
      el.dataset.bit = b.bit;
      el.dataset.id = b.id;
      const D = Math.round(unit * 0.26 * (b.size || 1));
      el.style.cssText = `width:${D}px;height:${D}px;left:${Math.round(W * b.x - D / 2)}px;top:${Math.round(H * b.y - D / 2)}px`;
      el.innerHTML = b.label === b.id ? `<b></b>` : `<span><b></b><span></span></span>`;
      el.querySelector('b').textContent = b.id;
      if (b.label !== b.id) el.querySelector('span span').textContent = b.label;
      pad.appendChild(el);
      const ids = new Set();
      held.set(b.bit, ids);
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault(); keepAwake(state === 'connected');
        capture(el, e.pointerId); ids.add(e.pointerId); el.classList.add('on');
        if (state === 'connected') tick();
        update(false);
      });
      const up = (e) => {
        if (!ids.delete(e.pointerId)) return;
        if (!ids.size) el.classList.remove('on');
        update(false);
      };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('lostpointercapture', up);
    }
    update(true);
  }

  // ---- connection ---------------------------------------------------------------------
  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(start, RETRY_MS);
  }
  function stopTimers() { clearInterval(heartbeat); clearInterval(pinger); heartbeat = pinger = 0; }

  function connect() {
    if (ws) { try { ws.close(1000); } catch (e) { /* already closed */ } }
    const sock = new WebSocket('ws://' + location.host + '/ws?k=' + encodeURIComponent(K));
    ws = sock;
    sock.onopen = () => {
      if (ws !== sock) return;
      propertySync=false;
      lastOpen = Date.now();
      setState('connected', 'Connected to the TV', 'ok');
      sentMask = -1; update(true);
      heartbeat = setInterval(() => update(true), KEEPALIVE_MS);   // a press still goes at once, from update(false)
      pinger = setInterval(() => send('t:' + Date.now()), PING_MS);
      keepAwake(true);
    };
    sock.onmessage = (ev) => {
      const t = String(ev.data);
      if(t.startsWith('r:'))propertiesMessage(t);
      if (t.startsWith('t:')) $('rtt').textContent = 'rtt ' + Math.max(0, Date.now() - Number(t.slice(2))) + ' ms';
    };
    sock.onclose = (ev) => {
      if (ws !== sock) return;
      ws = null; stopTimers(); keepAwake(false); $('rtt').textContent = '';
      if (ev.code === 4001) { setState('replaced', 'Another phone took over', ''); return; }
      if (document.hidden) { setState('paused', 'Paused', ''); return; }
      lost();
    };
  }
  function lost() {
    if (Date.now() - lastOpen > UNREACHABLE_MS) setState('lost', 'Can’t reach the TV. Same Wi-Fi? Guest network?', 'bad');
    else setState('lost', 'Reconnecting… buttons off', '');
    scheduleRetry();
  }

  // Fetch the layout first, every time: it checks reachability and the PIN (a WebSocket that is
  // refused cannot tell the page why), then open the socket.
  function start() {
    clearTimeout(retryTimer);
    if (document.hidden || state === 'replaced' || state === 'wrongpin') return;
    fetch('/layout.json?k=' + encodeURIComponent(K), { cache: 'no-store' }).then((r) => {
      if (r.status === 403) {
        state = 'wrongpin';
        fatal('Wrong code. Scan the TV again.', 'The code changes every time the game starts.');
        return null;
      }
      if (r.status === 429) { setState('lost', 'Too many wrong codes. Waiting…', 'bad'); scheduleRetry(); return null; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then((l) => {
      if (!l) return;
      const first = !layout;
      layout = l;
      if (first) build();
      connect();
    }).catch(() => { lost(); });
  }

  $('take').addEventListener('click', () => { setState('connecting', 'Connecting…', ''); start(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      // A locked phone or a backgrounded tab must not leave a button held on the TV.
      releaseAll();
      if (ws) { const s = ws; ws = null; stopTimers(); try { s.close(1000); } catch (e) { /* closed */ } }
      keepAwake(false);
      if (state === 'connected' || state === 'lost' || state === 'connecting') setState('paused', 'Paused', '');
    } else if (state === 'paused') {
      setState('connecting', 'Connecting…', '');
      start();
    }
  });
  window.addEventListener('pagehide', releaseAll);
  window.addEventListener('blur', releaseAll);
  window.addEventListener('resize', () => { if (layout) { releaseAll(); build(); } });
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // For the headless tests (tests/test_phone_controller_page.py).
  window.__wf = { mask: () => mask, state: () => state, keepaliveMs: KEEPALIVE_MS };

  if (!/^[0-9]{6}$/.test(K)) { state = 'wrongpin'; fatal('Scan the code on the TV to play.', 'The address needs the PIN shown on the TV.'); }
  else start();
})();
</script>
</body>
</html>
