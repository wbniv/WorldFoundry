# turnserver-wfedit.conf — coturn config for a REAL two-machine wf-edit call.
#
# Unlike the loopback config baked into `task turn-test-relay` (which binds
# 127.0.0.1 for the headless WF_EDIT_TURN_TEST self-test), this one is reachable
# over the network so a second machine — especially one behind a VPN/CGNAT that
# STUN can't hole-punch — can relay DTLS-SRTP media through it.
#
# Run sheet: docs/wf-edit-two-machine-voice-test.md  (§ Forcing the TURN path).
# Launch:    task turn-serve            (wraps this file; prints the client env)
#       or:  turnserver -c config/turnserver-wfedit.conf
#
# ─── SECURITY / SCOPE ────────────────────────────────────────────────────────
# This uses a STATIC long-term credential (user/pass below). That is fine for a
# throwaway verification session between two people you control. It is NOT a
# production setup:
#   - Static shared secrets shipped/typed by hand are unsafe at scale; production
#     wants short-lived, time-limited TURN credentials (REST API / `use-auth-secret`).
#   - This binds all interfaces and relays arbitrary UDP for authenticated users —
#     do not leave it running on a public host. Stop it when the test is done.
# The production hosting decision (self-host vs Cloudflare Calls, ephemeral creds)
# stays deferred — see docs/plans/2026-05-27-webrtc-phase3-turn-generic-client.md.
# ─────────────────────────────────────────────────────────────────────────────

# Listen for TURN allocations on the standard port.
listening-port=3478

# Long-term credential mechanism with one static user. Change these before use;
# they must match WF_COLLAB_TURN_USER / WF_COLLAB_TURN_PASS on the clients.
lt-cred-mech
user=wfedit:wfeditpass
realm=wfedit.test

# Relay port range coturn hands out for media. Keep it small + open this UDP
# range on the host firewall (and forward it if the server is behind NAT).
min-port=49300
max-port=49400

# Bind/relay addressing.
#   - Leave listening-ip unset to listen on all interfaces (simplest for a LAN
#     or a host with a public IP). To pin one NIC, uncomment + set it.
#   - If the TURN host is itself behind NAT (e.g. a home server with port
#     forwarding), set external-ip to the PUBLIC address so coturn advertises
#     reachable relay candidates. Without this, a remote/VPN peer gets the
#     server's private IP and the relay leg fails.
# listening-ip=<this host's LAN/public IP>
# external-ip=<public IP>[/<private IP>]
relay-ip=0.0.0.0

# No TLS/DTLS for this verification (wf-edit's WF_COLLAB_TURN_TLS=0 default).
# Media is still DTLS-SRTP end-to-end; the relay only forwards ciphertext, so
# plain TURN here does not weaken the call. For TURNS, add cert/pkey + set
# WF_COLLAB_TURN_TLS=1 on the clients.
no-tls
no-dtls

# Operational niceties for a throwaway run.
no-cli
simple-log
fingerprint
# Refuse to relay to loopback/multicast/private-by-default abuse targets is the
# coturn default; we don't loosen it.
