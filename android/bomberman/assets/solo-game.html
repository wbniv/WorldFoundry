<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c131e"><title>Cat-Boom! · Solo</title><link rel="stylesheet" href="solo-game.css"></head><body><main class="game"><header><a class="brand" href="solo-phone-play.html"><span>✦</span> Cat-Boom! <small>SOLO</small></a><button id="pause" class="pause" aria-label="Pause">Ⅱ</button></header><section id="start-screen" class="screen"><p class="eyebrow">ONE PLAYER · ONE PHONE</p><h1>Choose your cat.<br><em>Then drop in.</em></h1><div id="cat-chooser" class="cat-chooser" aria-label="Choose one of 20 cats"></div><p id="cat-description">Marmalade · Orange tabby</p><span id="start-cat" class="start-cat" role="img" aria-label="Selected cat portrait"></span><button id="play" class="primary">Play as Marmalade <span>↵</span></button><p class="fine">20 cats · all unlocked · cosmetic only</p></section><section id="play-screen" class="hidden"><div class="topline"><div><b id="arena-cat">MARMALADE · PEACE TOWN 1-1</b><small id="hint">Clear the arena</small></div><div id="timer">03:00</div></div><div id="firstrun" class="firstrun hidden" role="status" aria-live="polite"><b>↑←↓→ D-pad to move.</b> <b>DROP BOMB</b> plants a bomb. <b>Flames hurt you too — step away.</b></div><div id="hud" class="hud"></div><div id="board" class="board" aria-label="Cat-Boom! arena"></div><div class="controls"><div class="dpad" aria-label="Movement"><button data-dir="up" aria-label="Move up">↑</button><button data-dir="left" aria-label="Move left">←</button><span>●</span><button data-dir="right" aria-label="Move right">→</button><button data-dir="down" aria-label="Move down">↓</button></div><button id="drop" class="drop" aria-label="Drop bomb">●<small>DROP BOMB</small></button></div></section><section id="end-screen" class="screen hidden"><p id="end-kicker" class="eyebrow">RUN COMPLETE</p><h1 id="end-title">Arena clear.</h1><div id=
