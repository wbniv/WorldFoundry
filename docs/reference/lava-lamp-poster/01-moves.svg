<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 174" width="396" height="174" role="img" aria-label="A lava lamp in cross-section: wax heats on the coil, rises up the middle, rests under the cap, sinks by the glass"><title>A lava lamp in cross-section: wax heats on the coil, rises up the middle, rests under the cap, sinks by the glass</title><rect width="396" height="174" fill="#ffffff"/><polygon points="37.2,142.0 36.1,138.8 35.1,135.6 34.3,132.4 33.5,129.2 32.9,126.0 32.4,122.8 32.0,119.6 31.7,116.4 31.5,113.2 31.4,110.0 31.5,106.8 31.5,103.6 31.6,100.4 31.7,97.2 31.8,94.0 32.0,90.8 32.2,87.6 32.5,84.4 32.7,81.2 33.0,78.0 33.4,74.8 33.7,71.6 34.1,68.4 34.6,65.2 35.0,62.0 35.5,58.8 36.1,55.6 36.6,52.4 37.2,49.2 37.8,46.0 38.5,42.8 39.2,39.6 39.9,36.4 40.7,33.2 41.4,30.0 42.3,26.8 43.1,23.6 44.0,20.4 44.9,17.2 45.8,14.0 86.2,14.0 87.1,17.2 88.0,20.4 88.9,23.6 89.7,26.8 90.6,30.0 91.3,33.2 92.1,36.4 92.8,39.6 93.5,42.8 94.2,46.0 94.8,49.2 95.4,52.4 95.9,55.6 96.5,58.8 97.0,62.0 97.4,65.2 97.9,68.4 98.3,71.6 98.6,74.8 99.0,78.0 99.3,81.2 99.5,84.4 99.8,87.6 100.0,90.8 100.2,94.0 100.3,97.2 100.4,100.4 100.5,103.6 100.5,106.8 100.6,110.0 100.5,113.2 100.3,116.4 100.0,119.6 99.6,122.8 99.1,126.0 98.5,129.2 97.7,132.4 96.9,135.6 95.9,138.8 94.8,142.0" fill="#e7defa" stroke="#5b2bc4" stroke-width="1.6"/><polygon points="45.8,14 86.2,14 70,4 62,4" fill="#b88a1e"/><polygon points="35.2,142 96.8,142 118,168 14,168" fill="#b88a1e"/><circle cx="66" cy="157" r="6" fill="#ffd35a" stroke="#fff" stroke-width="1"/><ellipse cx="66" cy="137" rx="26.7" ry="6" fill="#e8590c"/><line x1="38.0" y1="140.0" x2="94.0" y2="140.0" stroke="#7a6a55" stroke-width="1.2" stroke-dasharray="3 2"/><ellipse cx="61" cy="90" rx="11" ry="14.3" fill="#e8590c"/><ellipse cx="73" cy="40" rx="9" ry="11.7" fill="#e8590c"/><ellipse cx="68" cy="23" rx="18" ry="5.5" fill="#b23c06"/><ellipse cx="42.7" cy="71.6" rx="6" ry="9" fill="#b23c06"/><line x1="61.0" y1="112.0" x2="61.0" y2="27.0" stroke="#b23c06" stroke-width="1.6" /><polygon points="61.0,20.0 64.5,27.0 57.5,27.0" fill="#b23c06"/><line x1="42.6" y1="37.0" x2="38.0" y2="103.0" stroke="#5b2bc4" stroke-width="1.6" /><polygon points="37.5,110.0 34.5,102.8 41.5,103.3" fill="#5b2bc4"/><line x1="89.4" y1="37.0" x2="94.0" y2="103.0" stroke="#5b2bc4" stroke-width="1.6" /><polygon points="94.5,110.0 90.5,103.3 97.5,102.8" fill="#5b2bc4"/><text x="84.0" y="161.0" font-size="11" text-anchor="start" fill="#584e60" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>bulb</text><text x="150.0" y="17.0" font-size="12" text-anchor="start" fill="#6b2fa8" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>1 · Heat</text><text x="150.0" y="31.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>the pool on the coil warms;</text><text x="150.0" y="45.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>a tower forms and pinches off</text><text x="150.0" y="59.0" font-size="12" text-anchor="start" fill="#6b2fa8" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>2 · Rise</text><text x="150.0" y="73.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>lighter than the liquid, it</text><text x="150.0" y="87.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>stretches into a teardrop</text><text x="150.0" y="101.0" font-size="12" text-anchor="start" fill="#6b2fa8" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>3 · Rest and cool</text><text x="150.0" y="115.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>it flattens under the cap</text><text x="150.0" y="129.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>and gives up its heat</text><text x="150.0" y="143.0" font-size="12" text-anchor="start" fill="#6b2fa8" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>4 · Sink and merge</text><text x="150.0" y="157.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>denser again, it slides down</text><text x="150.0" y="171.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>the glass and rejoins the pool</text></svg>
