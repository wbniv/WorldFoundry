<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 142" width="690" height="142" role="img" aria-label="A lava lamp in cross-section: wax heats on the coil, rises up the middle, rests under the cap, sinks by the glass"><title>A lava lamp in cross-section: wax heats on the coil, rises up the middle, rests under the cap, sinks by the glass</title><rect width="690" height="142" fill="#ffffff"/><polygon points="67.7,116.0 66.8,113.3 66.0,110.6 65.2,107.9 64.6,105.2 64.1,102.5 63.6,99.8 63.3,97.1 63.0,94.4 62.9,91.7 62.8,89.0 62.9,86.3 62.9,83.6 63.0,80.9 63.1,78.2 63.2,75.5 63.3,72.8 63.5,70.1 63.7,67.4 63.9,64.7 64.2,62.0 64.5,59.3 64.8,56.6 65.1,53.9 65.5,51.2 65.9,48.5 66.3,45.8 66.7,43.1 67.2,40.4 67.7,37.7 68.2,35.0 68.8,32.3 69.4,29.6 70.0,26.9 70.6,24.2 71.3,21.5 72.0,18.8 72.7,16.1 73.4,13.4 74.2,10.7 75.0,8.0 109.0,8.0 109.8,10.7 110.6,13.4 111.3,16.1 112.0,18.8 112.7,21.5 113.4,24.2 114.0,26.9 114.6,29.6 115.2,32.3 115.8,35.0 116.3,37.7 116.8,40.4 117.3,43.1 117.7,45.8 118.1,48.5 118.5,51.2 118.9,53.9 119.2,56.6 119.5,59.3 119.8,62.0 120.1,64.7 120.3,67.4 120.5,70.1 120.7,72.8 120.8,75.5 120.9,78.2 121.0,80.9 121.1,83.6 121.1,86.3 121.2,89.0 121.1,91.7 121.0,94.4 120.7,97.1 120.4,99.8 119.9,102.5 119.4,105.2 118.8,107.9 118.0,110.6 117.2,113.3 116.3,116.0" fill="#e7defa" stroke="#5b2bc4" stroke-width="1.6"/><polygon points="75.0,8 109.0,8 96,2 88,2" fill="#b88a1e"/><polygon points="65.7,116 118.3,116 138,138 46,138" fill="#b88a1e"/><circle cx="92" cy="129" r="6" fill="#ffd35a" stroke="#fff" stroke-width="1"/><ellipse cx="92" cy="112" rx="23.0" ry="5" fill="#e8590c"/><line x1="70.0" y1="114.0" x2="114.0" y2="114.0" stroke="#7a6a55" stroke-width="1.2" stroke-dasharray="3 2"/><ellipse cx="88" cy="76" rx="9" ry="11.7" fill="#e8590c"/><ellipse cx="98" cy="38" rx="7" ry="9.1" fill="#e8590c"/><ellipse cx="94" cy="15" rx="14" ry="4.5" fill="#b23c06"/><ellipse cx="72.8" cy="56.6" rx="5" ry="7" fill="#b23c06"/><line x1="88.0" y1="92.0" x2="88.0" y2="31.0" stroke="#b23c06" stroke-width="1.6" /><polygon points="88.0,24.0 91.5,31.0 84.5,31.0" fill="#b23c06"/><line x1="72.2" y1="27.4" x2="68.4" y2="82.0" stroke="#5b2bc4" stroke-width="1.6" /><polygon points="67.9,89.0 64.9,81.8 71.9,82.3" fill="#5b2bc4"/><line x1="111.8" y1="27.4" x2="115.6" y2="82.0" stroke="#5b2bc4" stroke-width="1.6" /><polygon points="116.1,89.0 112.1,82.3 119.1,81.8" fill="#5b2bc4"/><text x="108.0" y="133.0" font-size="11" text-anchor="start" fill="#584e60" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>bulb</text><text x="200.0" y="22.0" font-size="12" text-anchor="start" fill="#6b2fa8" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>1 · Heat</text><text x="200.0" y="36.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>the pool on the coil warms; a tower forms and pinches off</text><text x="200.0" y="54.0" font-size="12" text-anchor="start" fill="#6b2fa8" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>2 · Rise</text><text x="200.0" y="68.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>warm wax is lighter than the liquid; it stretches into a teardrop</text><text x="200.0" y="86.0" font-size="12" text-anchor="start" fill="#6b2fa8" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>3 · Rest and cool</text><text x="200.0" y="100.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>it flattens under the cap and gives up its heat</text><text x="200.0" y="118.0" font-size="12" text-anchor="start" fill="#6b2fa8" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>4 · Sink and merge</text><text x="200.0" y="132.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>denser again, it slides down by the glass; the coil lets it rejoin</text></svg>
