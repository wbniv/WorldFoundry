<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 150" width="232" height="150" role="img" aria-label="Schematic: the wax mix is denser than the water when cold and lighter when hot"><title>Schematic: the wax mix is denser than the water when cold and lighter when hot</title><rect width="232" height="150" fill="#ffffff"/><line x1="30.0" y1="10.0" x2="30.0" y2="112.0" stroke="#21182a" stroke-width="1.2" /><line x1="30.0" y1="112.0" x2="224.0" y2="112.0" stroke="#21182a" stroke-width="1.2" /><text x="24.0" y="18.0" font-size="13" text-anchor="end" fill="#21182a" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>ρ</text><text x="224.0" y="127.0" font-size="11" text-anchor="end" fill="#584e60" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>temperature →</text><line x1="30.0" y1="44.0" x2="224.0" y2="66.0" stroke="#5b2bc4" stroke-width="2.4" /><line x1="30.0" y1="22.0" x2="224.0" y2="96.0" stroke="#e8590c" stroke-width="2.4" /><circle cx="112.1" cy="53.3" r="4" fill="#21182a"/><text x="118.1" y="46.3" font-size="11" text-anchor="start" fill="#21182a" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>crossing</text><text x="36.0" y="16.0" font-size="11" text-anchor="start" fill="#b23c06" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>wax mix</text><text x="224.0" y="80.0" font-size="11" text-anchor="end" fill="#5b2bc4" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>water</text><text x="34.0" y="127.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>cold: sinks</text><text x="34.0" y="142.0" font-size="11" text-anchor="start" fill="#21182a" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>hot: rises</text></svg>
