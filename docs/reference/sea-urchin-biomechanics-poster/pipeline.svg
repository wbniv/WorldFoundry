<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 245" role="img"><title>Proposed input, contact and pose data flow</title><rect width="1000" height="245" rx="18" fill="#edf3f1"/><rect x="25" y="65" width="220" height="90" rx="12" fill="#d7e5de"/><text x="45" y="102" font-family="sans-serif" font-size="20" fill="#263c48">Input + modal gate</text><text x="45" y="131" font-family="sans-serif" font-size="18" fill="#263c48">Forth intent</text><rect x="275" y="65" width="220" height="90" rx="12" fill="#d9cce7"/><text x="295" y="102" font-family="sans-serif" font-size="20" fill="#263c48">Actual movement</text><text x="295" y="131" font-family="sans-serif" font-size="18" fill="#263c48">Contact state</text><rect x="525" y="65" width="220" height="90" rx="12" fill="#d7e5de"/><text x="545" y="102" font-family="sans-serif" font-size="20" fill="#263c48">Anchors + pivots</text><text x="545" y="131" font-family="sans-serif" font-size="18" fill="#263c48">Existing actor poses</text><rect x="775" y="65" width="220" height="90" rx="12" fill="#d9cce7"/><text x="795" y="102" font-family="sans-serif" font-size="20" fill="#263c48">Mesh + atlas</text><text x="795" y="131" font-family="sans-serif" font-size="18" fill="#263c48">Render / measure</text><path d="M245 108 H275 M495 108 H525 M745 108 H775" stroke="#167e83" stroke-width="4"/><text x="25" y="210" font-family="sans-serif" font-size="21" fill="#263c48">One director; bounded contact slots. Full single-mesh articulation is a separate decision.</text></svg>