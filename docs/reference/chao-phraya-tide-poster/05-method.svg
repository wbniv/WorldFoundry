<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 524 150" width="524" height="150" role="img" aria-label="From the printed table to the fitted constants"><title>From the printed table to the fitted constants</title><rect width="524" height="150" fill="#ffffff"/><rect x="8" y="14" width="118" height="118" rx="4" fill="#f4f7fa" stroke="#d9e0e6" stroke-width="1.2"/><text x="16.0" y="31.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>8 Jan, printed</text><text x="20.0" y="52.0" font-size="12" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>0437</text><text x="112.0" y="52.0" font-size="12" text-anchor="end" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>1.12 m</text><text x="20.0" y="72.0" font-size="12" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>1132</text><text x="112.0" y="72.0" font-size="12" text-anchor="end" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>3.09 m</text><text x="20.0" y="92.0" font-size="12" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>1731</text><text x="112.0" y="92.0" font-size="12" text-anchor="end" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>2.44 m</text><text x="20.0" y="112.0" font-size="12" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>2043</text><text x="112.0" y="112.0" font-size="12" text-anchor="end" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>2.73 m</text><line x1="128.0" y1="73.0" x2="143.0" y2="73.0" stroke="#0f6f86" stroke-width="2" /><polygon points="150.0,73.0 143.0,76.5 143.0,69.5" fill="#0f6f86"/><rect x="152" y="30" width="112" height="86" rx="4" fill="#eef6f8" stroke="#0f6f86" stroke-width="1.2"/><text x="160.0" y="50.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>at every event:</text><text x="160.0" y="67.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>height = listed</text><text x="160.0" y="84.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>slope = zero</text><text x="160.0" y="101.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>(a flat top)</text><line x1="266.0" y1="73.0" x2="281.0" y2="73.0" stroke="#0f6f86" stroke-width="2" /><polygon points="288.0,73.0 281.0,76.5 281.0,69.5" fill="#0f6f86"/><rect x="290" y="30" width="112" height="86" rx="4" fill="#eef6f8" stroke="#0f6f86" stroke-width="1.2"/><text x="298.0" y="50.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>one linear</text><text x="298.0" y="67.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>least squares</text><text x="298.0" y="84.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>171 candidate</text><text x="298.0" y="101.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>waves</text><line x1="404.0" y1="73.0" x2="419.0" y2="73.0" stroke="#0f6f86" stroke-width="2" /><polygon points="426.0,73.0 419.0,76.5 419.0,69.5" fill="#0f6f86"/><rect x="428" y="30" width="88" height="86" rx="4" fill="#e8f1fb" stroke="#2c5d8a" stroke-width="1.8"/><text x="436.0" y="50.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="700" font-family='"Noto Sans","DejaVu Sans",sans-serif'>64 waves</text><text x="436.0" y="67.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>kept, with</text><text x="436.0" y="84.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>their phase</text><text x="436.0" y="101.0" font-size="11" text-anchor="start" fill="#1d2733" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>and size</text><text x="8.0" y="146.0" font-size="11" text-anchor="start" fill="#55636f" font-weight="400" font-family='"Noto Sans","DejaVu Sans",sans-serif'>the table lists only tops and bottoms, so nothing is drawn through them</text></svg>
