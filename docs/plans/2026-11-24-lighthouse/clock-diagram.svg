<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="t d">
 <title id="t">How the lighthouse clock reads 10:08:22</title><desc id="d">Twelve rocks circle the lighthouse. Ten lit windows show the hour; the boat at eight minutes and the beam at 22 seconds follow the ring clockwise.</desc>
 <rect width="1100" height="460" rx="18" fill="#0c1725"/>
 <g transform="translate(245 230)"><circle r="164" fill="#102e4a" stroke="#46829c" stroke-width="3"/><g fill="#777f83"><circle cx="0" cy="-150" r="9"/><circle cx="75" cy="-130" r="9"/><circle cx="130" cy="-75" r="9"/><circle cx="150" cy="0" r="9"/><circle cx="130" cy="75" r="9"/><circle cx="75" cy="130" r="9"/><circle cx="0" cy="150" r="9"/><circle cx="-75" cy="130" r="9"/><circle cx="-130" cy="75" r="9"/><circle cx="-150" cy="0" r="9"/><circle cx="-130" cy="-75" r="9"/><circle cx="-75" cy="-130" r="9"/></g>
 <path d="M0 0 L112 100 L79 126 Z" fill="#ffde83" opacity=".38"/><line x1="0" y1="0" x2="108" y2="101" stroke="#ffdf7b" stroke-width="5"/><circle r="20" fill="#c74e39"/><circle r="8" fill="#ffdc83"/><path d="M93 -111 l16 12 l-14 5 z" fill="#f4dec0" stroke="#ba7544" stroke-width="3"/>
 <g fill="#e1e8ee" font-family="sans-serif" font-size="18" text-anchor="middle"><text x="0" y="-177">12 / 00</text><text x="179" y="6">3</text><text x="0" y="192">6</text><text x="-178" y="6">9</text></g></g>
 <g font-family="sans-serif" fill="#e9f3fa"><text x="500" y="75" font-weight="bold" font-size="29">10:08:22</text><text x="500" y="130" font-size="21">10 lit tower windows → hour</text><text x="500" y="177" font-size="21">Boat at 8 minutes → minute</text><text x="500" y="224" font-size="21">Beam at 22 seconds → second</text><text x="500" y="285" font-size="18" fill="#b6cedc">Both sweep clockwise; the boat moves continuously.</text><text x="500" y="321" font-size="18" fill="#b6cedc">At noon and midnight, all windows go dark.</text><text x="500" y="357" font-size="18" fill="#b6cedc">Rock 12 is the shared starting direction.</text></g>
</svg>
