DERED HERO SLOT · drawn stand-in now; replace with the actual upgraded opaque fish render</text><path d="M55 850 H1145" stroke="#bd9c35" stroke-width="3"/><text x="55" y="893" class="label">Centuries of breeding</text><text x="55" y="925" class="small">Thailand: reported breeding history</text><text x="55" y="950" class="small">Exact starting date remains uncertain</text><text x="420" y="893" class="label">Early 20th century</text><text x="420" y="925" class="small">Ornamental selection develops</text><text x="420" y="950" class="small">many colors and elaborate fin forms</text><text x="785" y="893" class="label">5 February 2019</text><text x="785" y="925" class="small">Thailand’s National Aquatic Animal</text><text x="785" y="950" class="small">official designation</text><rect x="55" y="1000" width="545" height="400" rx="9" fill="#e4e8e0"/><text x="73" y="1037" class="label">WHERE WILD BETTAS LIVE</text><g transform="translate(95 1050) scale(.61)"><path d="M80 0L120 15L150 30L155 70L175 100L235 95L240 150L290 175L305 240L275 270L250 258L237 255L240 290L205 305L190 280L150 280L145 340L162 400L205 455L192 476L163 446L120 399L117 343L128 298L115 274L126 245L100 195L95 156L72 143L68 90L45 80L60 30Z" fill="#a9c9bc" stroke="#4c756d" stroke-width="3"/><circle cx="105" cy="80" r="12" fill="#27768b"/><text x="105" y="85" text-anchor="middle" font-size="15" font-weight="bold" style="fill:white">1</text><circle cx="117" cy="223" r="12" fill="#27768b"/><text x="117" y="228" text-anchor="middle" font-size="15" font-weight="bold" style="fill:white">2</text><circle cx="156" cy="259" r="12" fill="#27768b"/><text x="156" y="264" text-anchor="middle" font-size="15" font-weight="bold" style="fill:white">3</text><circle cx="134" cy="280" r="12" fill="#27768b"/><text x="134" y="285" text-anchor="middle" font-size="15" font-weight="bold" style="fill:white">4</text><text x="175" y="180" class="small">THAILAND</text><path d="M280 35V5l-7 13m7-13 7 13" stroke="#35595c" stroke-width="2" fill="none"/><text x="275" y="58" class="small">N</text></g><text x="330" y="1098" class="small">1. Chiang Mai</text><text x="330" y="1138" class="small">2. Kanchanaburi</text><text x="330" y="1178" class="small">3. Bang Phlat</text><text x="330" y="1218" class="small">4. Phetchaburi</text><text x="330" y="1290" class="small">Wild B. splendens localities</text><text x="330" y="1322" class="small">Kwon 2022, Fig. 1A/B</text><text x="73" y="1365" class="small">MAP CONCEPT · approximate regions</text><text x="73" y="1390" class="small">Not GPS sites or a complete range.</text><rect x="625" y="1000" width="545" height="140" rx="9" fill="#e4e8e0"/><text x="643" y="1037" class="label">HOME IN SHALLOW WATER</text><text x="643" y="1078" class="small">Vegetated pools, canals and rice paddies.</text><text x="643" y="1108" class="small">A labyrinth organ supports air breathing; gills also work.</text><rect x="625" y="1150" width="545" height="140" rx="9" fill="#e4e8e0"/><text x="643" y="1187" class="label">WILD VS ORNAMENTAL</text><text x="643" y="1228" class="small">Wild-type forms have compact fins.</text><text x="643" y="1258" class="small">The extravagant hero is a domesticated long-fin variety.</text><rect x="625" y="1300" width="545" height="140" rx="9" fill="#e4e8e0"/><text x="643" y="1337" class="label">BUBBLE-NEST CARE</text><text x="643" y="1378" class="small">B. splendens males care for eggs in bubble nests.</text><text x="643" y="1408" class="small">Other Betta species may use mouth brooding.</text><rect x="625" y="1450" width="545" height="140" rx="9" fill="#e4e8e0"/><text x="643" y="1487" class="label">BEAUTY HAS A COST</text><text x="643" y="1528" class="small">Larger caudal fins are linked with lower burst speed.</text><text x="643" y="1558" class="small">The 2026 abstract does not supply full fin-wave motion.</text><rect x="55" y="1430" width="545" height="160" rx="9" fill="#e4e8e0"/><text x="73" y="1467" class="label">FLOW, TURN, SETTLE</text><text x="73" y="1508" class="small">Fin roots stay attached; free edges curve and lag.</text><text x="73" y="1538" class="small">Diagram values are game choices, not measured betta rates.</text><text x="55" y="1610" class="small">Sources: Kwon 2022 · SEAFDEC 2019 · Thai Natural History Museum 2017 · Smith/Hopkins 2026</text><text x="55" y="1642" class="small">A3 LAYOUT MOCKUP · rendered hero + oblique detail required; final renders and PDF pending</text></svg>