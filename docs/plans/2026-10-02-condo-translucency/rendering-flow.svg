<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#40576b"/></marker></defs><rect width="1160" height="500" fill="#f8fafc"/><g font-family="sans-serif"><text x="28" y="35" font-size="25" fill="#182a39">Proposed material and compositing path</text><rect x="28" y="65" width="255" height="125" rx="8" fill="#e5eef5" stroke="#91a8bc"/><text x="43" y="94" font-size="20" fill="#182a39">Authoring</text><text x="43" y="126" font-size="15" fill="#182a39">Glass / shade opacity</text><text x="43" y="151" font-size="15" fill="#182a39">Opaque frame / hardware</text><path d="M284,127 H304" stroke="#40576b" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="65" width="255" height="125" rx="8" fill="#e5eef5" stroke="#91a8bc"/><text x="325" y="94" font-size="20" fill="#182a39">Model + runtime</text><text x="325" y="126" font-size="15" fill="#182a39">Optional OPAC chunk</text><text x="325" y="151" font-size="15" fill="#182a39">Missing chunk = opaque</text><path d="M566,127 H586" stroke="#40576b" stroke-width="2" marker-end="url(#arrow)"/><rect x="592" y="65" width="255" height="125" rx="8" fill="#e5eef5" stroke="#91a8bc"/><text x="607" y="94" font-size="20" fill="#182a39">Shared draw queue</text><text x="607" y="126" font-size="15" fill="#182a39">Copy transforms + draw state</text><text x="607" y="151" font-size="15" fill="#182a39">Opaque first; sort translucent</text><path d="M848,127 H868" stroke="#40576b" stroke-width="2" marker-end="url(#arrow)"/><rect x="874" y="65" width="255" height="125" rx="8" fill="#e5eef5" stroke="#91a8bc"/><text x="889" y="94" font-size="20" fill="#182a39">GL / GLES / Metal</text><text x="889" y="126" font-size="15" fill="#182a39">Blend + depth test</text><text x="889" y="151" font-size="15" fill="#182a39">No translucent depth writes</text><text x="28" y="240" font-size="20" fill="#182a39">Example: camera inside the room, shade down and glass closed</text><rect x="45" y="270" width="265" height="86" rx="6" fill="#7f97aa"/><text x="59" y="301" font-size="18" fill="#182a39">Opaque outside scene</text><text x="59" y="329" font-size="15" fill="#182a39">Draw first; write depth</text><path d="M313,312 H365" stroke="#40576b" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="270" width="265" height="86" rx="6" fill="#b7ad91"/><text x="394" y="301" font-size="18" fill="#182a39">Translucent shade</text><text x="394" y="329" font-size="15" fill="#182a39">Draw second; read depth</text><path d="M648,312 H700" stroke="#40576b" stroke-width="2" marker-end="url(#arrow)"/><rect x="715" y="270" width="265" height="86" rx="6" fill="#79b3ca"/><text x="729" y="301" font-size="18" fill="#182a39">Translucent glass</text><text x="729" y="329" font-size="15" fill="#182a39">Draw third; read depth</text><text x="1010" y="311" font-size="17" fill="#182a39">Camera</text><text x="28" y="405" font-size="17" fill="#182a39">When viewed from outside, shade / glass order reverses automatically.</text><text x="28" y="438" font-size="17" fill="#182a39">UI and matte passes remain separate; restore blend and depth state before overlays.</text></g></svg>