<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">River krathongs activation rules</title><desc id="desc">During daylight the krathongs are hidden. At night, Every night shows them, while Festival nights shows them only on a verified festival evening or its following morning.</desc>
<rect width="1100" height="520" rx="18" fill="#f4f7f5"/><g font-family="sans-serif" fill="#18393a"><text x="45" y="55" font-size="28" font-weight="bold">When are the krathongs visible?</text><text x="45" y="88" font-size="17">Local wall time and the level's sunset / sunrise calculations</text></g>
<g font-family="sans-serif" font-size="18" text-anchor="middle"><rect x="40" y="140" width="220" height="110" rx="12" fill="#fff" stroke="#90a8a3" stroke-width="2"/><text x="150" y="185" fill="#18393a" font-weight="bold">Daytime</text><text x="150" y="216" fill="#526c68">Either setting</text><rect x="40" y="292" width="220" height="110" rx="12" fill="#dcece8" stroke="#70a69c" stroke-width="2"/><text x="150" y="337" fill="#18393a" font-weight="bold">Nighttime</text><text x="150" y="367" fill="#526c68">Choose setting</text>
<rect x="350" y="292" width="240" height="80" rx="12" fill="#fff" stroke="#90a8a3" stroke-width="2"/><text x="470" y="340" fill="#18393a" font-weight="bold">Every night</text><rect x="350" y="400" width="240" height="80" rx="12" fill="#fff" stroke="#90a8a3" stroke-width="2"/><text x="470" y="448" fill="#18393a" font-weight="bold">Festival nights</text>
<rect x="700" y="140" width="330" height="78" rx="12" fill="#e6e8e5"/><text x="865" y="187" fill="#425751" font-weight="bold">HIDE KRATHONGS</text><rect x="700" y="292" width="330" height="80" rx="12" fill="#d3ede0"/><text x="865" y="340" fill="#175445" font-weight="bold">SHOW KRATHONGS</text><rect x="700" y="400" width="330" height="80" rx="12" fill="#fff7dd" stroke="#e0bd6d"/><text x="865" y="431" fill="#655120" font-weight="bold">Verified festival date?</text><text x="865" y="458" fill="#655120" font-size="15">After midnight: use yesterday's date</text></g>
<g fill="none" stroke="#64817b" stroke-width="3"><path d="M260 195H700"/><path d="M260 347H350"/><path d="M300 347v93h50"/><path d="M590 332h110"/><path d="M590 440h110"/><path d="M1030 440h35V332h-35"/></g><text x="1040" y="390" fill="#175445" font-family="sans-serif" font-size="16">Yes</text><text x="730" y="505" fill="#655120" font-family="sans-serif" font-size="15">No → hidden</text>
</svg>
