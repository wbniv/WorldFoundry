<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="flow concept"><style>text{font-family:system-ui,sans-serif;fill:#e9f2f4}.title{font-size:30px;font-weight:650}.sub{font-size:15px;fill:#acc2ce}.note{font-size:17px;fill:#b6cbd6}</style><rect width="1000" height="620" rx="18" fill="#101e2c"/><text x="38" y="48" class="title">Independent tanks → coordinated integration</text><text x="38" y="79" class="sub">No edits to the two active tanks during standalone development.</text><rect x="25" y="115" width="235" height="155" rx="12" fill="#213b4b" stroke="#6b96a7"/><text x="43" y="149" font-size="21">Calm Betta</text><text x="43" y="183" class="sub">aquarium_betta/</text><text x="43" y="216" class="note">Dedicated scene build</text><text x="43" y="245" class="sub">→ checked standalone</text><path d="M142 270 V306 H500 V328" stroke="#8bc2cf" stroke-width="2" fill="none"/><rect x="270" y="115" width="235" height="155" rx="12" fill="#213b4b" stroke="#6b96a7"/><text x="288" y="149" font-size="21">Jellyfish</text><text x="288" y="183" class="sub">aquarium_jellyfish/</text><text x="288" y="216" class="note">Dedicated scene build</text><text x="288" y="245" class="sub">→ checked standalone</text><path d="M387 270 V306 H500 V328" stroke="#8bc2cf" stroke-width="2" fill="none"/><rect x="515" y="115" width="235" height="155" rx="12" fill="#213b4b" stroke="#6b96a7"/><text x="533" y="149" font-size="21">Lionfish</text><text x="533" y="183" class="sub">aquarium_lionfish/</text><text x="533" y="216" class="note">Dedicated scene build</text><text x="533" y="245" class="sub">→ checked standalone</text><path d="M632 270 V306 H500 V328" stroke="#8bc2cf" stroke-width="2" fill="none"/><rect x="760" y="115" width="235" height="155" rx="12" fill="#213b4b" stroke="#6b96a7"/><text x="778" y="149" font-size="21">Planted Tank</text><text x="778" y="183" class="sub">aquarium_plants/</text><text x="778" y="216" class="note">Dedicated scene build</text><text x="778" y