<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title"><title id="title">Design diagram</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#167c86"/></marker></defs><rect width="1200" height="520" rx="18" fill="#f0f4ef"/><text x="28" y="40" font-size="25" fill="#183b43" font-family="DejaVu Sans,sans-serif">AUTHORED DATA + FORTH BEHAVIOR → SHARED MESH EVALUATION</text><rect x="25" y="80" width="330" height="130" rx="12" fill="#e3eee7" stroke="#9ab8af"/><text x="43" y="111" font-size="22" fill="#183b43" font-family="DejaVu Sans,sans-serif">OAS → OAD</text><text x="43" y="142" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Parameter names, ranges, defaults</text><text x="43" y="168" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Explicit channel/settings bindings</text><rect x="25" y="250" width="330" height="145" rx="12" fill="#e3eee7" stroke="#9ab8af"/><text x="43" y="281" font-size="22" fill="#183b43" font-family="DejaVu Sans,sans-serif">Mesh + rig authoring</text><text x="43" y="312" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Rest geometry, roots, pivots</text><text x="43" y="338" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Curves, vertex influences, UVs</text><rect x="435" y="155" width="300" height="155" rx="12" fill="#e3eee7" stroke="#9ab8af"/><text x="453" y="186" font-size="22" fill="#183b43" font-family="DejaVu Sans,sans-serif">Validate + cook</text><text x="453" y="217" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">DFRM descriptors / numeric indices</text><text x="453" y="243" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Cache immutable rest data</text><polyline points="355,145 395,145 395,195 435,195" stroke="#167c86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><polyline points="355,315 395,315 395,270 435,270" stroke="#167c86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="820" y="80" width="355" height="130" rx="12" fill="#e3eee7" stroke="#9ab8af"/><text x="838" y="111" font-size="22" fill="#183b43" font-family="DejaVu Sans,sans-serif">Forth controller</text><text x="838" y="142" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Flow / withdrawal / action timing</text><text x="838" y="168" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Publish one channel block per actor</text><rect x="820" y="270" width="355" height="140" rx="12" fill="#e3eee7" stroke="#9ab8af"/><text x="838" y="301" font-size="22" fill="#183b43" font-family="DejaVu Sans,sans-serif">Shared native evaluator</text><text x="838" y="332" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Snapshot channels; evaluate rig</text><text x="838" y="358" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Update one writable mesh</text><polyline points="735,235 780,235 780,340 820,340" stroke="#167c86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><polyline points="995,210 995,270" stroke="#167c86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="30" y="463" font-size="20" fill="#183b43" font-family="DejaVu Sans,sans-serif">Texture UVs remain texture UVs. Behavior stays in Forth. Curves are data inside the actor.</text><text x="30" y="496" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Proposed architecture · no engine implementation or performance result implied</text></svg>