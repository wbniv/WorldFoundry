<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title"><title id="title">Design diagram</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#167c86"/></marker></defs><rect width="1200" height="450" rx="18" fill="#f0f4ef"/><text x="28" y="40" font-size="25" fill="#183b43" font-family="DejaVu Sans,sans-serif">CHANNEL PACKET → ONE ACTOR → MANY INTERNAL GROUPS</text><rect x="25" y="90" width="325" height="220" rx="12" fill="#e3eee7" stroke="#9ab8af"/><text x="43" y="121" font-size="22" fill="#183b43" font-family="DejaVu Sans,sans-serif">Pose values</text><text x="43" y="152" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">phase       0..1 turns</text><text x="43" y="178" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">flow-x      bounded scalar</text><text x="43" y="204" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">flow-y      bounded scalar</text><text x="43" y="230" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">withdrawal  0..1</text><text x="43" y="256" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Example only; rig declares bindings</text><rect x="435" y="125" width="270" height="155" rx="12" fill="#e3eee7" stroke="#9ab8af"/><text x="453" y="156" font-size="22" fill="#183b43" font-family="DejaVu Sans,sans-serif">deform-apply</text><text x="453" y="187" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">One native pose submission</text><text x="453" y="213" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Snapshot and validate all inputs</text><polyline points="350,180 435,180" stroke="#167c86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="800" y="75" width="375" height="255" rx="12" fill="#e3eee7" stroke="#9ab8af"/><text x="818" y="106" font-size="22" fill="#183b43" font-family="DejaVu Sans,sans-serif">One anemone mesh actor</text><text x="818" y="137" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Body transform group</text><text x="818" y="163" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">48 rooted curve descriptors</text><text x="818" y="189" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">3,420 authored vertices</text><text x="818" y="215" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">5,756 authored triangles</text><text x="818" y="241" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">Geometry counts are measured;</text><text x="818" y="267" font-size="17" fill="#183b43" font-family="DejaVu Sans,sans-serif">runtime costs remain unmeasured</text><polyline points="705,200 800,200" stroke="#167c86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="28" y="376" font-size="18" fill="#183b43" font-family="DejaVu Sans,sans-serif">Shared per asset: rig, rest curves, influence tables. Per instance: channels, response state, mesh output.</text><text x="28" y="420" font-size="20" fill="#183b43" font-family="DejaVu Sans,sans-serif">Forth publishes controls; native evaluation visits curves/vertices. No per-vertex mailbox traffic.</text></svg>