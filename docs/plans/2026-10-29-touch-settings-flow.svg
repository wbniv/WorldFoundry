<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
  <title id="title">Touch settings interaction flow</title>
  <desc id="desc">Settings button leads to object chooser, then form. The form opens native text or colour editors. Apply saves and closes; Cancel discards and closes. Back unwinds nested editors.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#537d60"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#203529;font-size:18px}.label{font-size:16px;fill:#506e57}.box{fill:#e6f0e5;stroke:#537d60;stroke-width:2}.entry{fill:#d3e8d5}.exit{fill:#f4e7bc}.line{fill:none;stroke:#537d60;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <rect class="box entry" x="28" y="129" width="160" height="72" rx="10"/><text x="52" y="159">Settings</text><text x="56" y="184">button</text>
  <rect class="box" x="263" y="129" width="190" height="72" rx="10"/><text x="289" y="159">Object chooser</text><text class="label" x="300" y="184">or direct owner</text>
  <rect class="box" x="527" y="129" width="175" height="72" rx="10"/><text x="590" y="159">Form</text><text class="label" x="552" y="184">sections and fields</text>
  <rect class="box" x="787" y="28" width="245" height="65" rx="10"/><text x="813" y="56">Native text editor</text><text class="label" x="830" y="79">numbers and text</text>
  <rect class="box" x="787" y="126" width="245" height="65" rx="10"/><text x="842" y="155">Colour editor</text><text class="label" x="820" y="178">swatches and values</text>
  <rect class="box exit" x="785" y="236" width="116" height="65" rx="10"/><text x="817" y="264">Apply</text><text class="label" x="821" y="287">save</text>
  <rect class="box exit" x="916" y="236" width="116" height="65" rx="10"/><text x="937" y="264">Cancel</text><text class="label" x="936" y="287">discard</text>
  <path class="line" d="M188 165H263"/><path class="line" d="M453 165H527"/>
  <path class="line" d="M702 151H747V61H787"/><path class="line" d="M702 165H787"/>
  <path class="line" d="M702 179H749V268H785"/><path class="line" d="M749 268H916"/>
  <text class="label" x="28" y="365">Back closes an editor first, then returns through chooser states. On the main form, system Back applies and closes.</text>
</svg>
