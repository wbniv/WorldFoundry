<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Moon lantern clock geometry">
<rect width="1000" height="400" rx="16" fill="#101828"/><g font-family="sans-serif" fill="#edf3fc"><text x="30" y="42" font-size="24" font-weight="bold">Lights and shadows: overhead</text><text x="510" y="108" font-size="20">Moon → short hour shadow</text><text x="510" y="150" font-size="20">Lantern → long minute shadow</text><text x="510" y="218" font-size="17">Both shadows point away from their lamps.</text><text x="510" y="250" font-size="17">Moon makes one circuit in 12 hours.</text><text x="510" y="282" font-size="17">Lantern makes one circuit in one hour.</text></g><circle cx="235" cy="215" r="146" fill="#1b2941" stroke="#9db1c7" stroke-width="2"/><circle cx="235" cy="215" r="4" fill="white"/><line x1="235" y1="215" x2="183" y2="259" stroke="#8698a9" stroke-width="12"/><line x1="235" y1="215" x2="334" y2="250" stroke="#c1d0d5" stroke-width="7"/><circle cx="315" cy="147" r="16" fill="#f1e7bd"/><circle cx="102" cy="168" r="9" fill="#ffc66e"/><line x1="315" y1="147" x2="235" y2="215" stroke="#f4e7c1" stroke-dasharray="5 5"/><line x1="102" y1="168" x2="235" y2="215" stroke="#ffc66e" stroke-dasharray="5 5"/><text x="228" y="57" fill="#e8eef7" font-family="sans-serif" font-size="16">12</text></svg>
