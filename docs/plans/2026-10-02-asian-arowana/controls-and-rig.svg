<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 425" role="img" aria-label="Arowana input, swim controller, rig and wall-clearance diagram"><title>Arowana input, swim controller, rig and wall-clearance diagram</title><g font-family="DejaVu Sans, sans-serif"><rect width="1100" height="425" fill="#e9f2ed"/><text x="35" y="42" fill="#153938" font-size="24" text-anchor="start" font-weight="700">Clownfish swimming baseline → arowana proportions</text><text x="35" y="102" fill="#b18134" font-size="19" text-anchor="start" font-weight="700">INPUT</text><text x="35" y="143" fill="#153938" font-size="16" text-anchor="start" font-weight="400">D-pad: requested heading</text><text x="35" y="180" fill="#153938" font-size="16" text-anchor="start" font-weight="400">OK: short swim burst</text><text x="35" y="217" fill="#153938" font-size="16" text-anchor="start" font-weight="400">Up then new OK: Side / Depth</text><text x="35" y="254" fill="#153938" font-size="16" text-anchor="start" font-weight="400">Desktop: existing A, B/C</text><text x="35" y="291" fill="#153938" font-size="16" text-anchor="start" font-weight="400">Phone baseline: A mode, B burst</text><path d="M 345,96 H 377 l -7,-6 m 7,6 l -7,6" fill="none" stroke="#b18134" stroke-width="2"/><text x="397" y="102" fill="#b18134" font-size="19" text-anchor="start" font-weight="700">STEER + SWIM</text><text x="397" y="143" fill="#153938" font-size="16" text-anchor="start" font-weight="400">Damped yaw / slower pitch</text><text x="397" y="180" fill="#153938" font-size="16" text-anchor="start" font-weight="400">Speed × current facing</text><text x="397" y="217" fill="#153938" font-size="16" text-anchor="start" font-weight="400">Reverse through a U-turn</text><text x="397" y="254" fill="#153938" font-size="16" text-anchor="start" font-weight="400">Release → glide / fin brake</text><text x="397" y="291" fill="#153938" font-size="16" text-anchor="start" font-weight="400">No sideways axis sliding</text><path d="M 707,96 H 739 l -7,-6 m 7,6 l -7,6" fill="none" stroke="#b18134" stroke-width="2"/><text x="759" y="102" fill="#b18134" font-size="19" text-anchor="start" font-weight="700">POSE + CLEARANCE</text><text x="759" y="143" fill="#153938" font-size="16" text-anchor="start" font-weight="400">Body wave grows toward tail</text><text x="759" y="180" fill="#153938" font-size="16" text-anchor="start" font-weight="400">Seven fins + two barbels</text><text x="759" y="217" fill="#153938" font-size="16" text-anchor="start" font-weight="400">All parts share yaw/pitch/roll</text><text x="759" y="254" fill="#153938" font-size="16" text-anchor="start" font-weight="400">Nose, tail and fins inside walls</text><text x="759" y="291" fill="#153938" font-size="16" text-anchor="start" font-weight="400">Slow near floor and surface</text><text x="35" y="377" fill="#153938" font-size="17" text-anchor="start" font-weight="600">Chromecast chord is proposed; physical remote validation remains required.</text><text x="35" y="404" fill="#153938" font-size="15" text-anchor="start" font-weight="400">Unified phone A=Action / B=Mode belongs to the separate movement-controls integration.</text></g></svg>