:root{--bg:#0f161c;--panel:#172028;--line:#2b3943;--fg:#e6edf0;--muted:#8fa1ab;--acc:#66bb6a;--warn:#efce83;--red:#ef5350;--blue:#42a5f5}

const P=(()=>{const pts=BPT.split('\n').slice(1).map(l=>l.trim().split(/\s+/)).filter(t=>t.length==3).map(t=>t.map(Number));return Array.from({length:32},(_,i)=>pts.slice(i*16,i*16+16));})();
const B=u=>[(1-u)**3,3*u*(1-u)**2,3*u*u*(1-u),u**3];
function ev(p,s,t){const bs=B(s),bt=B(t),r=[0,0,0];for(let i=0;i<4;i++)for(let j=0;j<4;j++){const w=bs[i]*bt[j],q=p[i*4+j];r[0]+=w*q[0];r[1]+=w*q[1];r[2]+=w*q[2];}return r}
function tess(n){const V=new Map(),verts=[],tris=[];const vid=q=>{const k=q.map(x=>String((+x.toFixed(6))+0)).join(',');let i=V.get(k);if(i===undefined){i=verts.length;V.set(k,i);verts.push(q)}return i};
for(const p of P){const g=[];for(let s=0;s<=n;s++){g.push([]);for(let t=0;t<=n;t++)g[s].push(vid(ev(p,s/n,t/n)))}
for(let s=0;s<n;s++)for(let t=0;t<n;t++){const a=g[s][t],b=g[s][t+1],c=g[s+1][t+1],d=g[s+1][t];for(const tri of [[a,b,c],[a,c,d]])if(new Set(tri).size==3)tris.push(tri)}}
const area=t=>{const a=verts[t[0]],b=verts[t[1]],c=verts[t[2]],u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],w=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];return Math.hypot(u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0])/2};
const kept=tris.filter(t=>area(t)>1e-12),used=[...new Set(kept.flat())].sort((a,b)=>a-b),m=new Map(used.map((o,i)=>[o,i]));
return{verts:used.map(i=>verts[i]),tris:kept.map(t=>t.map(i=>m.get(i)))}}
const L=[-.4,-.7,.6],ln=Math.hypot(...L);let tf=0,tv=0,allok=true;
const NS=[1,2,3,4,6,8,12,16],g=document.getElementById('g'),MAX=16256;
for(const n of NS){const {verts,tris}=tess(n);tf+=tris.length;tv+=verts.length;const ok=tris.length==(n==1?52:64*n*n-8*n);allok=allok&&ok;
const c=document.createElement('div');c.className='cell';c.innerHTML=`<canvas width="640" height="400"></canvas><h2>${tris.length.toLocaleString('en').replace(/,/g,'\u202f')} faces<small>n = ${n}</small></h2><div class="m mono">${verts.length.toLocaleString('en').replace(/,/g,'\u202f')} vertices · ${n==1?'52':'64n²−8n'} ${ok?'<span class="ok">✓</span>':'✗'}</div><div class="bar" style="width:${Math.max(2,100*Math.log(tris.length)/Math.log(MAX))}%"></div>`;g.appendChild(c);
const cv=c.querySelector('canvas'),x=cv.getContext('2d'),S=96,cx=320-0.2*S*1.0,by=372;
const pr=v=>[cx+v[0]*S*.98,by-v[2]*S*.98];
const T=tris.map(t=>{const a=verts[t[0]],b=verts[t[1]],d=verts[t[2]];const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],w=[d[0]-a[0],d[1]-a[1],d[2]-a[2]];const nn=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];const nl=Math.hypot(...nn)||1;const sh=Math.abs((nn[0]*L[0]+nn[1]*L[1]+nn[2]*L[2])/(nl*ln));return{t,sh,y:(a[1]+b[1]+d[1])/3}});
T.sort((p,q)=>q.y-p.y);
const dark=!matchMedia('(prefers-color-scheme:light)').matches;
for(const f of T){const [a,b,d]=f.t.map(i=>pr(verts[i]));x.beginPath();x.moveTo(...a);x.lineTo(...b);x.lineTo(...d);x.closePath();const l=(dark?24:40)+f.sh*(dark?46:44);x.fillStyle=`hsl(${dark?198:200} 24% ${l}%)`;x.fill();if(n<=8){x.strokeStyle=dark?'rgba(255,255,255,.28)':'rgba(0,0,0,.35)';x.lineWidth=n<=3?2:1;x.stroke()}else if(n==12){x.strokeStyle=dark?'rgba(255,255,255,.07)':'rgba(0,0,0,.1)';x.lineWidth=.6;x.stroke()}}}
document.getElementById('tf').textContent=tf.toLocaleString('en').replace(/,/g,'\u202f');document.getElementById('tv').textContent=tv.toLocaleString('en').replace(/,/g,'\u202f');
document.getElementById('chk').textContent=allok?'✓ every count matches 64n² − 8n (n = 1: 52, four collinear faces dropped too)':'✗ count mismatch';
</script></body></html>
