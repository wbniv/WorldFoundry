<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#416477"/></marker></defs><rect width="1200" height="520" fill="#f3f8fa"/><g font-family="sans-serif"><text x="28" y="35" font-size="25" fill="#183440">Shared rig, two material sets, one colony</text><rect x="30" y="75" width="350" height="105" rx="8" fill="#e0edf2" stroke="#87a9b8"/><text x="44" y="105" font-size="19" fill="#183440">Shared five-part rig</text><text x="44" y="134" font-size="14" fill="#183440">body • tail • near legs • far legs • antennae</text><rect x="440" y="75" width="330" height="105" rx="8" fill="#e0edf2" stroke="#87a9b8"/><text x="454" y="105" font-size="19" fill="#183440">Blue Jelly materials</text><text x="454" y="134" font-size="14" fill="#183440">light blue shell + clear appendages</text><text x="454" y="157" font-size="14" fill="#183440">dark eyes; restrained internal cue</text><rect x="820" y="75" width="350" height="105" rx="8" fill="#e0edf2" stroke="#87a9b8"/><text x="834" y="105" font-size="19" fill="#183440">Blue Dream materials</text><text x="834" y="134" font-size="14" fill="#183440">deep blue shell + clear appendages</text><text x="834" y="157" font-size="14" fill="#183440">dark eyes; shared silhouette</text><rect x="30" y="237" width="350" height="105" rx="8" fill="#e0edf2" stroke="#87a9b8"/><text x="44" y="267" font-size="19" fill="#183440">Deterministic assignment</text><text x="44" y="296" font-size="14" fill="#183440">12 Jelly / 12 Dream at count 24</text><text x="44" y="319" font-size="14" fill="#183440">player included; no extra animals</text><rect x="440" y="237" width="330" height="105" rx="8" fill="#e0edf2" stroke="#87a9b8"/><text x="454" y="267" font-size="19" fill="#183440">Existing controller + routes</text><text x="454" y="296" font-size="14" fill="#183440">same actor blocks / pivots / bounds</text><text x="454" y="319" font-size="14" fill="#183440">mixed substrate, rock, wood, swims</text><rect x="820" y="237" width="350" height="105" rx="8" fill="#e0edf2" stroke="#87a9b8"/><text x="834" y="267" font-size="19" fill="#183440">Shared translucency renderer</text><text x="834" y="296" font-size="14" fill="#183440">opaque scenery / eyes first</text><text x="834" y="319" font-size="14" fill="#183440">camera-sorted shell triangles</text><path d="M380,125 H440" stroke="#416477" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M770,125 H820" stroke="#416477" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M205,180 V237" stroke="#416477" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M380,290 H440" stroke="#416477" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M770,290 H820" stroke="#416477" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="30" y="399" font-size="18" fill="#183440">Risk to inspect in close-up: intersecting body/tail ellipsoids can accumulate tint.</text><text x="30" y="435" font-size="16" fill="#183440">Keep intended shell depth; remove accidental duplicate overlap. Do not make every part double-sided.</text><text x="30" y="477" font-size="17" fill="#183440">First validate 1 Jelly + 1 Dream; then the mixed 24-shrimp colony and device frame cost.</text></g></svg>