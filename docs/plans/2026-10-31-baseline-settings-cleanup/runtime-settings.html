<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mockup — Runtime settings owner</title><style>
:root{--bg:#0f161c;--panel:#172028;--line:#2b3943;--fg:#e6edf0;--muted:#8fa1ab;--acc:#66bb6a;--warn:#efce83;--blue:#42a5f5;--ui:#172028;--uifg:#e8eef0;--uirail:#10181e;--uiacc:#efce83;--uidim:#6f808a}
@media (prefers-color-scheme:light){:root{--bg:#eef2f4;--panel:#fff;--line:#cdd8de;--fg:#1c2a33;--muted:#5b6d78;--acc:#2e7d32;--warn:#8a6d00;--blue:#1565c0}}
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.45 ui-sans-serif,system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:17px}header .tag{margin-left:auto;font:600 11px ui-monospace,monospace;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:2px 9px}
.frame{background:var(--ui);color:var(--uifg);border:3px solid #3a4852;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px #0006}
.cap{color:var(--muted);font-size:14px;margin:8px 4px}.cap b{color:var(--fg)}
.lock{display:inline-block;width:11px;height:9px;border:2px solid currentColor;border-radius:2px;position:relative;margin-left:8px;top:1px}.lock:before{content:"";position:absolute;left:0;top:-7px;width:7px;height:6px;border:2px solid currentColor;border-bottom:0;border-radius:5px 5px 0 0}

.frame{width:1280px;height:690px;display:grid;grid-template-columns:300px 1fr;margin:14px auto 0}#rail{background:var(--uirail);padding:18px 0;border-right:2px solid #26343e}
.rs{display:flex;justify-content:space-between;padding:14px 22px;font-size:21px;cursor:pointer;color:var(--uidim)}.rs.on{background:#243541;color:var(--uifg);border-left:5px solid var(--uiacc);padding-left:17px}.rs small{font-size:15px;opacity:.8;align-self:center}
#body{padding:14px 30px 10px;overflow:hidden;height:100%}.bt{font-size:26px;margin-bottom:6px}.gh{margin:12px 0 4px;font-size:15px;letter-spacing:.07em;text-transform:uppercase;color:var(--uidim)}
.fr{display:flex;align-items:center;min-height:50px;border-bottom:1px solid #22303a;padding:3px 6px}.fr:first-of-type{}.lb{flex:0 0 380px;font-size:20px}.hp{font-size:13px;color:var(--uidim)}.cv{display:flex;align-items:center;gap:12px;font-size:19px}
.fr.ro{color:var(--uidim)}.fr.ro .lb{color:var(--uidim)}.fr.gap{min-height:18px;border:0}
.box{background:#0f171d;border:2px solid #3a4852;border-radius:6px;padding:3px 14px;min-width:90px}.box.wide{min-width:340px}.box.tall{min-height:60px}.dd em{float:right;font-style:normal;margin-left:18px;color:var(--uiacc)}
.sw{width:30px;height:30px;border-radius:5px;border:2px solid #cfd8dc}.trk{position:relative;width:300px;height:6px;background:#3a4852;border-radius:3px}.trk i{position:absolute;left:0;top:0;height:6px;background:var(--uiacc);border-radius:3px}.trk b{position:absolute;top:-9px;width:14px;height:24px;margin-left:-7px;background:var(--uiacc);border-radius:3px}
.rad,.stops,.seg{display:flex;gap:10px;flex-wrap:wrap;max-width:700px}.rad span{display:flex;align-items:center;gap:7px}.rad u{width:16px;height:16px;border-radius:50%;border:2px solid #8fa1ab}.rad .on u{background:var(--uiacc);border-color:var(--uiacc)}
.stops{gap:0;border-top:3px solid #3a4852}.stops span{padding:6px 16px;font-size:16px;color:var(--uidim)}.stops .on{color:var(--uiacc);border-top:3px solid var(--uiacc);margin-top:-3px}
.seg{gap:0}.seg span{padding:4px 18px;border:2px solid #3a4852;font-size:17px;color:var(--uidim)}.seg span:first-child{border-radius:6px 0 0 6px}.seg span:last-child{border-radius:0 6px 6px 0}.seg .on{background:var(--uiacc);color:#1b2127;border-color:var(--uiacc)}
.chk{width:26px;height:26px;border:2px solid #8fa1ab;border-radius:5px;text-align:center;line-height:22px;color:#1b2127}.chk.on{background:var(--uiacc);border-color:var(--uiacc)}.swt{width:52px;height:26px;border-radius:13px;background:#3a4852;position:relative}.swt i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfd8dc}.swt.on{background:var(--uiacc)}.swt.on i{left:29px;background:#1b2127}
.btn{border:2px solid var(--uiacc);color:var(--uiacc);border-radius:7px;padding:5px 22px}.sv{color:var(--uidim);font-size:17px}.v.dim{color:var(--uidim)}
.foot{display:flex;gap:14px;justify-content:flex-end;width:1280px;margin:10px auto 0}.foot span{border:2px solid #3a4852;border-radius:8px;padding:6px 26px;background:var(--ui);font-size:19px}
</style></head><body>
<header><h1>Runtime settings owner</h1><span class="tag">MOCKUP · SAME ROWS AS TODAY, ONE OWNER</span></header>
<div class="frame"><div id="rail"></div><div id="body"></div></div>
<div class="foot"><span>Cancel</span><span>Apply</span></div>
<div class="cap" style="width:1280px;margin:8px auto"><b>Runtime settings.</b> The three sheets that today repeat in every owner: <b>Runtime Options</b> (79 rows in 8 groups), <b>Level Memory</b> (4) and <b>Level Behavior</b> (2). Nothing else.</div>
<script>
const $=s=>document.querySelector(s);
function ctl(r){const k=r.k,v=r.v;
 if(r.ro)return `<span class="v dim">${v}</span>`;
 switch(k){
  case 'num':return `<span class="box">${v}</span>`;
  case 'slider':{const p=r.p;return `<span class="trk"><i style="width:${p}%"></i><b style="left:${p}%"></b></span><span class="sv">${v}</span>`}
  case 'color':return `<span class="sw" style="background:${r.c}"></span><span class="box">${v}</span>`;
  case 'radio':return `<span class="rad">${r.o.map((o,i)=>`<span class="${i==r.s?'on':''}"><u></u>${o}</span>`).join('')}</span>`;
  case 'stops':return `<span class="stops">${r.o.map((o,i)=>`<span class="${i==r.s?'on':''}">${o}</span>`).join('')}</span>`;
  case 'toggle':return `<span class="seg">${r.o.map((o,i)=>`<span class="${i==r.s?'on':''}">${o}</span>`).join('')}</span>`;
  case 'drop':return `<span class="box dd">${v}<em>▾</em></span>`;
  case 'combo':return `<span class="box dd">${v}<em>⌄</em></span>`;
  case 'check':return `<span class="chk ${r.on?'on':''}">${r.on?'✓':''}</span><span class="sv">${v}</span>`;
  case 'sw':return `<span class="swt ${r.on?'on':''}"><i></i></span><span class="sv">${v}</span>`;
  case 'text':return `<span class="box wide">${v}</span>`;
  case 'multi':return `<span class="box wide tall">${v}</span>`;
  case 'btn':return `<span class="btn">${v}</span>`;
  case 'gap':return ``;
 }}
function draw(secs,state){const rail=$('#rail'),body=$('#body');rail.innerHTML=secs.map((s,i)=>`<div class="rs ${i==state.i?'on':''}" data-i="${i}">${s.name}<small>${s.n}</small></div>`).join('');
 const s=secs[state.i];body.innerHTML=`<div class="bt">${s.name}</div>`+s.groups.map(g=>`${g.name?`<div class="gh">${g.name}</div>`:''}`+g.rows.map(r=>`<div class="fr ${r.ro?'ro':''} ${r.k=='gap'?'gap':''}"><div class="lb">${r.l}${r.ro?'<span class="lock"></span>':''}${r.help?`<div class="hp">${r.help}</div>`:''}</div><div class="cv">${ctl(r)}</div></div>`).join('')).join('');
 rail.querySelectorAll('.rs').forEach(e=>e.onclick=()=>{state.i=+e.dataset.i;draw(secs,state)})}
 const SECS=[{"name": "Runtime Options", "n": 79, "groups": [{"name": "Timing and profiling", "rows": [{"l": "Show FPS", "k": "text", "v": "On", "ro": true}, {"l": "Fixed simulation clock", "k": "text", "v": "Off", "ro": true}, {"l": "Simulation rate (Hz)", "k": "text", "v": "20", "ro": true}, {"l": "Frame profiling", "k": "text", "v": "Off", "ro": true}, {"l": "Script profiling", "k": "text", "v": "Off", "ro": true}]}, {"name": "Renderer", "rows": [{"l": "Static meshes", "k": "text", "v": "\u2014", "ro": true}, {"l": "Static mesh culling", "k": "text", "v": "\u2014", "ro": true}, {"l": "Shared static indices", "k": "text", "v": "\u2014", "ro": true}, {"l": "Static bake budget", "k": "text", "v": "\u2014", "ro": true}]}, {"name": "Surface", "rows": [{"l": "Surface width", "k": "text", "v": "\u2014", "ro": true}, {"l": "Surface height", "k": "text", "v": "\u2014", "ro": true}, {"l": "Window X position", "k": "text", "v": "\u2014", "ro": true}, {"l": "Window Y position", "k": "text", "v": "\u2014", "ro": true}, {"l": "Fullscreen request", "k": "text", "v": "\u2014", "ro": true}, {"l": "Windowed request", "k": "text", "v": "\u2014", "ro": true}]}, {"name": "Allocation", "rows": [{"l": "VRAM width", "k": "text", "v": "\u2014", "ro": true}, {"l": "VRAM height", "k": "text", "v": "\u2014", "ro": true}, {"l": "Transient texture width", "k": "text", "v": "\u2014", "ro": true}, {"l": "Transient texture height", "k": "text", "v": "\u2014", "ro": true}, {"l": "Permanent texture width", "k": "text", "v": "\u2014", "ro": true}, {"l": "Permanent texture height", "k": "text", "v": "\u2014", "ro": true}, {"l": "HAL arena bytes", "k": "text", "v": "\u2014", "ro": true}, {"l": "Scratch arena bytes", "k": "text", "v": "\u2014", "ro": true}, {"l": "PSX memory preset", "k": "text", "v": "\u2014", "ro": true}]}, {"name": "Connection", "rows": [{"l": "Debug listener port", "k": "text", "v": "\u2014", "ro": true}, {"l": "Debug listener address", "k": "text", "v": "\u2014", "ro": true}]}, {"name": "Launch and diagnostics", "rows": [{"l": "Standalone level", "k": "text", "v": "\u2014", "ro": true}, {"l": "CD launch level", "k": "text", "v": "\u2014", "ro": true}, {"l": "Editor execution mode", "k": "text", "v": "\u2014", "ro": true}, {"l": "Smoke-test frames", "k": "text", "v": "\u2014", "ro": true}, {"l": "Smoke-test cycles", "k": "text", "v": "\u2014", "ro": true}, {"l": "Smoke-test no swap", "k": "text", "v": "\u2014", "ro": true}, {"l": "Frame-rate probes", "k": "text", "v": "\u2014", "ro": true}, {"l": "Scheduled frame capture", "k": "text", "v": "\u2014", "ro": true}, {"l": "Startup menu input", "k": "text", "v": "\u2014", "ro": true}, {"l": "Memory test", "k": "text", "v": "\u2014", "ro": true}, {"l": "Mutation smoke test", "k": "text", "v": "\u2014", "ro": true}, {"l": "Mutation thread death test", "k": "text", "v": "\u2014", "ro": true}, {"l": "Print actors at load", "k": "text", "v": "\u2014", "ro": true}, {"l": "Video recording", "k": "text", "v": "\u2014", "ro": true}, {"l": "Joystick playback", "k": "text", "v": "\u2014", "ro": true}, {"l": "Debugger break time", "k": "text", "v": "\u2014", "ro": true}, {"l": "Help and exit", "k": "text", "v": "\u2014", "ro": true}]}, {"name": "Legacy / unavailable", "rows": [{"l": "Legacy load profiler", "k": "text", "v": "\u2014", "ro": true}, {"l": "Legacy loop profiler", "k": "text", "v": "\u2014", "ro": true}, {"l": "Legacy linear allocator", "k": "text", "v": "\u2014", "ro": true}, {"l": "Legacy Z buffer", "k": "text", "v": "\u2014", "ro": true}, {"l": "Legacy Z sort", "k": "text", "v": "\u2014", "ro": true}, {"l": "Legacy frame-rate print", "k": "text", "v": "\u2014", "ro": true}, {"l": "-l N", "k": "text", "v": "\u2014", "ro": true}, {"l": "-nologo", "k": "text", "v": "\u2014", "ro": true}, {"l": "-sound", "k": "text", "v": "\u2014", "ro": true}, {"l": "-cd", "k": "text", "v": "\u2014", "ro": true}, {"l": "-record_tga", "k": "text", "v": "\u2014", "ro": true}, {"l": "-paranoid", "k": "text", "v": "\u2014", "ro": true}]}, {"name": "Debug streams", "rows": [{"l": "pw warnings", "k": "text", "v": "\u2014", "ro": true}, {"l": "pe errors", "k": "text", "v": "\u2014", "ro": true}, {"l": "pf fatal", "k": "text", "v": "\u2014", "ro": true}, {"l": "ps statistics", "k": "text", "v": "\u2014", "ro": true}, {"l": "pp progress", "k": "text", "v": "\u2014", "ro": true}, {"l": "pd debugging", "k": "text", "v": "\u2014", "ro": true}, {"l": "pu user", "k": "text", "v": "\u2014", "ro": true}, {"l": "sa actor system", "k": "text", "v": "\u2014", "ro": true}, {"l": "sf game flow", "k": "text", "v": "\u2014", "ro": true}, {"l": "sl Level system", "k": "text", "v": "\u2014", "ro": true}, {"l": "st tool set code", "k": "text", "v": "\u2014", "ro": true}, {"l": "se camera code", "k": "text", "v": "\u2014", "ro": true}, {"l": "sn Frame Info", "k": "text", "v": "\u2014", "ro": true}, {"l": "la animation/path system", "k": "text", "v": "\u2014", "ro": true}, {"l": "lA Asset ID system", "k": "text", "v": "\u2014", "ro": true}, {"l": "lg graphics system", "k": "text", "v": "\u2014", "ro": true}, {"l": "li iff reader library", "k": "text", "v": "\u2014", "ro": true}, {"l": "lI mailbox system", "k": "text", "v": "\u2014", "ro": true}, {"l": "lm memory system", "k": "text", "v": "\u2014", "ro": true}, {"l": "lM movement handlers", "k": "text", "v": "\u2014", "ro": true}, {"l": "lc collision system", "k": "text", "v": "\u2014", "ro": true}, {"l": "lr room system", "k": "text", "v": "\u2014", "ro": true}, {"l": "lR room slot assets", "k": "text", "v": "\u2014", "ro": true}, {"l": "ls scripting languages", "k": "text", "v": "\u2014", "ro": true}]}]}, {"name": "Level Memory", "n": 4, "groups": [{"name": "Load-time configuration", "rows": [{"l": "Object heap bytes", "k": "text", "v": "400\u202f000", "ro": true}, {"l": "Permanent asset bytes", "k": "text", "v": "2\u202f000\u202f000", "ro": true}, {"l": "Room asset bytes per slot", "k": "text", "v": "4\u202f000\u202f000", "ro": true}, {"l": "Active room asset slots", "k": "text", "v": "3", "ro": true}]}]}, {"name": "Level Behavior", "n": 2, "groups": [{"name": "Load-time configuration", "rows": [{"l": "Doom-style joystick", "k": "text", "v": "On", "ro": true}, {"l": "Bungee camera", "k": "text", "v": "On", "ro": true}]}]}];draw(SECS,{i:0});</script></body></html>
