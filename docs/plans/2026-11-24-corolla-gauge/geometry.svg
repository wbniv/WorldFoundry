<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Corolla gauge: one degree per minute</title><desc id="desc">The hinged petal opens from upright at zero minutes to nearly sixty degrees at fifty-nine minutes; the local hour appears on the specimen pot.</desc><rect width="1080" height="560" rx="20" fill="#101b1d"/><g font-family="sans-serif" fill="#f6f0df"><text x="35" y="48" font-size="27">One degree per minute</text><text x="610" y="48" font-size="27">At the hour</text></g><g transform="translate(260 405)"><path d="M0 0 L0 -300 M0 0 L260 -150" stroke="#b7c3b5" stroke-width="3"/><path d="M0 -252 A252 252 0 0 1 218 -126" fill="none" stroke="#d7ad5a" stroke-width="10"/><path d="M0 0 L35 -247" stroke="#f0e6c9" stroke-width="20" stroke-linecap="round"/><circle r="10" fill="#d7ad5a"/><text x="-22" y="-275" fill="#f6f0df" font-size="21">0</text><text x="45" y="-260" fill="#f6f0df" font-size="21">8</text><text x="225" y="-136" fill="#f6f0df" font-size="21">60</text><text x="-30" y="45" fill="#f6f0df" font-size="20">hinge</text></g><g transform="translate(600 120)" font-family="sans-serif" fill="#f6f0df" font-size="23"><rect x="0" y="0" width="400" height="120" rx="14" fill="#283d34"/><text x="22" y="44">10:08 → pot 10</text><text x="22" y="82">petal angle 8°</text><path d="M190 140 v55" stroke="#d7ad5a" stroke-width="4"/><path d="M180 184 l10 14 10 -14" fill="none" stroke="#d7ad5a" stroke-width="4"/><rect x="0" y="212" width="400" height="130" rx="14" fill="#283d34"/><text x="22" y="252">10:59 → nearly 60°</text><text x="22" y="294">11:00 → pot 11, closed</text></g></svg>
