 <path d="M898 609C956 625 1029 611 1082 582C1134 553 1177 505 1192 465"/><path d="M881 630C956 649 1037 634 1093 605C1153 574 1191 527 1208 478"/>
</g>
<!-- Winding lanes connect neighborhoods and run past the square; no radial spokes. -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M191 405C222 323 276 292 346 302C405 310 414 365 478 367C538 369 550 334 604 341C661 348 677 393 738 396C801 398 831 361 890 373C958 387 963 444 1034 448C1106 453 1154 414 1199 385" stroke="#8b7654" stroke-width="37"/><path d="M191 405C222 323 276 292 346 302C405 310 414 365 478 367C538 369 550 334 604 341C661 348 677 393 738 396C801 398 831 361 890 373C958 387 963 444 1034 448C1106 453 1154 414 1199 385" stroke="#dbc7a1" stroke-width="29"/>
 <path d="M253 306C291 260 339 252 390 258M476 367C440 402 453 454 503 487C551 519 607 493 654 513C707 535 713 589 769 606C823 623 861 594 907 601C970 611 1009 646 1065 632C1121 617 1160 572 1174 523" stroke="#cfbd99" stroke-width="25"/>
 <path d="M738 396C713 427 723 468 757 483C796 500 842 483 870 461M503 487C464 513 411 502 374 531C344 553 337 585 310 605" stroke="#cfbd99" stroke-width="24"/>
</g>
<!-- Stream, mill pond and bridge. -->
<path d="M166 582C228 554 270 576 301 606C342 647 398 633 452 663C478 679 503 686 540 686" fill="none" stroke="#4a9e9e" stroke-width="48"/><path d="M168 582C228 554 270 576 301 606C342 647 398 633 452 663C478 679 503 686 540 686" fill="none" stroke="#b8e5d3" stroke-width="2" stroke-dasharray="24 16"/>
