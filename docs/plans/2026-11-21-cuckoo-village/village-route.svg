<path d="M644 397Q684 385 722 404L763 438Q775 469 742 490Q698 508 654 484Q628 466 632 437Z" fill="#dbc7a4" stroke="#ab9471" stroke-width="3"/>
<g filter="url(#shadow)"><rect x="654" y="330" width="91" height="68" rx="4" fill="#a64d35" stroke="#f1c18e" stroke-width="4"/><path d="M655 364H744M700 332V397" stroke="#e5ab78" stroke-width="3"/></g>
<circle cx="702" cy="451" r="13" fill="#76b5ac" stroke="#f1dfbb" stroke-width="5"/>
<!-- Elevated camera path is a conceptual route, independent of lanes and building fronts. -->
<path d="M212 463C185 397 229 316 315 287C395 261 447 306 501 305C561 304 589 258 660 269C726 280 744 320 807 308C875 294 937 264 1014 309C1092 354 1130 416 1114 482C1101 548 1042 574 982 575C903 574 873 541 815 556C762 569 746 623 678 637C611 650 563 611 502 603C431 594 378 645 320 602C267 565 238 525 212 463Z" fill="none" stroke="#18302b" stroke-width="11" opacity=".8"/>
<path d="M212 463C185 397 229 316 315 287C395 261 447 306 501 305C561 304 589 258 660 269C726 280 744 320 807 308C875 294 937 264 1014 309C1092 354 1130 416 1114 482C1101 548 1042 574 982 575C903 574 873 541 815 556C762 569 746 623 678 637C611 650 563 611 502 603C431 594 378 645 320 602C267 565 238 525 212 463Z" fill="none" stroke="#ffe09a" stroke-width="4" stroke-dasharray="12 9"/>
<path d="M254 326Q287 291 331 285M908 290Q969 281 1018 312M1026 570Q991 579 959 572M502 603Q455 598 415 610" fill="none" stroke="#ffe09a" stroke-width="4" marker-end="url(#arrow)"/>
<!-- Temporary front-facing tower hold, not the camera's constant look direction. -->
<path d="M696 581L650 405 750 405Z" fill="#fff2bb" fill-opacity=".2" stroke="#ffe6a5" stroke-width="2"/><circle cx="696" cy="581" r="8" fill="#ffe09a" stroke="#fff4d6" stroke-width="2"/>
<g font-family="sans-serif" fill="#fff5df"><rect x="65" y="765" width="1270" height="96" rx="12" fill="#15292c" stroke="#44655b"/><path d="M97 795h63" stroke="#ffe09a" stroke-width="4" stroke-dasharray="9 7"/><text x="173" y="802" font-size="19">Elevated camera journey</text><path d="M475 781l16 26h-32z" fill="#ffe6a5" opacity=".7"/><text x="505" y="802" font-size="19">Tower performance view</text><path d="M845 796q20-12 40 0t40 0" fill="none" stroke="#c6d39a" stroke-width="3"/><text x="938" y="802" font-size="19">Rolling hill contours</text><text x="97" y="836" font-size="16" fill="#aabfb4">Houses and lanes follow the terrain · camera looks across the village, with a tower hold at performances</text></g>
<g font-family="sans-serif" font-size="16" font-weight="700" fill="#fff8e7" style="paint-order:stroke;stroke:#294536;stroke-width:4px;stroke-linejoin:round"><text x="658" y="325">TOWER</text><text x="664" y="481">SQUARE</text><text x="250" y="663">BRIDGE</text><text x="831" y="651">GARDEN</text><text x="283" y="159">HILLSIDE</text></g>
</svg>
