<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Cuckoo Village layout and camera route</title><desc id="desc">Top-down concept with a central clock tower and square, houses, gardens, bridge, stream, a looping elevated camera route and a front-facing tower performance view.</desc>
<defs>
 <radialGradient id="ground"><stop stop-color="#314d40"/><stop offset="1" stop-color="#162d28"/></radialGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff0be"/><stop offset="1" stop-color="#b37632"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".35"/></filter>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#f8c779"/></marker>
 <g id="house" filter="url(#shadow)"><rect x="-48" y="-32" width="96" height="64" rx="5" fill="#e5cda4" stroke="#85563b" stroke-width="4"/><path d="M-55 -30 L0 -58 L55 -30 L48 -23 L0 -45 L-48 -23Z" fill="#a45037" stroke="#e6a86f" stroke-width="3"/><path d="M-27 -6h17v18h-17zm37 0h17v18H10z" fill="#f9d384" stroke="#805035" stroke-width="3"/><path d="M-28 2h19M18 -7v19" stroke="#95643e" stroke-width="2"/></g>
 <g id="tree"><circle r="27" fill="#294f3c" stroke="#78906b" stroke-width="3"/><circle cx="-8" cy="-8" r="11" fill="#4e7852" opacity=".8"/><circle cx="9" cy="9" r="9" fill="#1e3f33"/></g>
</defs>
<rect width="1400" height="900" rx="24" fill="#101e22"/>
<text x="62" y="73" fill="#f5ead0" font-family="sans-serif" font-size="36" font-weight="700">CUCKOO VILLAGE</text><text x="62" y="106" fill="#abc3b6" font-family="sans-serif" font-size="20">Concept layout · camera route · not to scale</text>
<ellipse cx="663" cy="469" rx="566" ry="348" fill="#704c30" stroke="#d7aa70" stroke-width="7" filter="url(#shadow)"/><ellipse cx="663" cy="450" rx="548" ry="325" fill="url(#ground)" stroke="#8b9a6c" stroke-width="4"/>
