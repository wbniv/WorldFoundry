<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Cuckoo Village: hillside layout and camera journey</title>
<desc id="desc">A proposed top-down tabletop village with rolling contours, houses in irregular clusters at varied angles, winding lanes, a stream and bridge, gardens, an off-center tower square, and a dashed elevated camera journey. A wedge shows the tower performance view.</desc>
<defs>
 <radialGradient id="grass"><stop stop-color="#759459"/><stop offset="1" stop-color="#345a42"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="1" dy="4" stdDeviation="4" flood-opacity=".4"/></filter>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#ffe09a"/></marker>
 <!-- Roof footprints, with ridge lines rather than frontal elevations. -->
 <g id="house" filter="url(#shadow)"><rect x="-44" y="-30" width="88" height="60" rx="3" fill="#a84e37" stroke="#f1ba83" stroke-width="3"/><path d="M-38 0H38" stroke="#f1c396" stroke-width="3"/><path d="M-18-27V-3M12 3V27" stroke="#c87355" stroke-width="2"/><rect x="20" y="-25" width="10" height="12" fill="#e8d5ae"/></g>
 <g id="house2" filter="url(#shadow)"><rect x="-40" y="-28" width="80" height="56" rx="3" fill="#68685b" stroke="#d8c39e" stroke-width="3"/><path d="M0-25V25" stroke="#cbbda6" stroke-width="3"/><rect x="-29" y="-20" width="10" height="11" fill="#e5d4b0"/></g>
 <g id="tree"><circle r="21" fill="#29553c" stroke="#a8ba7d" stroke-width="2"/><circle cx="-6" cy="-6" r="9" fill="#729b58"/><circle cx="8" cy="7" r="8" fill="#214b35"/></g>
 <g id="pine"><circle r="19" fill="#244b38" stroke="#8ca66e" stroke-width="2"/><path d="M0-17L5-5 15 0 5 5 0 17-5 5-15 0-5-5Z" fill="#668d52"/></g>
</defs>
<rect width="1400" height="900" rx="24" fill="#101e22"/>
<g font-family="sans-serif"><text x="62" y="65" fill="#f5ead0" font-size="34" font-weight="700">CUCKOO VILLAGE</text><text x="62" y="97" fill="#abc3b6" font-size="19">Hillside concept · camera journey · not to scale</text></g>
<!-- Irregular wooden model base and rolling terrain. -->
<path d="M127 386C132 268 254 175 409 165C520 126 633 165 726 152C853 125 1020 151 1110 218C1211 273 1267 353 1247 441C1274 548 1195 653 1072 690C961 743 839 716 742 734C614 757 521 724 425 735C304 733 190 682 153 615C103 550 92 463 127 386Z" fill="#72482e" stroke="#d5aa72" stroke-width="7" filter="url(#shadow)"/>
<path d="M132 371C143 259 264 162 411 153C535 117 631 152 724 139C859 113 1023 142 1113 206C1219 264 1261 348 1239 435C1255 536 1188 631 1067 674C952 720 848 700 739 719C620 738 520 711 426 719C300 718 195 666 160 601C109 534 102 456 132 371Z" fill="url(#grass)" stroke="#a5b77d" stroke-width="3"/>
<!-- Uneven contour bands indicate relief, not enclosing walls. -->
<g fill="none" stroke="#c6d39a" stroke-width="3" opacity=".43">
 <path d="M175 342C190 254 275 189 388 183C457 164 508 177 552 203"/><path d="M170 366C191 271 287 208 385 208C447 192 492 204 520 218"/>
 <path d="M690 178C786 150 867 161 935 185C1016 201 1087 228 1124 270"/><path d="M716 198C790 177 862 187 923 208C986 217 1040 239 1076 270"/>
