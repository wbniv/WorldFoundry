<!-- Neighborhoods follow the lanes and terrain; each roof has its own orientation. -->
<use href="#house2" transform="translate(254 244) rotate(-22) scale(.88)"/><use href="#house" transform="translate(393 215) rotate(13) scale(.9)"/><use href="#house2" transform="translate(514 256) rotate(-13) scale(.85)"/>
<use href="#house" transform="translate(647 230) rotate(17) scale(.95)"/><use href="#house2" transform="translate(874 235) rotate(-18) scale(1.05)"/><use href="#house" transform="translate(1048 295) rotate(24) scale(.95)"/>
<use href="#house" transform="translate(267 380) rotate(14) scale(.95)"/><use href="#house2" transform="translate(372 408) rotate(-20) scale(.9)"/><use href="#house" transform="translate(530 426) rotate(28) scale(.8)"/>
<use href="#house2" transform="translate(950 329) rotate(12) scale(.78)"/><use href="#house" transform="translate(1100 510) rotate(-17) scale(.95)"/><use href="#house2" transform="translate(946 529) rotate(20) scale(1.05)"/><use href="#house" transform="translate(408 559) rotate(-12) scale(.85)"/>
<!-- Trees, orchards, garden. -->
<g><use href="#pine" x="185" y="305"/><use href="#pine" x="321" y="194"/><use href="#tree" x="465" y="190"/><use href="#tree" x="565" y="310"/><use href="#pine" x="767" y="208"/><use href="#pine" x="997" y="215"/><use href="#tree" x="1133" y="320"/><use href="#pine" x="1192" y="467"/><use href="#tree" x="1024" y="573"/><use href="#tree" x="563" y="559"/><use href="#pine" x="229" y="486"/><use href="#tree" x="205" y="533"/><use href="#tree" x="470" y="630"/><use href="#pine" x="1123" y="581"/></g>
<path d="M807 569Q846 547 890 564L916 616Q868 641 817 622Z" fill="#809e5c" stroke="#d8c397" stroke-width="4"/><path d="M829 571l13 49m6-54l14 52m6-48l13 43m7-38l11 32" stroke="#c7d795" stroke-width="4"/>
