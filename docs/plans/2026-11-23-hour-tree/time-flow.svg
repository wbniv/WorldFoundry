<rect width="1000" height="340" rx="18" fill="#f3f7ef"/>
<g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#1b3625">
<rect x="25" y="127" width="180" height="68" rx="12" fill="#c8dfc7"/><text x="115" y="168">Local wall time</text>
<g fill="#fff" stroke="#9ab7a0"><rect x="300" y="18" width="310" height="58" rx="10"/><rect x="300" y="100" width="310" height="58" rx="10"/><rect x="300" y="182" width="310" height="58" rx="10"/><rect x="300" y="264" width="310" height="58" rx="10"/></g>
