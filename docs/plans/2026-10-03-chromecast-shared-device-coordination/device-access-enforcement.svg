<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#367b82"/></marker></defs><rect width="1040" height="580" rx="12" fill="#eff5f7"/><text x="24" y="34" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#183642" text-anchor="start">Access enforcement: two paths, one allowed route</text><text x="24" y="61" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Proposed boundary · a missed instruction must not grant direct device access.</text><rect x="24" y="104" width="285" height="134" rx="8" fill="#d9e6ed"/><text x="40" y="133" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Task / agent tool call</text><text x="40" y="159" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Shell / Python / API / scripts</text><text x="40" y="182" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Agent may miss AGENTS.md</text><text x="40" y="205" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Service request or direct client</text><rect x="400" y="104" width="268" height="134" rx="8" fill="#f4e6c8"/><text x="416" y="133" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Runtime hooks / policies</text><text x="416" y="159" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Allow scoped coordinator calls</text><text x="416" y="182" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Deny known direct ADB routes</text><text x="416" y="205" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Do not wait inside a hook</text><path d="M310 169 L398 169" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="104" width="256" height="134" rx="8" fill="#197c79"/><text x="776" y="133" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">Coordinator API</text><text x="776" y="159" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Authenticate + validate job</text><text x="776" y="182" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">FIFO queue / active generation</text><text x="776" y="205" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Reviewed device adapter</text><path d="M670 169 L758 169" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="316" width="256" height="134" rx="8" fill="#4265a5"/><text x="776" y="345" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">Protected device access</text><text x="776" y="371" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Service identity + private ADB</text><text x="776" y="394" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Credentials / network boundary</text><text x="776" y="417" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Then Chromecast</text><path d="M888 239 L888 314" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="699" y="280" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Owned command only</text><rect x="24" y="316" width="390" height="134" rx="8" fill="#f4e6c8"/><text x="40" y="345" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Attempted bypass</text><text x="40" y="371" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Alternate adb / indirect subprocess / raw TCP</text><text x="40" y="394" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Hooks may not recognize every route</text><text x="40" y="417" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">OS / sandbox policy blocks device access</text><path d="M141 239 L141 314" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M416 386H734" stroke="#a04440" stroke-width="2" stroke-dasharray="6 4"/><path d="M726 374L746 396M746 374L726 396" stroke="#a04440" stroke-width="4"/><text x="446" y="371" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#a04440" text-anchor="start">DENIED outside service identity</text><text x="24" y="507" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#183642" text-anchor="start">Verify sandboxed and escalated paths. Protect the private ADB server and service files too.</text><text x="24" y="539" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#183642" text-anchor="start">Broken hooks cannot enable a bypass; an unavailable service never falls back to raw ADB.</text></svg>