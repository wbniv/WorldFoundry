<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="595" viewBox="0 0 1040 595"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#367b82"/></marker></defs><rect width="1040" height="595" rx="12" fill="#eff5f7"/><text x="24" y="34" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#183642" text-anchor="start">Job lifecycle and crash recovery</text><text x="24" y="61" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Proposed state flow · timeout or old heartbeat never transfers ownership.</text><rect x="24" y="103" width="172" height="70" rx="8" fill="#d9e6ed"/><text x="40" y="132" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Queued</text><text x="40" y="158" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">No device access</text><rect x="251" y="103" width="172" height="70" rx="8" fill="#d9e6ed"/><text x="267" y="132" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Starting</text><text x="267" y="158" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Grant generation</text><rect x="478" y="103" width="172" height="70" rx="8" fill="#197c79"/><text x="494" y="132" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">Running</text><text x="494" y="158" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Owned commands</text><rect x="705" y="103" width="172" height="70" rx="8" fill="#4265a5"/><text x="721" y="132" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">Cleaning</text><text x="721" y="158" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Drain + restore</text><path d="M196 138 L249 138" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M423 138 L476 138" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M650 138 L703 138" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="705" y="236" width="285" height="90" rx="8" fill="#d9e6ed"/><text x="721" y="265" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Terminal result</text><text x="721" y="291" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Completed / failed / cancelled</text><text x="721" y="314" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Only after safe cleanup</text><path d="M791 174 L791 234" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="278" width="260" height="140" rx="8" fill="#f4e6c8"/><text x="40" y="307" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Recovery gate</text><text x="40" y="333" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Coordinator / worker lost</text><text x="40" y="356" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Fence old-generation requests</text><text x="40" y="379" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Reconcile journal + processes</text><text x="40" y="402" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Retain device exclusion</text><path d="M565 174 L565 247 L154 247 L154 276" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="277" y="234" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Unexpected interruption</text><rect x="382" y="319" width="264" height="99" rx="8" fill="#197c79"/><text x="398" y="348" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">Reconcile and drain</text><text x="398" y="374" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Prove old commands have ended</text><text x="398" y="397" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Check device-side operations</text><path d="M285 367 L380 367" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="751" y="369" width="264" height="106" rx="8" fill="#4265a5"/><text x="767" y="398" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">Safe handoff</text><text x="767" y="424" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Finalize interrupted receipt</text><text x="767" y="447" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Then grant next FIFO job</text><text x="767" y="470" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Or stay blocked if uncertain</text><path d="M648 369 L696 369 L696 422 L749 422" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M849 328 L849 367" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="502" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#183642" text-anchor="start">A free host lock alone is insufficient if a recording or other device-side operation survives.</text><text x="24" y="540" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#183642" text-anchor="start">Cancel a waiter: remove it. Cancel an owner: stop/drain, clean up, then hand off.</text><text x="24" y="570" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#183642" text-anchor="start">Never unlink a busy lock or kill unrelated ADB servers to force a grant.</text></svg>