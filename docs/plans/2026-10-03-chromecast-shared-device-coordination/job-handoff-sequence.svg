<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="670" viewBox="0 0 1040 670"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#367b82"/></marker></defs><rect width="1040" height="670" rx="12" fill="#eff5f7"/><text x="24" y="34" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#183642" text-anchor="start">Job submission and handoff</text><text x="24" y="61" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Proposed sequence · every device command belongs to one complete owned job.</text><rect x="35" y="85" width="210" height="52" rx="8" fill="#d9e6ed"/><text x="51" y="114" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Agent A</text><path d="M140 138L140 600" stroke="#a7bcc7" stroke-dasharray="5 5"/><rect x="285" y="85" width="210" height="52" rx="8" fill="#197c79"/><text x="301" y="114" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">Coordinator</text><path d="M390 138L390 600" stroke="#a7bcc7" stroke-dasharray="5 5"/><rect x="535" y="85" width="210" height="52" rx="8" fill="#4265a5"/><text x="551" y="114" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">Device worker</text><path d="M640 138L640 600" stroke="#a7bcc7" stroke-dasharray="5 5"/><rect x="785" y="85" width="210" height="52" rx="8" fill="#d9e6ed"/><text x="801" y="114" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Agent B</text><path d="M890 138L890 600" stroke="#a7bcc7" stroke-dasharray="5 5"/><path d="M140 175 L390 175" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="165" y="164" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Submit frozen test</text><path d="M390 223 L640 223" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="402" y="211" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Grant lease + generation</text><path d="M890 270 L390 270" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="523" y="258" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Submit second job → FIFO queue</text><path d="M390 315 L890 315" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="481" y="303" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Queued: owner A; phase / messages</text><rect x="525" y="350" width="230" height="94" rx="8" fill="#4265a5"/><text x="541" y="379" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">Owned device work</text><text x="541" y="405" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Install → warmup → capture</text><text x="541" y="428" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Then cleanup / restoration</text><path d="M640 474 L390 474" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="418" y="462" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Result + cleanup finished</text><path d="M390 515 L140 515" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="167" y="503" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Receipt; job complete</text><path d="M390 559 L640 559" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="410" y="547" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Now grant next queued job</text><path d="M390 596 L890 596" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="538" y="584" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Agent B: your job started</text><text x="24" y="642" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#183642" text-anchor="start">Client polling, agent pauses and messages never release an active worker session.</text></svg>