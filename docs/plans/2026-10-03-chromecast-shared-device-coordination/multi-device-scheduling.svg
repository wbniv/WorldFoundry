<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="535" viewBox="0 0 1040 535"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#367b82"/></marker></defs><rect width="1040" height="535" rx="12" fill="#eff5f7"/><text x="24" y="34" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#183642" text-anchor="start">Multiple Chromecasts: parallel jobs, exclusive access per device</text><text x="24" y="61" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Proposed registry and scheduler · an occupied Chromecast does not stop work on another.</text><rect x="24" y="111" width="244" height="145" rx="8" fill="#d9e6ed"/><text x="40" y="140" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Task / agent requests</text><text x="40" y="166" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Fixed device: test-01</text><text x="40" y="189" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Pool: compatible Chromecast</text><text x="40" y="212" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Frozen inputs + capabilities</text><rect x="376" y="111" width="281" height="145" rx="8" fill="#197c79"/><text x="392" y="140" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">One coordinator service</text><text x="392" y="166" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Atomic compatible assignment</text><text x="392" y="189" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">FIFO among eligible requests</text><text x="392" y="212" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">No global device-test mutex</text><path d="M270 177 L374 177" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="775" y="90" width="241" height="120" rx="8" fill="#4265a5"/><text x="791" y="119" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">chromecast-test-01</text><text x="791" y="145" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Owner: Jellyfish capture</text><text x="791" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Condo request waits for 01</text><rect x="775" y="248" width="241" height="120" rx="8" fill="#197c79"/><text x="791" y="277" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">chromecast-test-02</text><text x="791" y="303" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Owner: Planted-tank profile</text><text x="791" y="326" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Runs concurrently with 01</text><path d="M658 160 L723 160 L723 149 L773 149" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M658 213 L723 213 L723 309 L773 309" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="346" width="244" height="110" rx="8" fill="#d9e6ed"/><text x="40" y="375" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Per-device identity</text><text x="40" y="401" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Model / ABI / OS / pool tags</text><text x="40" y="424" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Endpoint aliases → one ID</text><rect x="376" y="346" width="281" height="110" rx="8" fill="#d9e6ed"/><text x="392" y="375" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Per-device ownership</text><text x="392" y="401" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Lease + generation + lock</text><text x="392" y="424" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Health / recovery / evidence</text><text x="24" y="494" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Fixed-device and pool jobs arbitrate together; incompatible or offline hardware is not silently selected.</text><text x="24" y="520" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#183642" text-anchor="start">A lease for 01 cannot control 02. Recovery of 01 does not cancel a valid job on 02.</text></svg>