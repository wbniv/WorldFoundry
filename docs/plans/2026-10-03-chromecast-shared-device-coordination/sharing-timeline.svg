<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360"><rect width="1040" height="360" rx="12" fill="#eff5f7"/><g font-family="system-ui,sans-serif" fill="#183642"><text x="28" y="36" font-size="18" font-weight="700">One physical Chromecast · service grants one owned test session</text><text x="28" y="60" font-size="13">Illustrative timeline: builds overlap; device work is exclusive.</text><text x="28" y="114" font-size="16">Agent A</text><text x="28" y="192" font-size="16">Agent B</text><text x="28" y="270" font-size="16">Chromecast</text></g><g font-family="system-ui,sans-serif" font-size="14"><rect x="155" y="86" width="160" height="44" rx="6" fill="#d9e6ed"/><text x="178" y="113" fill="#183642">Build + validate</text><rect x="325" y="86" width="300" height="44" rx="6" fill="#197c79"/><text x="348" y="113" fill="white">Acquire → test → cleanup → release</text><rect x="155" y="164" width="205" height="44" rx="6" fill="#d9e6ed"/><text x="185" y="191" fill="#183642">Build + validate</text><rect x="370" y="164" width="255" height="44" rx="6" fill="#f4e6c8"/><text x="392" y="191" fill="#705323">Wait; continue independent work</text><rect x="645" y="164" width="360" height="44" rx="6" fill="#4265a5"/><text x="676" y="191" fill="white">Acquire → test → cleanup → release</text><rect x="155" y="242" width="160" height="44" rx="6" fill="#d9e6ed"/><text x="208" y="269" fill="#183642">Free</text><rect x="325" y="242" width="300" height="44" rx="6" fill="#197c79"/><text x="429" y="269" fill="white">Owned by A</text><rect x="645" y="242" width="360" height="44" rx="6" fill="#4265a5"/><text x="770" y="269" fill="white">Owned by B</text><text x="155" y="324" fill="#183642">Service owns install, warmup, inputs, captures, profiling and restoration. FIFO handoff follows cleanup.</text></g><path d="M635 78V296" stroke="#839aa8" stroke-dasharray="5 5"/><text x="641" y="310" font-family="system-ui,sans-serif" font-size="12" fill="#526b79">Handoff</text></svg>