<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="535" viewBox="0 0 1040 535"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#367b82"/></marker></defs><rect width="1040" height="535" rx="12" fill="#eff5f7"/><text x="24" y="34" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#183642" text-anchor="start">Agent messages and service events</text><text x="24" y="61" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Proposed delivery · coordination messages do not change ownership or priority.</text><rect x="24" y="101" width="250" height="130" rx="8" fill="#d9e6ed"/><text x="40" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Waiting agent</text><text x="40" y="156" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Registered caller/session</text><text x="40" y="179" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Sends task-scoped message</text><text x="40" y="202" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Continues independent work</text><rect x="387" y="101" width="280" height="154" rx="8" fill="#197c79"/><text x="403" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">Service mailbox</text><text x="403" y="156" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Authenticate sender + recipient</text><text x="403" y="179" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Store event ID and job/resource</text><text x="403" y="202" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Cursor + acknowledgement</text><rect x="780" y="101" width="236" height="130" rx="8" fill="#d9e6ed"/><text x="796" y="130" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Current owner</text><text x="796" y="156" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Receives waiting request</text><text x="796" y="179" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Replies with phase / estimate</text><text x="796" y="202" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Keeps lease until cleanup</text><path d="M275 165 L385 165" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="304" y="152" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Send</text><path d="M668 165 L778 165" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="691" y="152" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Deliver</text><path d="M895 232 L895 279 L529 279 L529 256" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="677" y="269" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Reply / ack</text><rect x="24" y="338" width="295" height="115" rx="8" fill="#d9e6ed"/><text x="40" y="367" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Verified notification bridge</text><text x="40" y="393" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Deliver into supported harness</text><text x="40" y="416" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Or expose watch / polling</text><rect x="387" y="338" width="280" height="115" rx="8" fill="#197c79"/><text x="403" y="367" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="start">Events and status</text><text x="403" y="393" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Queued → started → released</text><text x="403" y="416" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="white" text-anchor="start">Durable reconnect cursor</text><rect x="780" y="338" width="236" height="115" rx="8" fill="#d9e6ed"/><text x="796" y="367" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#183642" text-anchor="start">Dashboard / CLI</text><text x="796" y="393" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Owner + FIFO queue</text><text x="796" y="416" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">Messages + recent handoffs</text><path d="M529 280 L529 336" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M386 390 L321 390" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M668 390 L778 390" fill="none" stroke="#367b82" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="493" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#183642" text-anchor="start">At-least-once delivery + event IDs prevent duplicate logical messages after reconnect.</text><text x="24" y="518" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#183642" text-anchor="start">No claim of waking a paused model until the harness integration is demonstrated.</text></svg>