<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130"><style>text{font-family:DejaVu Sans,sans-serif;fill:#203b46}.title{font-size:32px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.tag{font-size:13px;font-weight:700;letter-spacing:1px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247d85"/></marker></defs><rect width="1200" height="1130" fill="#f5f1e8"/><text x="40" y="55" class="title">One action button: OK + directional chords</text><text x="40" y="87" class="small">PROPOSED CONTROLS · direction first, then a new OK press; test on the physical remote</text><rect x="30" y="115" width="555" height="198" rx="12" fill="#e5e9df"/><text x="50" y="147" class="head">Clownfish &amp; Tiger Barbs</text><text x="50" y="190" class="body">D-pad: steer, climb/dive</text><text x="50" y="226" class="body">OK: dart</text><text x="50" y="262" class="small">Up → OK: Side / Depth</text><rect x="615" y="115" width="555" height="198" rx="12" fill="#e5e9df"/><text x="635" y="147" class="head">Blue Shrimp</text><text x="635" y="190" class="body">D-pad: walk, excursion / settle</text><text x="635" y="226" class="body">OK: backward tail flip</text><text x="635" y="262" class="small">Up → OK: Side / Depth</text><rect x="30" y="335" width="555" height="198" rx="12" fill="#e5e9df"/><text x="50" y="367" class="head">Calm Betta</text><text x="50" y="410" class="body">D-pad: steer, pitched climb/dive</text><text x="50" y="446" class="body">OK: small swim burst</text><text x="50" y="482" class="small">Up → OK: Side / Depth</text><rect x="615" y="335" width="555" height="198" rx="12" fill="#e5e9df"/><text x="635" y="367" class="head">Jellyfish</text><text x="635" y="410" class="body">D-pad: tilt; Up active / Down rest</text><text x="635" y="446" class="body">OK: pulse; hold to repeat gently</text><text x="635" y="482" class="small">Up → OK: Side / Depth</text><rect x="30" y="555" width="555" height="198" rx="12" fill="#e5e9df"/><text x="50" y="587" class="head">Lionfish</text><text x="50" y="630" class="body">D-pad: steer, pitched climb/dive</text><text x="50" y="666" class="body">OK: feed request</text><text x="50" y="702" class="small">Up → OK: mode · Down → OK: prey</text><rect x="615" y="555" width="555" height="198" rx="12" fill="#e5e9df"/><text x="635" y="587" class="head">Planted Tank</text><text x="635" y="630" class="body">D-pad: both substrate axes</text><text x="635" y="666" class="body">OK: wide / close view</text><text x="635" y="702" class="small">One crawl plane; no mode chord</text><rect x="30" y="775" width="555" height="198" rx="12" fill="#e5e9df"/><text x="50" y="807" class="head">Asian Arowana</text><text x="50" y="850" class="body">D-pad: heading, gentle pitched swim</text><text x="50" y="886" class="body">OK: brief forward burst + recovery</text><text x="50" y="922" class="small">Up → OK: Side / Depth; neutral to rearm</text><text x="40" y="1025" class="body">Phone: A = OK/Action; B = optional Mode shortcut. Chromecast needs no B or C.</text><text x="40" y="1059" class="small">Chord is latched through chord release; consumes the direction; never also darts, feeds or pulses.</text><text x="40" y="1089" class="small">If the remote cannot report chords: neutral double-tap OK → Controls panel, with no accidental action.</text></svg>