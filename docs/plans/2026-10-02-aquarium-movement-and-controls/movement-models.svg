<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840"><style>text{font-family:DejaVu Sans,sans-serif;fill:#203b46}.title{font-size:32px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.tag{font-size:13px;font-weight:700;letter-spacing:1px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247d85"/></marker></defs><rect width="1200" height="840" fill="#f5f1e8"/><text x="40" y="55" class="title">Direction is intent; locomotion makes the path</text><text x="40" y="87" class="small">DESIGN SCHEMATIC · proposed behavior, not measured physics</text><rect x="30" y="118" width="1140" height="247" rx="12" fill="#e5e9df"/><text x="55" y="157" class="head">Fish: turn, drive, coast and brake</text><text x="55" y="208" class="head">1 · Input</text><text x="55" y="246" class="body">Desired direction</text><text x="55" y="276" class="small">No direct axis velocity</text><path d="M288 216h27" stroke="#247d85" stroke-width="3" marker-end="url(#arrow)"/><text x="335" y="208" class="head">2 · Body</text><text x="335" y="246" class="body">Yaw + pitch + small bank</text><text x="335" y="276" class="small">Full attached-fin transform</text><path d="M568 216h27" stroke="#247d85" stroke-width="3" marker-end="url(#arrow)"/><text x="615" y="208" class="head">3 · Drive</text><text x="615" y="246" class="body">Speed × current facing</text><text x="615" y="276" class="small">Species hover / coast</text><path d="M848 216h27" stroke="#247d85" stroke-width="3" marker-end="url(#arrow)"/><text x="895" y="208" class="head">4 · Pose</text><text x="895" y="246" class="body">Tail, fins and mouth</text><text x="895" y="276" class="small">Respond to actual motion</text><text x="55" y="338" class="body">Clownfish is the reference. Other fish use species tuning; Arowana turns scale with length.</text><rect x="30" y="390" width="1140" height="370" rx="12" fill="#e5e9df"/><text x="55" y="431" class="head">Jellyfish: tilt + timed thrust + retained drift</text><g transform="translate(195 578) scale(.6)"><path d="M-48.604 0Q-44 -95.152 0 -95.152Q44 -95.152 48.604 0Q0 6.199999999999999 -48.604 0" fill="#9ddad9" stroke="#397e8b" stroke-width="3"/><path d="M-24 6Q-45 44-17 69Q10 92-18 121M0 7Q-18 44 9 75Q29 98 3 132M25 4Q4 41 32 70Q51 98 27 123" fill="none" stroke="#75b9c9" stroke-width="6"/></g><text x="85" y="474" class="head">Contract</text><text x="85" y="681" class="body">Bell-axis thrust</text><rect x="85" y="701" width="310" height="12" fill="#7ebdb6"/><g transform="translate(550 578) scale(.6)"><path d="M-54.346000000000004 0Q-44 -83.44800000000001 0 -83.44800000000001Q44 -83.44800000000001 54.346000000000004 0Q0 12.8 -54.346000000000004 0" fill="#9ddad9" stroke="#397e8b" stroke-width="3"/><path d="M-24 6Q-45 44-17 69Q10 92-18 121M0 7Q-18 44 9 75Q29 98 3 132M25 4Q4 41 32 70Q51 98 27 123" fill="none" stroke="#75b9c9" stroke-width="6"/></g><text x="440" y="474" class="head">Recover</text><text x="440" y="681" class="body">Refill; motion continues</text><rect x="440" y="701" width="310" height="12" fill="#acd3c7"/><g transform="translate(905 578) scale(.6)"><path d="M-58.0 0Q-44 -76.0 0 -76.0Q44 -76.0 58.0 0Q0 17 -58.0 0" fill="#9ddad9" stroke="#397e8b" stroke-width="3"/><path d="M-24 6Q-45 44-17 69Q10 92-18 121M0 7Q-18 44 9 75Q29 98 3 132M25 4Q4 41 32 70Q51 98 27 123" fill="none" stroke="#75b9c9" stroke-width="6"/></g><text x="795" y="474" class="head">Open / coast</text><text x="795" y="681" class="body">Current + momentum</text><rect x="795" y="701" width="310" height="12" fill="#d1dccb"/><text x="55" y="742" class="small">Direction and travel can differ during a turn. No fish tail gait; no instant stop on release.</text><text x="40" y="805" class="small">Substrate animals use another model: supported gait/contact, free-swim transitions for shrimp, tiny urchin crawl.</text></svg>