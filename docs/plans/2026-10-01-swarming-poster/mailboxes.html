l="#5c6b7a">1006</text><text x="876" y="689" font-size="12" fill="#1d2733">+1</text><rect x="976" y="658" width="100" height="38" fill="#f3f7fa" stroke="#9fb0bd"/><text x="980" y="673" font-size="12" fill="#5c6b7a">1007</text><text x="980" y="689" font-size="12" fill="#1d2733">+2</text><rect x="1080" y="658" width="100" height="38" fill="#f3f7fa" stroke="#9fb0bd"/><text x="1084" y="673" font-size="12" fill="#5c6b7a">1008</text><text x="1084" y="689" font-size="12" fill="#1d2733">MB_DIST</text><rect x="1184" y="658" width="100" height="38" fill="#f3f7fa" stroke="#9fb0bd"/><text x="1188" y="673" font-size="12" fill="#5c6b7a">1009</text><text x="1188" y="689" font-size="12" fill="#1d2733">MB_R2</text><text x="40" y="722" font-size="13" fill="#1d2733">Why a map: every actor and the Director share one number space, so a new script must say which numbers it owns. 200 mailboxes are needed here; the next free hundreds</text><text x="40" y="737" font-size="13" fill="#1d2733"> are 760..799 (kept spare) and 1010..1099.</text><text x="40" y="766" font-size="13" fill="#1d2733">Cost of using mailboxes: each read or write is one system call into the engine. The 7.5 ms per step on the Chromecast already counts them (as a plain array); in the </text><text x="40" y="781" font-size="13" fill="#1d2733">engine each goes through the object manager, which Phase 0 measures.</text><text x="40" y="810" font-size="13" fill="#1d2733">Open: the ten followers need their own copy of the rig’s 39 mailboxes (600..638 today are one fish’s). That means the rig must take a base address (a change in clown</text><text x="40" y="825" font-size="13" fill="#1d2733">fish_idle.fth), or the followers are posed by a smaller rig.</text></svg><h1 style="position:absolute;left:40px;top:8px;font-size:22px">Where the school’s state lives: the mailboxes</h1></body></html>
