t><rect x="130.0" y="338" width="94.4" height="48" fill="#5c6b7a"/><text x="136.0" y="368" font-size="13" font-weight="700" fill="#fff"></text><rect x="224.4" y="338" width="35.6" height="48" fill="#0f7c93"/><text x="230.4" y="368" font-size="13" font-weight="700" fill="#fff"></text><rect x="523.3" y="338" width="94.4" height="48" fill="#5c6b7a"/><text x="529.3" y="368" font-size="13" font-weight="700" fill="#fff"></text><rect x="617.7" y="338" width="35.6" height="48" fill="#0f7c93"/><text x="623.7" y="368" font-size="13" font-weight="700" fill="#fff"></text><rect x="916.7" y="338" width="94.4" height="48" fill="#5c6b7a"/><text x="922.7" y="368" font-size="13" font-weight="700" fill="#fff"></text><rect x="1011.1" y="338" width="35.6" height="48" fill="#0f7c93"/><text x="1017.1" y="368" font-size="13" font-weight="700" fill="#fff"></text><text x="30" y="432" font-size="14" fill="#1d2733">0.75 ms per follower, so 1.5 ms a frame. Each follower is updated at 12 Hz and its position is blended in between.</text><text x="410.5" y="168" font-size="14" font-weight="700" fill="#b02a2a">+7.5 ms</text><text x="268.0" y="368" font-size="14" font-weight="700" fill="#0f5f73">+1.5 ms</text><text x="661.4" y="368" font-size="14" font-weight="700" fill="#0f5f73">+1.5 ms</text><text x="1054.7" y="368" font-size="14" font-weight="700" fill="#0f5f73">+1.5 ms</text><rect x="30" y="470" width="16" height="12" fill="#5c6b7a"/><text x="52" y="481" font-size="13">the rest of the frame: not measured, its width is only illustrative</text><rect x="560" y="470" width="16" height="12" fill="#b02a2a"/><text x="582" y="481" font-size="13">school.fth, one step</text><rect x="760" y="470" width="16" height="12" fill="#0f7c93"/><text x="782" y="481" font-size="13">school.fth, two followers</text><text x="30" y="570" font-size="16" font-weight="700">What was measured, and what was not</text><text x="30" y="600" font-size="14" fill="#1d2733">Interpreter alone: 7.5 ms for one 11-fish step (median of 3 runs of 200 ticks) on the Chromecast HD, with the engine’s zForth, float cells, mailboxes as a plain array.</text><text x="30" y="626" font-size="14" fill="#1d2733">In the engine (the bench level, the real Chromecast, release build): 39 ms a tick at 20 fps as found; 11.3 ms at 59.9 fps after fixing the mailbox path (the Director also poses the fish and the camera).</text><text x="30" y="652" font-size="14" fill="#1d2733">Size: 3324 bytes of the 65,536-byte dictionary, 210 code lines.</text></svg></body></html>
