<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 475">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#81d5bc"/></marker></defs>
<rect width="1040" height="475" rx="16" fill="#102833"/>
<g font-family="sans-serif" fill="#e9f3ef"><text x="28" y="38" font-size="23" fill="#e9f3ef">Schema layout: order and meaning are shared; placement follows the screen</text><rect x="28" y="74" width="286" height="124" rx="10" fill="#1c404a" stroke="#4e807e"/><text x="43" y="103" font-size="19" fill="#e9f3ef">OAD ordered entries</text><text x="43" y="130" font-size="15" fill="#e9f3ef">Property sheets → sections</text><text x="43" y="154" font-size="15" fill="#e9f3ef">Groups → named field groups</text><text x="43" y="178" font-size="15" fill="#e9f3ef">Types / showAs → widget family</text><rect x="377" y="74" width="286" height="124" rx="10" fill="#1c404a" stroke="#4e807e"/><text x="392" y="103" font-size="19" fill="#e9f3ef">Ordered form tree</text><text x="392" y="130" font-size="15" fill="#e9f3ef">Stable section and field keys</text><text x="392" y="154" font-size="15" fill="#e9f3ef">Exposure + apply policy</text><text x="392" y="178" font-size="15" fill="#e9f3ef">Labels / help / options</text><rect x="726" y="74" width="286" height="124" rx="10" fill="#1c404a" stroke="#4e807e"/><text x="741" y="103" font-size="19" fill="#e9f3ef">Measure and arrange</text><text x="741" y="130" font-size="15" fill="#e9f3ef">TV: label/value rows + rail</text><text x="741" y="154" font-size="15" fill="#e9f3ef">Phone: stacked section rows</text><text x="741" y="178" font-size="15" fill="#e9f3ef">Wrap labels; scroll overflow</text><path d="M314 136H371" fill="none" stroke="#81d5bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M663 136H720" fill="none" stroke="#81d5bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="275" width="440" height="120" rx="10" fill="#1c404a" stroke="#4e807e"/><text x="43" y="304" font-size="19" fill="#e9f3ef">Focus model</text><text x="43" y="331" font-size="15" fill="#e9f3ef">Rail ↔ field list ↔ footer</text><text x="43" y="355" font-size="15" fill="#e9f3ef">Field editor / keypad owns its input</text><text x="43" y="379" font-size="15" fill="#e9f3ef">Auto-scroll focused rows; retain field identity</text><rect x="559" y="275" width="453" height="120" rx="10" fill="#1c404a" stroke="#4e807e"/><text x="574" y="304" font-size="19" fill="#e9f3ef">Many fields / sections</text><text x="574" y="331" font-size="15" fill="#e9f3ef">Keep readable row sizes; virtualize long lists</text><text x="574" y="355" font-size="15" fill="#e9f3ef">Scroll rails and choice lists too</text><text x="574" y="379" font-size="15" fill="#e9f3ef">No plant coordinate table or legacy OAD x/y</text><path d="M869 198V235H780V269" fill="none" stroke="#81d5bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M726 165H701V250H249V269" fill="none" stroke="#81d5bc" stroke-width="2" marker-end="url(#arrow)"/><text x="29" y="443" font-size="17" fill="#e9f3ef">Back: dismiss entry popups first; on form or inline slider → apply/close → game navigation.</text></g></svg>