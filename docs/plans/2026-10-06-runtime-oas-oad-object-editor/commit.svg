<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 510">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#81d5bc"/></marker></defs>
<rect width="1050" height="510" rx="16" fill="#102833"/>
<g font-family="sans-serif" fill="#e9f3ef"><text x="28" y="38" font-size="24" fill="#e9f3ef">Edit this object, then read its committed properties</text><rect x="28" y="73" width="250" height="105" rx="10" fill="#1c404a" stroke="#4e807e"/><text x="43" y="102" font-size="19" fill="#e9f3ef">Generic form</text><text x="43" y="129" font-size="15" fill="#e9f3ef">Snapshot revision → draft</text><text x="43" y="153" font-size="15" fill="#e9f3ef">TV / phone edits same session</text><rect x="347" y="73" width="300" height="105" rx="10" fill="#1c404a" stroke="#4e807e"/><text x="362" y="102" font-size="19" fill="#e9f3ef">Validate / preflight</text><text x="362" y="129" font-size="15" fill="#e9f3ef">Type, bounds, enum, text rules</text><text x="362" y="153" font-size="15" fill="#e9f3ef">All valid → one game-thread commit</text><rect x="718" y="73" width="302" height="105" rx="10" fill="#1c404a" stroke="#4e807e"/><text x="733" y="102" font-size="19" fill="#e9f3ef">Object instance registry</text><text x="733" y="129" font-size="15" fill="#e9f3ef">Original values + own overrides</text><text x="733" y="153" font-size="15" fill="#e9f3ef">Other instances stay unchanged</text><path d="M278 125H341" fill="none" stroke="#81d5bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M647 125H712" fill="none" stroke="#81d5bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="305" width="250" height="105" rx="10" fill="#1c404a" stroke="#4e807e"/><text x="43" y="334" font-size="19" fill="#e9f3ef">C++ consumer</text><text x="43" y="361" font-size="15" fill="#e9f3ef">Typed effective-value getter</text><text x="43" y="385" font-size="15" fill="#e9f3ef">Plant effects: regenerate / rate</text><rect x="347" y="305" width="300" height="105" rx="10" fill="#1c404a" stroke="#4e807e"/><text x="362" y="334" font-size="19" fill="#e9f3ef">Forth consumer</text><text x="362" y="361" font-size="15" fill="#e9f3ef">Generic property@ + generated IDs</text><text x="362" y="385" font-size="15" fill="#e9f3ef">Water type → goby / urchin</text><rect x="718" y="305" width="302" height="105" rx="10" fill="#1c404a" stroke="#4e807e"/><text x="733" y="334" font-size="19" fill="#e9f3ef">Native cached properties</text><text x="733" y="361" font-size="15" fill="#e9f3ef">Explicit live setter or reload policy</text><text x="733" y="385" font-size="15" fill="#e9f3ef">No automatic shared-page patch</text><path d="M868 178V236H153V299" fill="none" stroke="#81d5bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M868 236H497V299" fill="none" stroke="#81d5bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M868 236V299" fill="none" stroke="#81d5bc" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="452" font-size="16" fill="#e9f3ef">Cancel discards drafts. Invalid Apply retains errors. Stale sessions / object generations reject edits.</text><text x="28" y="481" font-size="16" fill="#e9f3ef">Runtime reads see committed values. The schema and packed level remain authoring inputs.</text></g></svg>