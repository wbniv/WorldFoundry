<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
<title id="title">Mirror and Haze: overhead clock geometry and beam heights</title><desc id="desc">Three colored radial beams from a central column meet the gauze at different dial angles; the side view places the amber, green and red beams at three separate heights.</desc>
<rect width="1100" height="530" rx="16" fill="#0c1119"/><g font-family="sans-serif" fill="#e4e9f1"><text x="65" y="48" font-size="26">Overhead: three equal-radius hands</text><text x="630" y="48" font-size="26">Side: three distinct heights</text></g>
<g transform="translate(280 280)"><circle r="190" fill="#141d29" stroke="#8794a3" stroke-width="4"/><circle r="178" fill="none" stroke="#596978" stroke-width="2" stroke-dasharray="5 7"/><g font-family="sans-serif" font-size="20" fill="#c9d4df" text-anchor="middle"><text y="-200">12</text><text x="204" y="7">3</text><text y="220">6</text><text x="-204" y="7">9</text></g><path d="M0 0 L-150 -98" stroke="#ffbf4d" stroke-width="18"/><path d="M0 0 L177 -12" stroke="#54ec87" stroke-width="10"/><path d="M0 0 L-25 176" stroke="#ff5757" stroke-width="4"/><circle r="15" fill="#dce3e8"/></g>
<g transform="translate(620 100)" font-family="sans-serif" font-size="20"><path d="M35 35 L35 325 M400 35 L400 325" stroke="#708191" stroke-width="4" stroke-dasharray="4 6"/><rect x="190" y="20" width="40" height="325" rx="8" fill="#697684"/><path d="M210 90 H400" stroke="#ffbf4d" stroke-width="17"/><path d="M210 190 H35" stroke="#54ec87" stroke-width="10"/><path d="M210 285 H400" stroke="#ff5757" stroke-width="4"/><g fill="#e4e9f1"><text x="245" y="74">hour · amber · wide</text><text x="45" y="172">minute · green</text><text x="245" y="270">second · red · thin</text><text x="80" y="388">gauze wall</text><text x="175" y="425">central column</text></g></g></svg>
