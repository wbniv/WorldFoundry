" font-size="16">Broad leaves / carpet</text><path d="M530 415 Q570 340 630 350 Q700 380 750 410" stroke="#ded0a7" stroke-width="30" fill="none"/><text x="425" y="475" fill="#e4dcc7" font-size="22">Front: low carpet + open crawl / close-camera corridor</text><text x="75" y="550" fill="#c2d6ca" font-size="20">384 plant instances → merged into about 8 static mesh actors</text><text x="75" y="590" fill="#c2d6ca" font-size="20">Keep each chunk within exporter/index limits; split only when the compiled mesh requires it.</text><text x="75" y="630" fill="#c2d6ca" font-size="20">No per-plant scripts, physics hulls or mailbox allocations.</text></svg>