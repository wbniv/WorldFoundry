<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340"><rect width="1100" height="340" rx="20" fill="#eef1e8"/><style>text{font-family:system-ui;fill:#183a32}.title{font-size:24px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}</style><text x="30" y="40" class="title">One texture atlas · leaf-local UVs · the same eight plant groups</text><image href="leaf-surfaces-atlas.png" x="30" y="70" width="210" height="210"/><text x="30" y="308" class="small">256² opaque · 6 forms · 4px gutters</text><path d="M255 173h60m-10-8 10 8-10 8" stroke="#426d50" fill="none" stroke-width="3"/><rect x="330" y="95" width="220" height="150" rx="12" fill="#dce8cf"/><text x="350" y="130" class="label">Each individual blade</text><text x="350" y="164" class="small">U: width across the leaf</text><text x="350" y="190" class="small">V: base to tip</text><text x="350" y="216" class="small">Front + underside tint</text><path d="M565 173h45m-10-8 10 8-10 8" stroke="#426d50" fill="none" stroke-width="3"/><rect x="625" y="95" width="205" height="150" rx="12" fill="#dce8cf"/><text x="645" y="130" class="label">Curved surfaces</text><text x="645" y="165" class="small">Albedo × smooth shading</text><text x="645" y="193" class="small">Root-pinned growth</text><text x="645" y="219" class="small">Same UVs during sway</text><path d="M845 173h30m-10-8 10 8-10 8" stroke="#426d50" fill="none" stroke-width="3"/><rect x="890" y="95" width="175" height="150" rx="12" fill="#dce8cf"/><text x="910" y="130" class="label">Batch and render</text><text x="910" y="166" class="small">8 mesh groups</text><text x="910" y="194" class="small">38 level actors</text><text x="910" y="220" class="small">No extra triangles</text></svg>