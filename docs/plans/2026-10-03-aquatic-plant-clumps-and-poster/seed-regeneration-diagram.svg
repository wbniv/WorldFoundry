<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 460"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="1200" height="460" fill="#f4f3e9" rx="0"/><text x="30" y="43" font-size="29" fill="#22372d" font-weight="bold">Seed entry → validation → reproducible regeneration</text><rect x="30" y="93" width="360" height="145" fill="#dce7cc" rx="12"/><text x="45" y="132" font-size="24" fill="#22372d" font-weight="bold">Open editor</text><text x="45" y="172" font-size="19" fill="#375145" font-weight="normal">Pause growth; keep current</text><text x="45" y="198" font-size="19" fill="#375145" font-weight="normal">tank.</text><rect x="420" y="93" width="360" height="145" fill="#dce7cc" rx="12"/><text x="435" y="132" font-size="24" fill="#22372d" font-weight="bold">Enter decimal seed</text><text x="435" y="172" font-size="19" fill="#375145" font-weight="normal">0–4294967295; validate first.</text><rect x="810" y="93" width="360" height="145" fill="#dce7cc" rx="12"/><text x="825" y="132" font-size="24" fill="#22372d" font-weight="bold">Regenerate</text><text x="825" y="172" font-size="19" fill="#375145" font-weight="normal">Fresh young colonies; same</text><text x="825" y="198" font-size="19" fill="#375145" font-weight="normal">rules.</text><path d="M390 165 H420 M780 165 H810" fill="none" stroke="#638175" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="299" font-size="20" fill="#22372d" font-weight="normal">Cancel / ↶: resume the existing tank unchanged. Invalid input: stay in editor with a clear message.</text><text x="30" y="355" font-size="21" fill="#22372d" font-weight="normal">Same seed + generator version + settings → same colony growth at the same simulation time.</text><text x="30" y="410" font-size="20" fill="#22372d" font-weight="normal">New random seed: choose a fresh seed, reset growth time, release old buffers safely, start again.</text></svg>