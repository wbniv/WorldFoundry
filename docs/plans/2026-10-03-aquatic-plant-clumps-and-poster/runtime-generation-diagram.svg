<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 680"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="1200" height="680" fill="#f4f3e9" rx="0"/><text x="30" y="42" font-size="30" fill="#22372d" font-weight="bold">A new ecosystem each selection — watch its colonies grow</text><rect x="35" y="85" width="330" height="125" fill="#dce7cc" rx="12"/><text x="51" y="120" font-size="20" fill="#22372d" font-weight="bold">1. Enter Planted Tank</text><text x="51" y="155" font-size="17" fill="#22372d" font-weight="normal">Fresh logged seed; fixed override</text><text x="51" y="184" font-size="17" fill="#22372d" font-weight="normal">for comparisons and bug reports.</text><rect x="435" y="85" width="330" height="125" fill="#dce7cc" rx="12"/><text x="451" y="120" font-size="20" fill="#22372d" font-weight="bold">2. Build the growth graph</text><text x="451" y="155" font-size="17" fill="#22372d" font-weight="normal">Native lineage and species rules.</text><text x="451" y="184" font-size="17" fill="#22372d" font-weight="normal">16 founders; bounded to 384 shoots.</text><rect x="835" y="85" width="330" height="125" fill="#dce7cc" rx="12"/><text x="851" y="120" font-size="20" fill="#22372d" font-weight="bold">3. Build mature rest meshes</text><text x="851" y="155" font-size="17" fill="#22372d" font-weight="normal">Water-type palette; eight groups.</text><text x="851" y="184" font-size="17" fill="#22372d" font-weight="normal">Forth registers and ticks chunks.</text><rect x="835" y="285" width="330" height="125" fill="#dce7cc" rx="12"/><text x="851" y="320" font-size="20" fill="#22372d" font-weight="bold">4. Grow during play</text><text x="851" y="355" font-size="17" fill="#22372d" font-weight="normal">Reveal shoots; scale rooted blades.</text><text x="851" y="384" font-size="17" fill="#22372d" font-weight="normal">Publish one dirty group per frame.</text><rect x="435" y="285" width="330" height="125" fill="#dce7cc" rx="12"/><text x="451" y="320" font-size="20" fill="#22372d" font-weight="bold">5. Gentle shared water</text><text x="451" y="355" font-size="17" fill="#22372d" font-weight="normal">Root-pinned native vertex bend;</text><text x="451" y="384" font-size="17" fill="#22372d" font-weight="normal">Native clock; slow coherent sway.</text><rect x="35" y="285" width="330" height="125" fill="#dce7cc" rx="12"/><text x="51" y="320" font-size="20" fill="#22372d" font-weight="bold">6. Leave / select again</text><text x="51" y="355" font-size="17" fill="#22372d" font-weight="normal">Release level-owned buffers.</text><text x="51" y="384" font-size="17" fill="#22372d" font-weight="normal">Next selection gets a new seed.</text><path d="M365 147 L435 147" fill="none" stroke="#638175" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M426 141 L435 147 L426 153" fill="none" stroke="#638175" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M765 147 L835 147" fill="none" stroke="#638175" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M826 141 L835 147 L826 153" fill="none" stroke="#638175" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M835 347 L765 347" fill="none" stroke="#638175" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M774 341 L765 347 L774 353" fill="none" stroke="#638175" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M435 347 L365 347" fill="none" stroke="#638175" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M374 341 L365 347 L374 353" fill="none" stroke="#638175" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1000 210 V285" fill="none" stroke="#638175" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="475" font-size="24" fill="#22372d" font-weight="normal">Biological data: founders → connected daughter shoots → age/size → leaf arrangement</text><text x="36" y="527" font-size="24" fill="#22372d" font-weight="normal">Render packaging: merge completed colonies by spatial bounds, independent of lineage</text><text x="36" y="580" font-size="21" fill="#22372d" font-weight="normal">Runtime: young founders → spreading colonies → mature canopy; gentle sway throughout.</text><text x="36" y="631" font-size="21" fill="#22372d" font-weight="normal">Profile loading, generation, mesh construction, deformation, rendering and memory separately.</text></svg>