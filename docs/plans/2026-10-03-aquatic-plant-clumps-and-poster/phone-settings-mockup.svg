andom seed</text><rect x="47" y="761" width="426" height="60" fill="#e6e7db" rx="10"/><text x="65" y="799" font-size="21" fill="#233f32" font-weight="bold">Cancel</text><text x="47" y="864" font-size="17" fill="#375145" font-weight="normal">Applying speed keeps your plants.</text><text x="47" y="887" font-size="17" fill="#375145" font-weight="normal">Regenerate starts young colonies again.</text></svg>