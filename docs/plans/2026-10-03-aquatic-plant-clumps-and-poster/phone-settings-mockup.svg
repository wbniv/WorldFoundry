<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 520 1050"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="520" height="1050" fill="#eef2e7" rx="0"/><rect x="22" y="22" width="476" height="1006" fill="#faf9f0" rx="24"/><text x="47" y="77" font-size="29" fill="#22372d" font-weight="bold">Plant settings</text><text x="47" y="117" font-size="18" fill="#53715c" font-weight="normal">Connected to your aquarium</text><text x="47" y="157" font-size="20" fill="#22372d" font-weight="bold">Water type</text><rect x="47" y="178" width="206" height="53" fill="#537c5f" rx="8"/><text x="62" y="212" font-size="22" fill="#faf9f0" font-weight="normal">Freshwater</text><rect x="267" y="178" width="206" height="53" fill="#d3dfc8" rx="8"/><text x="289" y="212" font-size="22" fill="#22372d" font-weight="normal">Saltwater</text><text x="47" y="275" font-size="22" fill="#22372d" font-weight="bold">Seed</text><rect x="47" y="294" width="426" height="62" fill="#dce7cc" rx="8"/><text x="64" y="335" font-size="28" fill="#22372d" font-weight="normal">713</text><text x="47" y="387" font-size="17" fill="#22372d" font-weight="normal">Tap to enter with the numeric keyboard</text><text x="47" y="443" font-size="22" fill="#22372d" font-weight="bold">Growth speed</text><text x="388" y="443" font-size="22" fill="#22372d" font-weight="bold">1×</text><path d="M60 478 H454" fill="none" stroke="#71896a" stroke-width="7" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="215" cy="478" r="12" fill="#426954"/><text x="47" y="516" font-size="15" fill="#22372d" font-weight="normal">Paused  0.25×  0.5×  1×  2×  4×  8×</text><text x="47" y="566" font-size="18" fill="#22372d" font-weight="normal">Growth age: 24 s · expanding colonies</text><text x="47" y="599" font-size="18" fill="#22372d" font-weight="normal">The tank is paused while you edit.</text><rect x="47" y="717" width="426" height="60" fill="#537c5f" rx="10"/><text x="65" y="755" font-size="21" fill="#faf9f0" font-weight="bold">Regenerate with this seed</text><rect x="47" y="794" width="426" height="60" fill="#d3dfc8" rx="10"/><text x="65" y="832" font-size="21" fill="#233f32" font-weight="bold">New random seed</text><rect x="47" y="871" width="426" height="60" fill="#e6e7db" rx="10"/><text x="65" y="909" font-size="21" fill="#233f32" font-weight="bold">Cancel</text><text x="47" y="974" font-size="17" fill="#375145" font-weight="normal">← applies and closes. Seed/type changes</text><text x="47" y="997" font-size="17" fill="#375145" font-weight="normal">restart growth; speed alone keeps plants.</text></svg>