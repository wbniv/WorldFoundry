<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="t d">
<title id="t">House and tree count settings</title><desc id="d">Two examples show count controls selecting complete houses or trees and their dependent lights, flowers and candles. The tower remains fixed.</desc>
<rect width="1000" height="450" rx="12" fill="#f5f3eb"/><text x="40" y="47" font-family="sans-serif" font-size="28" fill="#263d31">Counts select complete, stable placements</text>
<g font-family="sans-serif" fill="#263d31"><text x="55" y="104" font-size="22">Houses: 3</text><text x="55" y="248" font-size="22">Trees: 2</text><text x="55" y="398" font-size="17">Examples only · exact range will be established by performance testing</text></g>
<g fill="#f2e0c4" stroke="#74513b" stroke-width="3"><rect x="260" y="90" width="65" height="57"/><rect x="390" y="90" width="65" height="57"/><rect x="520" y="90" width="65" height="57"/></g><g fill="#a74c3b"><path d="M250 91 l42 -34 43 34z M380 91 l42 -34 43 34z M510 91 l42 -34 43 34z"/></g><g fill="#edb348"><rect x="280" y="110" width="13" height="14"/><rect x="410" y="110" width="13" height="14"/><rect x="540" y="110" width="13" height="14"/></g><text x="670" y="96" font-family="sans-serif" font-size="19" fill="#31463a">Each house carries</text><text x="670" y="125" font-family="sans-serif" font-size="19" fill="#31463a">its lights and flowers</text>
<g fill="#4f7c4c"><path d="M285 216 l-32 70 h64z M415 216 l-32 70 h64z"/></g><g stroke="#79543a" stroke-width="8"><path d="M285 284 v22 M415 284 v22"/></g><g fill="#f0bb55"><circle cx="272" cy="269" r="4"/><circle cx="296" cy="256" r="4"/><circle cx="403" cy="269" r="4"/><circle cx="425" cy="256" r="4"/></g><text x="670" y="241" font-family="sans-serif" font-size="19" fill="#31463a">Each tree carries</text><text x="670" y="270" font-family="sans-serif" font-size="19" fill="#31463a">its seasonal candles</text>
<text x="260" y="354" font-family="sans-serif" font-size="19" fill="#31463a">Changing a count keeps all remaining placements in place.</text></svg>
