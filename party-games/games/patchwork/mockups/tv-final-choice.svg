<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">TV final turn showing three shared freely selectable cards</title><defs><pattern id="stitch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#ffffff" stroke-opacity=".15"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#287c78"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#faf5e9" stroke="none" stroke-width="1"/><text x="48" y="60" fill="#243b45" font-size="34" font-weight="800">ONE LAST PATCH</text><text x="48" y="106" fill="#287c78" font-size="23" font-weight="700">Round 3 · Turn 6 · No die roll</text><text x="48" y="155" fill="#243b45" font-size="24" font-weight="400">Everyone chooses any one of these three cards.</text><rect x="140" y="205" width="280" height="250" rx="14" fill="#fff" stroke="#ddd8cb" stroke-width="1"/><text x="152" y="228" fill="#637875" font-size="12" font-weight="700">CARD 1</text><rect x="164" y="243" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><rect x="164" y="283" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><rect x="164" y="323" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><rect x="204" y="323" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><rect x="244" y="323" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><text x="152" y="443" fill="#637875" font-size="13" font-weight="400">5 cells</text><text x="160" y="420" fill="#637875" font-size="17" font-weight="400">Available to everyone</text><rect x="500" y="205" width="280" height="250" rx="14" fill="#fff" stroke="#ddd8cb" stroke-width="1"/><text x="512" y="228" fill="#637875" font-size="12" font-weight="700">CARD 2</text><rect x="524" y="243" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><rect x="564" y="243" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><rect x="604" y="243" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><rect x="564" y="283" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><text x="512" y="443" fill="#637875" font-size="13" font-weight="400">4 cells</text><text x="520" y="420" fill="#637875" font-size="17" font-weight="400">Available to everyone</text><rect x="860" y="205" width="280" height="250" rx="14" fill="#fff" stroke="#ddd8cb" stroke-width="1"/><text x="872" y="228" fill="#637875" font-size="12" font-weight="700">CARD 3</text><rect x="884" y="243" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><rect x="924" y="243" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><rect x="924" y="283" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><rect x="964" y="283" width="38" height="38" rx="3" fill="#c87360" stroke="none" stroke-width="1"/><text x="872" y="443" fill="#637875" font-size="13" font-weight="400">4 cells</text><text x="880" y="420" fill="#637875" font-size="17" font-weight="400">Available to everyone</text><text x="140" y="515" fill="#287c78" font-size="24" font-weight="700">Maya  ✓ Ready</text><text x="500" y="515" fill="#243b45" font-size="24" font-weight="400">Leo  Choosing…</text><text x="860" y="515" fill="#287c78" font-size="24" font-weight="700">Nora  ✓ Ready</text><rect x="140" y="570" width="1000" height="82" rx="16" fill="#fff" stroke="none" stroke-width="1"/><text x="174" y="618" fill="#243b45" font-size="24" font-weight="700">Next: scoring preparation → shared score counting</text><text x="48" y="690" fill="#637875" font-size="17" font-weight="400">Several players may choose the same card. Choices do not consume cards.</text></g></svg>