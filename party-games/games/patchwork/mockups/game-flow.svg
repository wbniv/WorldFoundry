<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title"><title id="title">Game flow including current-turn editing and scoring preparation</title><defs><pattern id="stitch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#ffffff" stroke-opacity=".15"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#287c78"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1100" height="650" rx="0" fill="#faf5e9" stroke="none" stroke-width="1"/><text x="35" y="50" fill="#243b45" font-size="27" font-weight="800">GAME AND SCORING FLOW</text><rect x="40" y="95" width="300" height="90" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="60" y="129" fill="#243b45" font-size="19" font-weight="700">Lobby</text><text x="60" y="157" fill="#637875" font-size="14" font-weight="400">Join and ready</text><rect x="395" y="95" width="300" height="90" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="415" y="129" fill="#243b45" font-size="19" font-weight="700">Start patch</text><text x="415" y="157" fill="#637875" font-size="14" font-weight="400">Place your dealt shape</text><rect x="750" y="95" width="300" height="90" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="770" y="129" fill="#243b45" font-size="19" font-weight="700">Shared selection</text><text x="770" y="157" fill="#637875" font-size="14" font-weight="400">Roll; show current card</text><rect x="750" y="275" width="300" height="90" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="770" y="309" fill="#243b45" font-size="19" font-weight="700">Place / pass</text><text x="770" y="337" fill="#637875" font-size="14" font-weight="400">Draft → ready → edit</text><rect x="395" y="275" width="300" height="90" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="415" y="309" fill="#243b45" font-size="19" font-weight="700">Commit turn</text><text x="415" y="337" fill="#637875" font-size="14" font-weight="400">Host advances; discard card</text><rect x="40" y="275" width="300" height="90" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="60" y="309" fill="#243b45" font-size="19" font-weight="700">Scoring preparation</text><text x="60" y="337" fill="#637875" font-size="14" font-weight="400">Specials allowed → score-ready</text><rect x="40" y="465" width="300" height="90" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="60" y="499" fill="#243b45" font-size="19" font-weight="700">Lock &amp; record</text><text x="60" y="527" fill="#637875" font-size="14" font-weight="400">Save quilt and round score</text><rect x="395" y="465" width="300" height="90" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="415" y="499" fill="#243b45" font-size="19" font-weight="700">TV score ceremony</text><text x="415" y="527" fill="#637875" font-size="14" font-weight="400">Revisit snapshots; count empties</text><rect x="750" y="465" width="300" height="90" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="770" y="499" fill="#243b45" font-size="19" font-weight="700">Results / rematch</text><text x="770" y="527" fill="#637875" font-size="14" font-weight="400">Shared winners; fresh deck</text><path d="M340 140 L395 140" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 140 L750 140" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 185 L900 275" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 320 L695 320" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M395 320 L340 320" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M190 365 L190 465" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M340 510 L395 510" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 510 L750 510" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><text x="335" y="255" fill="#287c78" font-size="14" font-weight="400">Every sixth turn</text><text x="370" y="590" fill="#287c78" font-size="17" font-weight="400">Round 1/2: record → refill circle → next round</text><text x="370" y="620" fill="#287c78" font-size="17" font-weight="400">Round 3: record → final TV ceremony → results</text><path d="M40 510H20V80H900V95" fill="none" stroke="#287c78" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="360" y="76" fill="#287c78" font-size="13" font-weight="400">Rounds 1–2: refill and resume</text><text x="348" y="492" fill="#287c78" font-size="12" font-weight="400">Round 3</text><path d="M545 275V225H900V185" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><text x="430" y="216" fill="#287c78" font-size="14" font-weight="400">More turns: next selection</text></g></svg>