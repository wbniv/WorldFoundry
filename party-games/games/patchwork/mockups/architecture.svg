<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title"><title id="title">Phones and Chromecast communicate with one authoritative room server</title><defs><pattern id="stitch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#ffffff" stroke-opacity=".15"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#287c78"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1100" height="620" rx="0" fill="#faf5e9" stroke="none" stroke-width="1"/><text x="35" y="50" fill="#243b45" font-size="26" font-weight="800">ONE AUTHORITATIVE GAME · MANY SCREENS</text><rect x="55" y="105" width="350" height="115" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="75" y="139" fill="#243b45" font-size="19" font-weight="700">Phones</text><text x="75" y="167" fill="#637875" font-size="14" font-weight="400">Own quilt, draft and action controls</text><rect x="650" y="105" width="380" height="115" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="670" y="139" fill="#243b45" font-size="19" font-weight="700">Chromecast receiver</text><text x="670" y="167" fill="#637875" font-size="14" font-weight="400">Shared cards and scoring presentation</text><rect x="310" y="345" width="490" height="150" rx="14" fill="#fff" stroke="#c8d8d1" stroke-width="2"/><text x="330" y="379" fill="#243b45" font-size="19" font-weight="700">Node / WebSocket game server</text><text x="330" y="407" fill="#637875" font-size="14" font-weight="400">Cards · geometry · turns · scores · snapshots</text><text x="330" y="453" fill="#287c78" font-size="17" font-weight="700">One isolated game per room</text><path d="M230 220 L410 345" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 345 L295 220" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 345 L835 220" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><path d="M895 220 L785 345" fill="none" stroke="#287c78" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="279" fill="#637875" font-size="15" font-weight="400">Commands + resume credential</text><text x="45" y="305" fill="#637875" font-size="15" font-weight="400">Personal snapshot + acknowledgement</text><text x="740" y="279" fill="#637875" font-size="15" font-weight="400">Receiver ready / snapshot request</text><text x="790" y="305" fill="#637875" font-size="15" font-weight="400">Public state + score frames</text><rect x="55" y="535" width="975" height="50" rx="12" fill="#e6eee6" stroke="none" stroke-width="1"/><text x="77" y="568" fill="#287c78" font-size="21" font-weight="700">Cast launches the TV. WebSockets keep all screens synchronized.</text></g></svg>