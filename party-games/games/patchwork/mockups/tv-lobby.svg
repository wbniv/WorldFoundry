<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">TV lobby with room code, join QR placeholder and readiness</title><defs><pattern id="stitch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#ffffff" stroke-opacity=".15"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#287c78"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#faf5e9" stroke="none" stroke-width="1"/><text x="65" y="90" fill="#243b45" font-size="38" font-weight="800">PATCHWORK DOODLE</text><text x="65" y="143" fill="#637875" font-size="25" font-weight="400">A little quilt. A shared table. Everyone plays.</text><rect x="65" y="195" width="535" height="365" rx="20" fill="#243b45" stroke="none" stroke-width="1"/><text x="105" y="250" fill="#fff" font-size="18" font-weight="700">JOIN ON YOUR PHONE</text><text x="105" y="340" fill="#edb84f" font-size="76" font-weight="800">QUIL</text><text x="105" y="390" fill="#fff" font-size="19" font-weight="400">Enter the room code at the join URL</text><rect x="440" y="430" width="120" height="94" rx="8" fill="#fff" stroke="none" stroke-width="1"/><text x="454" y="463" fill="#243b45" font-size="17" font-weight="700">QR join</text><text x="450" y="490" fill="#637875" font-size="12" font-weight="400">placeholder</text><text x="105" y="501" fill="#fff" font-size="18" font-weight="400">[deployment URL]/join</text><text x="690" y="246" fill="#287c78" font-size="18" font-weight="700">YOUR QUILTERS</text><rect x="680" y="275" width="525" height="53" rx="12" fill="#fff" stroke="none" stroke-width="1"/><text x="703" y="310" fill="#243b45" font-size="24" font-weight="400">Maya · host · ready</text><rect x="680" y="340" width="525" height="53" rx="12" fill="#fff" stroke="none" stroke-width="1"/><text x="703" y="375" fill="#243b45" font-size="24" font-weight="400">Leo · ready</text><rect x="680" y="405" width="525" height="53" rx="12" fill="#fff" stroke="none" stroke-width="1"/><text x="703" y="440" fill="#243b45" font-size="24" font-weight="400">Nora · connected</text><text x="680" y="521" fill="#637875" font-size="19" font-weight="400">Waiting for Nora to be ready</text><text x="65" y="635" fill="#243b45" font-size="22" font-weight="400">Phones: personal quilts and placement</text><text x="65" y="674" fill="#287c78" font-size="22" font-weight="400">TV: shared cards, round progress and the final score reveal</text></g></svg>